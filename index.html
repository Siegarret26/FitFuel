    </div>
  );
}

/* ─── WORKOUTS PAGE ──────────────────────────────── */
function WorkoutsPage({aiWorkouts=[],settings={},favoriteWorkouts=[],onToggleFavoriteWorkout,pendingWorkoutStart,onConsumePendingWorkoutStart}){
  const cats=["All","❤️ Favorites","Strength","Cardio","Bodyweight","Core","Flexibility","Mobility","Recovery","Fat Loss","Muscle Gain","Endurance","Beginner","Intermediate","Advanced"];
  const [cat,setCat]=useState("All");
  const [search,setSearch]=useState("");
  const [aiFilterIds,setAiFilterIds]=useState(null);
  const [aiSearchLoading,setAiSearchLoading]=useState(false);
  const [aiSearchError,setAiSearchError]=useState("");
  const [active,setActive]=useState(null);
  const [timer,setTimer]=useState(0);
  const [running,setRunning]=useState(false);
  const [doneSteps,setDoneSteps]=useState([]);
  const [detailWorkout,setDetailWorkout]=useState(null);
  const intv=useRef(null);
  const bannerRef=useRef(null);
  const [sessionTick,setSessionTick]=useState(0);
  const allWorkouts=[...workoutsData,...aiWorkouts];
  const filtered=allWorkouts.filter(w=>
    (cat==="All"||(cat==="❤️ Favorites"?favoriteWorkouts.includes(w.id):(w.cat===cat||w.diff===cat)))&&(
    aiFilterIds
      ? aiFilterIds.map(String).includes(String(w.id))
      : (w.name.toLowerCase().includes(search.toLowerCase())||w.desc.toLowerCase().includes(search.toLowerCase()))
  ));
  const runSmartSearch=async()=>{
    if(!search.trim()){ setAiFilterIds(null); return; }
    if(!settings.aiApiKey){ setAiSearchError("Add a Gemini API key in Settings → AI Coach to use AI search."); return; }
    setAiSearchLoading(true); setAiSearchError("");
    try{
      const catalog=allWorkouts.map(w=>({id:w.id,name:w.name,cat:w.cat,diff:w.diff,duration:w.duration,equipment:w.equipment,muscles:w.muscles,calories:w.calories}));
      const sys=`You help filter a workout catalog by user intent. Respond with strict JSON only: {"ids":[...matching id values from the catalog...]}. Only include ids that exist in the given catalog. Return an empty array if nothing matches well.`;
      const data=await completeGeminiJSON({apiKey:settings.aiApiKey,model:settings.aiModel,messages:[
        {role:"system",content:sys},
        {role:"user",content:`Catalog: ${JSON.stringify(catalog)}\n\nQuery: "${search}"`},
      ]});
      setAiFilterIds(Array.isArray(data.ids)?data.ids:[]);
    }catch(err){ setAiSearchError(err.message||"AI search failed."); }
    finally{ setAiSearchLoading(false); }
  };
  useEffect(()=>{
    if(running&&timer>0){ intv.current=setInterval(()=>setTimer(t=>t-1),1000); }
    else{ clearInterval(intv.current); if(timer===0)setRunning(false); }
    return()=>clearInterval(intv.current);
  },[running,timer]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const startW=w=>{setActive(w);setTimer(parseInt(w.duration)*60);setRunning(false);setDoneSteps([]);setSessionTick(t=>t+1);};
  useEffect(()=>{
    if(!pendingWorkoutStart) return;
    const match=allWorkouts.find(w=>String(w.id)===String(pendingWorkoutStart));
    if(match) startW(match);
    onConsumePendingWorkoutStart&&onConsumePendingWorkoutStart();
    // eslint-disable-next-line
  },[pendingWorkoutStart]);
  const toggleStep=i=>setDoneSteps(prev=>prev.includes(i)?prev.filter(x=>x!==i):[...prev,i]);
  const pct=active?(timer/(parseInt(active.duration)*60))*100:0;
  /* Feature 4 — auto-scroll to the Active Workout tracker every time a workout is (re)started */
  useEffect(()=>{
    if(sessionTick>0&&bannerRef.current){
      bannerRef.current.scrollIntoView({behavior:"smooth",block:"start"});
    }
  },[sessionTick]);
  return(
    <div className="page-wrap">
      {detailWorkout&&<WorkoutDetailModal w={detailWorkout} onClose={()=>setDetailWorkout(null)} onStart={startW}/>}
      <div className="page-header fade-up">
        <h1 className="page-title">Workouts 💪</h1>
        <p className="page-sub">{allWorkouts.length} workouts across strength, cardio, bodyweight, and more.</p>
      </div>
      <div className="search-wrap">
        <span className="search-icon">🔍</span>
        <input className="search-input" value={search} onChange={e=>{setSearch(e.target.value);setAiFilterIds(null);setAiSearchError("");}} onKeyDown={e=>e.key==="Enter"&&runSmartSearch()} placeholder="Search workouts, or ask AI in plain English…" aria-label="Search workouts"/>
        <button className="smart-search-btn" onClick={runSmartSearch} disabled={aiSearchLoading} title="Ask AI to interpret this search">{aiSearchLoading?"…":"✨"}</button>
      </div>
      {aiSearchError&&<p style={{fontSize:12,color:"var(--accent)",marginTop:-8,marginBottom:16}}>{aiSearchError}</p>}
      {aiFilterIds!==null&&!aiSearchError&&<p style={{fontSize:12,color:"var(--text-mid)",marginTop:-8,marginBottom:16}}>✨ Showing AI matches for "{search}" — <span style={{color:"var(--accent)",cursor:"pointer"}} onClick={()=>setAiFilterIds(null)}>clear</span></p>}
      <FilterBar options={cats} value={cat} onChange={setCat}/>

      {/* ACTIVE SESSION */}
      {active&&(
        <div ref={bannerRef} className="active-workout-banner scale-in" style={{marginBottom:32,scrollMarginTop:"calc(var(--nav-h) + 20px)"}}>
          <div style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"stretch"}}>

            {/* STATIC IMAGE — original layout */}
            <div style={{width:120,flexShrink:0,borderRadius:14,overflow:"hidden"}}>
              <img src={active.image} alt={active.imageAlt} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
            </div>

            {/* WORKOUT INFO */}
            <div style={{flex:1,minWidth:200}}>
              <div style={{fontSize:11,fontWeight:700,color:"var(--banner-label)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:6}}>Active Workout</div>
              <h2 style={{fontSize:20,fontWeight:800,color:"var(--banner-heading)",marginBottom:8}}>{active.name}</h2>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
                <span className={"tag "+({"Beginner":"tag-diff-beginner","Intermediate":"tag-diff-intermediate","Advanced":"tag-diff-advanced"}[active.diff]||"tag-diff-beginner")}>{active.diff}</span>
                <span className="workout-dur-chip">⏱ {active.duration}m</span>
                <span style={{fontSize:12,fontWeight:600,color:"var(--banner-pill-text)",opacity:0.7}}>{doneSteps.length}/{active.exercises.length} done</span>
              </div>

              {/* INTERACTIVE EXERCISE CHECKLIST — each row expands for technique info */}
              <div className="exercise-list active-session-list">
                {active.exercises.map((ex,i)=>(
                  <ExerciseRow key={i} name={ex.name} detail={ex.detail} rest={ex.rest}
                    showCheckbox={!ex.rest} done={doneSteps.includes(i)} onToggleDone={()=>toggleStep(i)}/>
                ))}
              </div>

              {/* ALL DONE celebration */}
              {doneSteps.length===active.exercises.length&&active.exercises.length>0&&(
                <div style={{marginTop:12,padding:"10px 14px",borderRadius:12,background:"rgba(56,217,120,0.13)",border:"1px solid rgba(56,217,120,0.3)",fontSize:13,fontWeight:700,color:"#38D978",display:"flex",alignItems:"center",gap:8}}>
                  🎉 All steps complete! Great work!
                </div>
              )}
            </div>

            {/* TIMER */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,minWidth:140}}>
              <div className="timer-display">{fmt(timer)}</div>
              <div style={{width:"100%",height:6,background:"var(--banner-track)",borderRadius:3,overflow:"hidden"}}>
                <div style={{width:`${100-pct}%`,height:"100%",background:"var(--banner-track-fill)",borderRadius:3,transition:"width 1s linear"}}/>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn-primary" onClick={()=>setRunning(!running)} style={{padding:"9px 22px",fontSize:14}}>
                  {running?"⏸ Pause":"▶ Start"}
                </button>
                <button onClick={()=>{setActive(null);setRunning(false);clearInterval(intv.current);setDoneSteps([]);}} style={{background:"var(--banner-btn-bg)",border:"1px solid var(--banner-btn-border)",borderRadius:50,padding:"9px 14px",cursor:"pointer",color:"var(--banner-heading)",fontSize:14}}>✕</button>
              </div>
            </div>

          </div>
        </div>
      )}

      {filtered.length===0
        ? <div style={{textAlign:"center",padding:"60px 0",color:"var(--text-mid)"}}>
            {cat==="❤️ Favorites"?"No favorited workouts yet — tap the heart on any workout to save it here.":"No workouts found. Try clearing your search."}
          </div>
        : <div className="grid-auto-fit">
            {filtered.map(w=><WorkoutCard key={w.id} w={w} onStart={startW} isActive={active?.id===w.id} onOpenDetail={setDetailWorkout} onToggleFavorite={onToggleFavoriteWorkout} favorited={favoriteWorkouts.includes(w.id)}/>)}
          </div>
      }
    </div>
  );
}

/* ─── MEALS PAGE ────────────────────────────────── */
function MealsPage({savedMeals,onToggleMeal,user,aiMeals=[],settings={},pendingMealDetail,onConsumePendingMealDetail}){
  const cats=["All","❤️ Saved","Breakfast","Lunch","Dinner","Snacks","Vegetarian"];
  const [cat,setCat]=useState(()=>user?.onboarding?.dietaryPreference==="Vegetarian"?"Vegetarian":"All");
  const [search,setSearch]=useState("");
  const [aiFilterIds,setAiFilterIds]=useState(null);
  const [aiSearchLoading,setAiSearchLoading]=useState(false);
  const [aiSearchError,setAiSearchError]=useState("");
  const [detailMeal,setDetailMeal]=useState(null);
  const allMeals=[...mealsData,...aiMeals];
  useEffect(()=>{
    if(!pendingMealDetail) return;
    const match=allMeals.find(m=>String(m.id)===String(pendingMealDetail));
    if(match) setDetailMeal(match);
    onConsumePendingMealDetail&&onConsumePendingMealDetail();
    // eslint-disable-next-line
  },[pendingMealDetail]);
  const filtered=allMeals.filter(m=>
    (cat==="All"||(cat==="❤️ Saved"?savedMeals.includes(m.id):m.cat===cat))&&(
    aiFilterIds ? aiFilterIds.map(String).includes(String(m.id)) : m.name.toLowerCase().includes(search.toLowerCase())
  ));
  const runSmartSearch=async()=>{
    if(!search.trim()){ setAiFilterIds(null); return; }
    if(!settings.aiApiKey){ setAiSearchError("Add a Gemini API key in Settings → AI Coach to use AI search."); return; }
    setAiSearchLoading(true); setAiSearchError("");
    try{
      const catalog=allMeals.map(m=>({id:m.id,name:m.name,cat:m.cat,cal:m.cal,protein:m.protein,carbs:m.carbs,fat:m.fat}));
      const sys=`You help filter a meal catalog by user intent (e.g. calorie/macro limits, meal type, ingredients implied). Respond with strict JSON only: {"ids":[...matching id values from the catalog...]}. Only include ids that exist in the catalog. Return an empty array if nothing matches well.`;
      const data=await completeGeminiJSON({apiKey:settings.aiApiKey,model:settings.aiModel,messages:[
        {role:"system",content:sys},
        {role:"user",content:`Catalog: ${JSON.stringify(catalog)}\n\nQuery: "${search}"`},
      ]});
      setAiFilterIds(Array.isArray(data.ids)?data.ids:[]);
    }catch(err){ setAiSearchError(err.message||"AI search failed."); }
    finally{ setAiSearchLoading(false); }
  };
  return(
    <div className="page-wrap">
      {detailMeal&&<MealDetailModal m={detailMeal} onClose={()=>setDetailMeal(null)} onSave={onToggleMeal} saved={savedMeals.includes(detailMeal.id)}/>}
      <div className="page-header fade-up">
        <h1 className="page-title">Healthy Meals 🥗</h1>
        <p className="page-sub">{allMeals.length} simple, nutritious recipes for every meal of the day.</p>
      </div>
      <div style={{display:"flex",gap:12,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
        <div className="search-wrap" style={{flex:1,minWidth:200,marginBottom:0}}>
          <span className="search-icon">🔍</span>
          <input className="search-input" value={search} onChange={e=>{setSearch(e.target.value);setAiFilterIds(null);setAiSearchError("");}} onKeyDown={e=>e.key==="Enter"&&runSmartSearch()} placeholder="Search, or ask AI: high-protein under 500 cal…" aria-label="Search meals"/>
          <button className="smart-search-btn" onClick={runSmartSearch} disabled={aiSearchLoading} title="Ask AI to interpret this search">{aiSearchLoading?"…":"✨"}</button>
        </div>
        {savedMeals.length>0&&(
          <div style={{display:"flex",alignItems:"center",gap:7,padding:"10px 18px",borderRadius:50,background:"var(--accent-tint-2)",border:"1px solid var(--accent-tint-3)",fontSize:13,fontWeight:600,color:"var(--accent)"}}>
            ❤️ {savedMeals.length} saved
          </div>
        )}
      </div>
      {aiSearchError&&<p style={{fontSize:12,color:"var(--accent)",marginBottom:14}}>{aiSearchError}</p>}
      {aiFilterIds!==null&&!aiSearchError&&<p style={{fontSize:12,color:"var(--text-mid)",marginBottom:14}}>✨ Showing AI matches for "{search}" — <span style={{color:"var(--accent)",cursor:"pointer"}} onClick={()=>setAiFilterIds(null)}>clear</span></p>}
      <FilterBar options={cats} value={cat} onChange={setCat}/>
      {filtered.length===0
        ? <div style={{textAlign:"center",padding:"60px 0",color:"var(--text-mid)"}}>
            {cat==="❤️ Saved"?"No saved meals yet — tap the heart on any meal to save it here.":"No meals found. Try a different search or filter."}
          </div>
        : <div className="grid-auto-fit-sm">
            {filtered.map(m=><MealCard key={m.id} m={m} onSave={onToggleMeal} saved={savedMeals.includes(m.id)} onOpenDetail={setDetailMeal}/>)}
          </div>
      }
    </div>
  );
}

  if(msg.role==="system-note"){
    return <div className="chat-system-note">{msg.content}</div>;
  }
  const isUser=msg.role==="user";
  const textPart=Array.isArray(msg.content)?msg.content.find(c=>c.type==="text")?.text:msg.content;
  const imagePart=Array.isArray(msg.content)?msg.content.find(c=>c.type==="image_url"):null;

    <div className={"chat-bubble-row"+(isUser?" user":"")}>
      <div className={"chat-bubble"+(isUser?" user":" assistant")}>

/* Renders a structured recommendation/generation result inline in the chat (Feature 6).
   This same object is what gets saved as part of the conversation (Feature 1) — no
   separate persistence needed, since it's just part of the message. */
function AIContentCard({card,onStartWorkout,onOpenMealDetail,onToggleMeal,onToggleFavoriteWorkout,favoriteWorkouts=[],savedMeals=[],onSaveGeneratedWorkout,onSaveGeneratedMeal,onSaveGeneratedPlan}){
  const [saved,setSaved]=useState(false);
  const [expanded,setExpanded]=useState(false);
  if(!card||!card.data) return null;
  const {type,source,data}=card;
  const isLibrary=source==="library";

  if(type==="workout"){
    const favored=isLibrary&&favoriteWorkouts.includes(data.id);
    return(
      <div className="ai-content-card">
        <div className="ai-content-card-badge">{isLibrary?"📚 Found in FitFuel":"✨ Newly generated"}</div>
        <img src={data.image||"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=600&q=80"} alt={data.name} className="ai-content-card-img"/>
        <div className="ai-content-card-body">
          <h4>{data.name}</h4>
          {data.description&&<p>{data.description}</p>}
          <div className="ai-content-card-meta">
            {data.duration&&<span>⏱ {data.duration} min</span>}
            {(data.difficulty||data.diff)&&<span>📶 {data.difficulty||data.diff}</span>}
            {data.calories&&<span>🔥 {data.calories} kcal</span>}
          </div>
          {data.muscles&&data.muscles.length>0&&<div className="ai-content-card-tags">{data.muscles.map(m=><span key={m}>{m}</span>)}</div>}
          <div className="ai-content-card-actions">
            {isLibrary ? (
              <>
                <button className="btn-primary" onClick={()=>onStartWorkout(data.id)}>▶ Start Workout</button>
                <button className="btn-secondary" onClick={()=>onStartWorkout(data.id)}>View Workout</button>
                <button className="btn-secondary" onClick={()=>onToggleFavoriteWorkout(data.id)}>{favored?"❤️ Favourited":"🤍 Favourite"}</button>
              </>
            ) : (
              <>
                <button className="btn-secondary" onClick={()=>setExpanded(e=>!e)}>{expanded?"Hide Details":"View Details"}</button>
                <button className="btn-primary" onClick={()=>{onSaveGeneratedWorkout(data);setSaved(true);}} disabled={saved}>{saved?"✓ Saved":"💾 Save to Library"}</button>
              </>
            )}
          </div>
          {expanded&&!isLibrary&&(
            <div className="ai-content-card-expand">
              {data.warmup&&data.warmup.length>0&&<><div className="analytics-section-title" style={{fontSize:12}}>Warm-up</div><ul className="exercise-info-list">{data.warmup.map((w,i)=><li key={i}>{w}</li>)}</ul></>}
              <div className="analytics-section-title" style={{fontSize:12}}>Exercises</div>
              <ul className="exercise-info-list">{(data.exercises||[]).map((e,i)=><li key={i}>{e.name} — {e.sets}×{e.reps}, rest {e.rest}</li>)}</ul>
              {data.cooldown&&data.cooldown.length>0&&<><div className="analytics-section-title" style={{fontSize:12}}>Cool-down</div><ul className="exercise-info-list">{data.cooldown.map((c,i)=><li key={i}>{c}</li>)}</ul></>}
            </div>
          )}
        </div>
      </div>
    );
  }

  if(type==="meal"){
    const favored=isLibrary&&savedMeals.includes(data.id);
    return(
      <div className="ai-content-card">
        <div className="ai-content-card-badge">{isLibrary?"📚 Found in FitFuel":"✨ Newly generated"}</div>
        <img src={data.image||"https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=600&q=80"} alt={data.name} className="ai-content-card-img"/>
        <div className="ai-content-card-body">
          <h4>{data.name}</h4>
          <div className="ai-content-card-meta">
            <span>🔥 {data.cal||data.calories} kcal</span>
            <span>💪 {data.protein}g protein</span>
            {(data.prepTime||data.cookTime)!=null&&<span>⏱ {(data.prepTime||0)+(data.cookTime||0)} min</span>}
          </div>
          <div className="ai-content-card-actions">
            {isLibrary ? (
              <>
                <button className="btn-primary" onClick={()=>onOpenMealDetail(data.id)}>👀 View Recipe</button>
                <button className="btn-secondary" onClick={()=>onToggleMeal(data.id)}>{favored?"❤️ Favourited":"🤍 Favourite"}</button>
              </>
            ) : (
              <>
                <button className="btn-secondary" onClick={()=>setExpanded(e=>!e)}>{expanded?"Hide Recipe":"View Recipe"}</button>
                <button className="btn-primary" onClick={()=>{onSaveGeneratedMeal(data);setSaved(true);}} disabled={saved}>{saved?"✓ Saved":"💾 Save to Library"}</button>
              </>
            )}
          </div>
          {expanded&&!isLibrary&&(
            <div className="ai-content-card-expand">
              <div className="analytics-section-title" style={{fontSize:12}}>Ingredients</div>
              <ul className="exercise-info-list">{(data.ingredients||[]).map((ing,i)=><li key={i}>{ing}</li>)}</ul>
              <div className="analytics-section-title" style={{fontSize:12}}>Instructions</div>
              <ul className="exercise-info-list">{(data.instructions||[]).map((step,i)=><li key={i}>{step}</li>)}</ul>
            </div>
          )}
        </div>
      </div>
    );
  }

  if(type==="plan"){
    return(
      <div className="ai-content-card">
        <div className="ai-content-card-badge">{isLibrary?"📚 Found in FitFuel":"✨ Newly generated"}</div>
        <div className="ai-content-card-body" style={{paddingTop:16}}>
          <h4>{data.name}</h4>
          <div className="ai-content-card-meta">
            <span>🎯 {data.goal}</span>
            <span>📅 {(data.weeks||[]).length} weeks</span>
          </div>
          <div className="ai-content-card-actions">
            <button className="btn-secondary" onClick={()=>setExpanded(e=>!e)}>{expanded?"Hide Details":"View Details"}</button>
            {!isLibrary&&<button className="btn-primary" onClick={()=>{onSaveGeneratedPlan(data);setSaved(true);}} disabled={saved}>{saved?"✓ Saved":"💾 Save Plan"}</button>}
          </div>
          {expanded&&(
            <div className="ai-content-card-expand">
              {(data.weeks||[]).map((w,i)=>(
                <div key={i} style={{marginBottom:10}}>
                  <strong style={{fontSize:12,color:"var(--accent)"}}>Week {w.weekNumber} — {w.focus}</strong>
                  <ul className="exercise-info-list">{(w.sessions||[]).map((s,j)=><li key={j}>{s.day}: {s.type} — {s.description}</li>)}</ul>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  if(type==="report"){
    return(
      <div className="ai-content-card">
        <div className="ai-content-card-badge">📊 Weekly Report</div>
        <div className="ai-content-card-body" style={{paddingTop:16}}>
          <div className="activity-stat-grid" style={{marginBottom:12}}>
            <ActivityStat icon="🏋️" label="Workouts" value={data.workoutsCompleted}/>
            <ActivityStat icon="🏃" label="Running" value={data.runningDistance.toFixed(1)} unit="km"/>
            <ActivityStat icon="🔥" label="Calories" value={data.caloriesBurned} unit="kcal"/>
            {data.goalCompletion!==null&&<ActivityStat icon="🎯" label="Goals" value={data.goalCompletion} unit="%"/>}
          </div>
          {data.summary&&<p style={{fontSize:13,color:"var(--text)",lineHeight:1.6,margin:0}}>{data.summary}</p>}
        </div>
      </div>
    );
  }
  return null;
}

function AIWorkoutGenerator({apiKey,model,contextSummary,onSaveWorkout}){
  const [duration,setDuration]=useState(45);
  const [focus,setFocus]=useState("Full Body");
  const [equipment,setEquipment]=useState(["Dumbbells"]);
  const [difficulty,setDifficulty]=useState("Intermediate");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [result,setResult]=useState(null);
  const [saved,setSaved]=useState(false);
  const focusOptions=["Full Body","Push","Pull","Legs","Upper Body","Lower Body","Core","Cardio/HIIT"];
  const equipmentOptions=["No Equipment","Dumbbells","Barbell","Resistance Bands","Pull-up Bar","Machines","Full Gym"];
  const diffOptions=["Beginner","Intermediate","Advanced"];
  const toggleEquip=opt=>setEquipment(e=>e.includes(opt)?e.filter(x=>x!==opt):[...e,opt]);

  const generate=async()=>{
    setLoading(true); setError(""); setResult(null); setSaved(false);
    try{
      const sys=buildSystemPrompt(contextSummary,`Generate a single workout as strict JSON only, matching exactly this shape:
{"name":string,"description":string,"difficulty":"Beginner"|"Intermediate"|"Advanced","duration":number,"calories":number,"equipment":string[],"muscles":string[],"warmup":string[],"exercises":[{"name":string,"sets":number,"reps":string,"rest":string,"tempo":string}],"cooldown":string[]}
Return ONLY the JSON object, nothing else.`);
      const userMsg=`Create a ${duration}-minute ${difficulty.toLowerCase()} ${focus} workout using: ${equipment.join(", ")||"no equipment"}.`;
      const data=await completeGeminiJSON({apiKey,model,messages:[{role:"system",content:sys},{role:"user",content:userMsg}]});
      setResult(data);
    }catch(err){ setError(err.message||"Something went wrong."); }
    finally{ setLoading(false); }
  };
  const save=()=>{
    if(!result) return;
    const workout={
      id:"ai_w_"+Date.now(), aiGenerated:true,
      name:result.name||"AI Workout", cat:focus, duration:result.duration||duration,
      diff:result.difficulty||difficulty, desc:result.description||"",

function AIProgressPhotos({apiKey,model}){
  const [photos,setPhotos]=useState(()=>loadLS("ff_progress_photos",[]));
  const [selected,setSelected]=useState([]);
  const [aiText,setAiText]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiError,setAiError]=useState("");
  const [uploadError,setUploadError]=useState("");
  const fileInputRef=useRef(null);

  const handleUpload=async e=>{
    const file=e.target.files?.[0]; if(!file) return;
    setUploadError("");
    try{
      const dataUrl=await downscaleImageFile(file,480);
      const photo={id:"photo_"+Date.now(),dataUrl,date:new Date().toISOString()};
      const next=[photo,...photos];
      setPhotos(next); saveLS("ff_progress_photos",next);
    }catch(err){ setUploadError(err.message||"Couldn't upload that photo."); }
    e.target.value="";
  };
  const toggleSelect=id=>{
    setSelected(sel=>sel.includes(id)?sel.filter(x=>x!==id):(sel.length<2?[...sel,id]:[sel[1],id]));
    setAiText("");
  };
  const deletePhoto=id=>{
    const next=photos.filter(p=>p.id!==id);
    setPhotos(next); saveLS("ff_progress_photos",next);
    setSelected(sel=>sel.filter(x=>x!==id));
  };
  const runCompare=async()=>{
    if(selected.length<2) return;
    if(!apiKey){ setAiError("Add a Gemini API key in Settings → AI Coach to use this."); return; }
    setAiLoading(true); setAiError(""); setAiText("");
    try{
      const chosen=photos.filter(p=>selected.includes(p.id)).sort((a,b)=>new Date(a.date)-new Date(b.date));
      const [p1,p2]=chosen;
      const sys=`You compare two progress photos of the same person over time. Describe only general, visible changes (posture, general build, clothing fit) in an encouraging, neutral way. NEVER estimate body-fat percentage, weight, or make any medical/health claims. Keep it to 3-4 sentences and end with a short reminder that this is a general visual impression only, not a measurement.`;
      const text=await completeGeminiText({apiKey,model,messages:[
        {role:"system",content:sys},
        {role:"user",content:[
          {type:"text",text:`Earlier photo (${new Date(p1.date).toLocaleDateString()}) vs later photo (${new Date(p2.date).toLocaleDateString()}). What visible changes do you notice?`},
          {type:"image_url",image_url:{url:p1.dataUrl}},
          {type:"image_url",image_url:{url:p2.dataUrl}},
        ]},
      ]});
      setAiText(text);
    }catch(err){ setAiError(err.message||"Something went wrong."); }
    finally{ setAiLoading(false); }
  };

  const sorted=[...photos].sort((a,b)=>new Date(b.date)-new Date(a.date));

  return(
    <div className="ai-tool-panel">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <p style={{fontSize:13,color:"var(--text-mid)",margin:0,flex:1,minWidth:200}}>Upload progress photos to track visible changes over time. Photos are stored only on this device.</p>
        <button className="btn-primary" style={{padding:"9px 18px",fontSize:13,flexShrink:0}} onClick={()=>fileInputRef.current?.click()}>+ Upload Photo</button>
        <input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleUpload}/>
      </div>
      {uploadError&&<p style={{fontSize:13,color:"var(--accent)",marginBottom:12}}>{uploadError}</p>}
      {sorted.length===0
        ? <p style={{color:"var(--text-light)",fontSize:13,textAlign:"center",padding:"30px 0"}}>No progress photos yet.</p>
        : <>
            <div className="progress-photo-grid">
              {sorted.map(p=>(
                <div key={p.id} className={"progress-photo-thumb"+(selected.includes(p.id)?" selected":"")} onClick={()=>toggleSelect(p.id)}>
                  <img src={p.dataUrl} alt={"Progress photo from "+new Date(p.date).toLocaleDateString()}/>
                  <div className="progress-photo-date">{new Date(p.date).toLocaleDateString()}</div>
                  <button className="progress-photo-del" onClick={e=>{e.stopPropagation();deletePhoto(p.id);}} aria-label="Delete photo">✕</button>
                </div>
              ))}
            </div>
            <p style={{fontSize:12,color:"var(--text-light)",marginTop:10}}>Select two photos to compare ({selected.length}/2 selected).</p>
            {selected.length===2&&(
              <button className="btn-secondary" style={{marginTop:8}} onClick={runCompare} disabled={aiLoading}>{aiLoading?"Comparing…":"✨ Ask AI to describe changes"}</button>
            )}
            {aiError&&<p style={{fontSize:13,color:"var(--accent)",marginTop:10}}>{aiError}</p>}
            {aiText&&(
              <div className="insights-card" style={{marginTop:14}}>
                <div style={{fontSize:13.5,color:"var(--text)",lineHeight:1.6}}>{aiText}</div>
                <p style={{fontSize:11,color:"var(--text-light)",marginTop:10}}>This is a general visual impression only — not a medical or body-composition measurement.</p>
              </div>
            )}
          </>
      }
    </div>
  );
}

function AIConversationSidebar({conversations,activeId,onSelect,onNew,onRename,onDelete,onPin,mobileOpen,onCloseMobile}){
  const [search,setSearch]=useState("");
  const [renamingId,setRenamingId]=useState(null);
  const [renameText,setRenameText]=useState("");
  const [confirmDeleteId,setConfirmDeleteId]=useState(null);

  const filtered=conversations.filter(c=>c.title.toLowerCase().includes(search.toLowerCase()));
  const sorted=[...filtered].sort((a,b)=>{
    if(!!a.pinned!==!!b.pinned) return a.pinned?-1:1;
    return new Date(b.updatedAt)-new Date(a.updatedAt);
  });
  const startRename=c=>{ setRenamingId(c.id); setRenameText(c.title); };
  const commitRename=c=>{ if(renameText.trim()) onRename(c.id,renameText.trim()); setRenamingId(null); };

  return(
    <>
      {mobileOpen&&<div className="ai-sidebar-backdrop" onClick={onCloseMobile}/>}
      <div className={"ai-sidebar"+(mobileOpen?" mobile-open":"")}>
        <div className="ai-sidebar-head">
          <button className="btn-primary ai-new-chat-btn" onClick={onNew}>+ New Chat</button>
          <button className="ai-sidebar-close-mobile" onClick={onCloseMobile} aria-label="Close sidebar">✕</button>
        </div>
        <div className="ai-sidebar-search">
          <span>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search conversations…"/>
        </div>
        <div className="ai-sidebar-list">
          {sorted.length===0&&<p className="ai-sidebar-empty">{conversations.length===0?"No conversations yet — start one above.":"No matches."}</p>}
          {sorted.map(c=>(
            <div key={c.id} className={"ai-conv-item"+(c.id===activeId?" active":"")} onClick={()=>{if(renamingId!==c.id) onSelect(c.id);}}>
              {renamingId===c.id ? (
                <input className="ai-conv-rename-input" autoFocus value={renameText} onChange={e=>setRenameText(e.target.value)}
                  onBlur={()=>commitRename(c)} onKeyDown={e=>{if(e.key==="Enter")commitRename(c);if(e.key==="Escape")setRenamingId(null);}}
                  onClick={e=>e.stopPropagation()}/>
              ) : (
                <span className="ai-conv-title">{c.pinned&&"📌 "}{c.title}</span>
              )}
              <div className="ai-conv-actions" onClick={e=>e.stopPropagation()}>
                <button onClick={()=>onPin(c.id)} title={c.pinned?"Unpin":"Pin"}>{c.pinned?"📌":"📍"}</button>
                <button onClick={()=>startRename(c)} title="Rename">✏️</button>
                {confirmDeleteId===c.id
                  ? <button onClick={()=>{onDelete(c.id);setConfirmDeleteId(null);}} className="ai-conv-del-confirm" title="Confirm delete">✓</button>
                  : <button onClick={()=>setConfirmDeleteId(c.id)} title="Delete">🗑</button>
                }
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

    setActiveConvId(conv.id); setTool(null); setSidebarMobileOpen(false);
  };
  const selectConv=id=>{ setActiveConvId(id); setTool(null); setSidebarMobileOpen(false); };
  const renameConv=(id,title)=>{
    updateConv(id,c=>({...c,title}));
    const conv=conversations.find(c=>c.id===id);
    if(conv) onSyncConversation({...conv,title});
  };
  const deleteConv=id=>{
    setConversations(prev=>prev.filter(c=>c.id!==id));
    onDeleteConversationCloud(id);
    if(activeConvId===id) setActiveConvId(null);
  };
  const pinConv=id=>{
    updateConv(id,c=>({...c,pinned:!c.pinned}));
    const conv=conversations.find(c=>c.id===id);
    if(conv) onSyncConversation({...conv,pinned:!conv.pinned});
  };
  const saveGeneratedPlan=plan=>{ onSaveTrainingPlan(plan); };
  // Once a response finishes (streaming or a one-shot card), persist the active
  // conversation's current state to Firestore in a single write — not on every token.
  useEffect(()=>{
    if(streaming) return;
    if(!activeConvId) return;
    const conv=conversations.find(c=>c.id===activeConvId);
    if(conv) onSyncConversation(conv);
    // eslint-disable-next-line
  },[streaming]);

  const handleImageSelect=e=>{
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>setAttachedImage({dataUrl:reader.result,name:file.name});
    reader.readAsDataURL(file);
    e.target.value="";
  };

  const cardProps={
    onStartWorkout,
    onOpenMealDetail,
    onToggleMeal,
    onToggleFavoriteWorkout,
    favoriteWorkouts,
    savedMeals,
    onSaveGeneratedWorkout:onSaveAIWorkout,
    onSaveGeneratedMeal:onSaveAIMeal,
    onSaveGeneratedPlan:saveGeneratedPlan,
  };

  const send=async(rawText)=>{
    const text=(rawText!==undefined?rawText:input).trim();
    if(!text&&!attachedImage) return;
    let convId=activeConvId;
    let priorMessages=messages;
    if(!convId){
      const conv=makeNewConversation();
      setConversations(prev=>[conv,...prev]);
      onSyncConversation(conv);
      setActiveConvId(conv.id);
      convId=conv.id; priorMessages=[];
    }
    setTool(null);
    if(!apiKey){
      updateConv(convId,c=>({...c,messages:[...c.messages,{role:"user",content:text},{role:"assistant",content:"I don't have a Gemini API key yet — add one in Settings → AI Coach to start chatting."}],updatedAt:new Date().toISOString()}));
      setInput(""); return;
    }
    const userContent=attachedImage
      ?[{type:"text",text:text||"What can you tell me about this?"},{type:"image_url",image_url:{url:attachedImage.dataUrl}}]
      :text;
    const userMsg={role:"user",content:userContent};
    const historyForApi=[...priorMessages.filter(m=>m.role!=="system-note"),userMsg];
    const hadImage=!!attachedImage;
    const isFirstMessage=priorMessages.length===0;

    updateConv(convId,c=>({...c,messages:[...c.messages,userMsg],updatedAt:new Date().toISOString()}));
    setInput(""); setAttachedImage(null); setStreaming(true);

    const finishFirstMessageChores=async(assistantTextForMemory)=>{
      if(isFirstMessage){
        const title=await generateConversationTitle({apiKey,model,firstUserMessage:userMsg.content});
        if(title) updateConv(convId,c=>({...c,title}));
      }
      if(memoryEnabled&&!hadImage&&assistantTextForMemory!==undefined&&text.length>=18){
        const note=await extractMemoryFromExchange({apiKey,model,userText:text,assistantText:assistantTextForMemory});
        if(note){
          const mem=loadAIMemory();
          saveAIMemoryLS([...mem,{id:"mem_"+Date.now(),text:note,source:"ai",addedAt:new Date().toISOString()}],user?.uid);
          updateConv(convId,c=>({...c,messages:[...c.messages,{role:"system-note",content:`🧠 Remembered: ${note}`}]}));
        }
      }
    };

    /* Feature 7 — one call classifies intent AND (for workout/meal/plan) searches the library
       then generates if needed, instead of two separate round trips. Image messages always go
       straight to normal chat, since vision analysis isn't a library-search scenario. */
    let dispatch;
    if(hadImage){
      dispatch={intent:"chat"};
    } else {
      try{
        const allMealsForContext=[...mealsData,...aiMeals];
        dispatch=await classifyAndFulfill({
          apiKey, model, userText:text, contextSummary,
          workoutCatalog:buildCompactWorkoutCatalog(allWorkoutsForContext),
          mealCatalog:buildCompactMealCatalog(allMealsForContext),
          planCatalog:buildCompactPlanCatalog(trainingPlans),
        });
      }catch{ dispatch={intent:"chat"}; }
    }
    const intent=dispatch?.intent||"chat";

    if(intent==="workout"||intent==="meal"||intent==="plan"){
      try{
        let matchedItem=null;
        if(dispatch.found){
          if(intent==="workout") matchedItem=allWorkoutsForContext.find(w=>String(w.id)===String(dispatch.matchedId));
          else if(intent==="meal") matchedItem=[...mealsData,...aiMeals].find(m=>String(m.id)===String(dispatch.matchedId));
          else matchedItem=trainingPlans.find(p=>String(p.id)===String(dispatch.matchedId));
        }
        const found=dispatch.found&&matchedItem;
        const card={type:intent,source:found?"library":"generated",data:found?matchedItem:dispatch.generated};
        const cardMsg={role:"assistant",content:dispatch.reply||"Here's what I found:",card};
        updateConv(convId,c=>({...c,messages:[...c.messages,cardMsg],updatedAt:new Date().toISOString()}));
        setStreaming(false);
        await finishFirstMessageChores(dispatch.reply);
      }catch(err){
        updateConv(convId,c=>({...c,messages:[...c.messages,{role:"assistant",content:`⚠️ ${err.message||"Something went wrong."}`}],updatedAt:new Date().toISOString()}));
        setStreaming(false);
      }
      return;
    }
    if(intent==="report"){
      try{
        const data=await generateWeeklyReportCard({apiKey,model,contextSummary,tracker,activities,user});
        const cardMsg={role:"assistant",content:"Here's your weekly report, straight from your real FitFuel data:",card:{type:"report",source:"generated",data}};
        updateConv(convId,c=>({...c,messages:[...c.messages,cardMsg],updatedAt:new Date().toISOString()}));
        setStreaming(false);
        await finishFirstMessageChores(cardMsg.content);
      }catch(err){
        updateConv(convId,c=>({...c,messages:[...c.messages,{role:"assistant",content:`⚠️ ${err.message||"Something went wrong."}`}],updatedAt:new Date().toISOString()}));
        setStreaming(false);
      }
      return;
    }

    /* Plain conversational chat — real token-by-token streaming */
    updateConv(convId,c=>({...c,messages:[...c.messages,{role:"assistant",content:""}],updatedAt:new Date().toISOString()}));
    const sys={role:"system",content:buildSystemPrompt(contextSummary,hadImage
      ?"The user attached an image. If it's a meal photo, estimate calories/protein/carbs/fat and serving size, then suggest one healthier swap. If it's an exercise photo, give general technique feedback (positioning, stability, range of motion) and include a brief disclaimer that this is informational only and not a substitute for a coach or physiotherapist. Never make medical claims from photos."
      :"Chat naturally as the person's fitness coach. Keep responses focused and not overly long unless asked for detail.")};

    streamGeminiChat({
      apiKey, model, messages:[sys,...historyForApi],
      onToken:(_,full)=>updateConv(convId,c=>{ const msgs=[...c.messages]; msgs[msgs.length-1]={role:"assistant",content:full}; return {...c,messages:msgs}; }),
      onDone:async(fullText)=>{
        setStreaming(false);
        await finishFirstMessageChores(fullText);
      },
      onError:err=>{
        setStreaming(false);
        updateConv(convId,c=>{ const msgs=[...c.messages]; msgs[msgs.length-1]={role:"assistant",content:`⚠️ ${err}`}; return {...c,messages:msgs}; });
      },
    });
  };

  const tools=[
    {id:"workout",label:"🏋️ Workout"},
    {id:"meal",label:"🥗 Meal Plan"},
    {id:"plan",label:"🏃 Training Plan"},
    {id:"report",label:"📊 Weekly Report"},
    {id:"photos",label:"📸 Progress Photos"},
  ];
  const firstName=user?.name?user.name.split(" ")[0]:"there";

  if(!apiKey){
    return(
      <div className="page-wrap">
        <div className="page-header fade-up"><h1 className="page-title">AI Coach 🤖</h1><p className="page-sub">Your personal fitness coach, powered by Gemini (free, no card needed).</p></div>
        <div className="card" style={{padding:"46px 24px",textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:14}}>🔑</div>
          <h2 style={{fontSize:18,fontWeight:800,color:"var(--text)",marginBottom:10}}>Connect Your Gemini API Key</h2>
          <p style={{color:"var(--text-mid)",fontSize:14,maxWidth:420,margin:"0 auto 22px",lineHeight:1.6}}>FitFuel has no server, so the AI Coach calls Gemini straight from your browser using your own key. Add one in Settings to unlock workout generation, meal planning, running analysis, and more.</p>
          <button className="btn-primary" onClick={()=>setPage("Settings")}>Go to Settings</button>
        </div>
      </div>
    );
  }

  return(
    <div className="ai-coach-page">
      <div className="ai-coach-bg" aria-hidden="true"/>
      <div className="ai-coach-content">
        <div className="page-header fade-up ai-coach-header">
          <div>
            <h1 className="page-title">AI Coach 🤖</h1>
            <p className="page-sub">Personalised coaching, workouts, meals, and training plans.</p>
          </div>
          <button className="ai-sidebar-toggle-mobile" onClick={()=>setSidebarMobileOpen(true)}>☰ Conversations</button>
        </div>

        <div className="ai-coach-layout">
          <AIConversationSidebar
            conversations={conversations} activeId={activeConvId}
            onSelect={selectConv} onNew={startNewChat} onRename={renameConv} onDelete={deleteConv} onPin={pinConv}
            mobileOpen={sidebarMobileOpen} onCloseMobile={()=>setSidebarMobileOpen(false)}
          />

          <div className="ai-coach-main">
            <div className="ai-tool-tabs">
              <button className={"ai-tool-tab"+(tool===null?" active":"")} onClick={()=>setTool(null)}>💬 Chat</button>
              {tools.map(t=><button key={t.id} className={"ai-tool-tab"+(tool===t.id?" active":"")} onClick={()=>setTool(t.id)}>{t.label}</button>)}
            </div>

            {tool==="workout"&&<AIWorkoutGenerator apiKey={apiKey} model={model} contextSummary={contextSummary} onSaveWorkout={onSaveAIWorkout}/>}
            {tool==="meal"&&<AIMealGenerator apiKey={apiKey} model={model} contextSummary={contextSummary} onSaveMeal={onSaveAIMeal}/>}
            {tool==="plan"&&<AITrainingPlanGenerator apiKey={apiKey} model={model} contextSummary={contextSummary} onSave={onSaveTrainingPlan}/>}
            {tool==="report"&&<AIWeeklyReport apiKey={apiKey} model={model} contextSummary={contextSummary}/>}
            {tool==="photos"&&<AIProgressPhotos apiKey={apiKey} model={model}/>}

            {tool===null&&activeConvId===null&&(
              <div className="ai-welcome-screen scale-in">
                <div className="ai-welcome-greeting">{timeGreeting()}, {firstName} 👋</div>
                <p className="ai-welcome-sub">{conversations.length===0?"I'm your FitFuel AI coach — let's get started.":"Welcome back to FitFuel AI."}</p>
                {welcomeStat&&<p className="ai-welcome-stat">{welcomeStat}</p>}
                <p className="ai-welcome-question">What would you like to work on today?</p>
                <div className="ai-welcome-actions">
                  <button onClick={()=>setTool("workout")}>🏋️ Create Today's Workout</button>
                  <button onClick={()=>setTool("meal")}>🥗 Build a Meal Plan</button>
                  <button onClick={()=>setTool("report")}>📊 Analyse My Progress</button>
                  <button onClick={()=>send("How can I improve my running performance based on my recent activity data?")}>🏃 Running Coach</button>
                  <button onClick={startNewChat}>💬 Ask Anything</button>
                </div>
                <div className="ai-welcome-suggested">
                  {suggestedPrompts.map(p=><button key={p} type="button" className="onboarding-chip" onClick={()=>send(p)}>{p}</button>)}
                </div>
              </div>
            )}

            {tool===null&&activeConvId!==null&&(
              <div className="ai-chat-wrap">
                <div className="ai-chat-history">
                  {messages.map((m,i)=><ChatMessageBubble key={i} msg={m} cardProps={cardProps}/>)}
                  {streaming&&messages[messages.length-1]?.content===""&&<div className="ai-typing-indicator"><span/><span/><span/></div>}
                  <div ref={bottomRef}/>
                </div>
                {attachedImage&&(
                  <div className="ai-attach-preview">
                    <img src={attachedImage.dataUrl} alt="Attached preview"/>
                    <button onClick={()=>setAttachedImage(null)}>✕</button>
                  </div>
                )}
                <div className="ai-chat-input-row">
                  <button className="ai-attach-btn" onClick={()=>fileInputRef.current?.click()} title="Attach a meal or exercise photo" type="button">📷</button>
                  <input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImageSelect}/>
                  <input className="ai-chat-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Ask your AI coach anything…" disabled={streaming}/>
                  <button className="btn-primary ai-send-btn" onClick={()=>send()} disabled={streaming||(!input.trim()&&!attachedImage)}>➤</button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function ProfilePage({user,onUpdateUser,onLogout,tracker,activities=[],settings={}}){
  const [editing,setEditing]=useState(false);
  const [showAv,setShowAv]=useState(false);
  const [draft,setDraft]=useState({...user});
  const [goals,setGoals]=useState(user.goals||[]);
  const [ng,setNg]=useState("");
  const [savedMsg,setSavedMsg]=useState(false);
  const [aiBreakdownLoading,setAiBreakdownLoading]=useState(false);
  const [aiBreakdownError,setAiBreakdownError]=useState("");
  const addGoal=()=>{if(ng.trim()){const g=[...goals,ng.trim()];setGoals(g);setNg("");onUpdateUser({...user,goals:g});}};
  const addGoalWithAI=async()=>{
    if(!ng.trim()) return;
    if(!settings.aiApiKey){ setAiBreakdownError("Add a Gemini API key in Settings → AI Coach to use this."); return; }
    setAiBreakdownLoading(true); setAiBreakdownError("");
    try{
      const sys=`Break a fitness/health goal into 3-5 short, concrete, achievable milestones. Respond with strict JSON only: {"milestones":["...","..."]}.`;
      const data=await completeGeminiJSON({apiKey:settings.aiApiKey,model:settings.aiModel,messages:[{role:"system",content:sys},{role:"user",content:`Goal: "${ng.trim()}"`}]});
      const milestones=(data.milestones||[]).map(m=>({label:m,done:false}));
      const goalObj={text:ng.trim(),milestones,aiGenerated:true};
      const g=[...goals,goalObj]; setGoals(g); setNg(""); onUpdateUser({...user,goals:g});
    }catch(err){ setAiBreakdownError(err.message||"Something went wrong."); }
    finally{ setAiBreakdownLoading(false); }
  };
  const toggleMilestone=(gi,mi)=>{
    const g=goals.map((goal,i)=>{
      if(i!==gi||typeof goal==="string") return goal;
      return {...goal,milestones:goal.milestones.map((m,j)=>j===mi?{...m,done:!m.done}:m)};
    });
    setGoals(g); onUpdateUser({...user,goals:g});
  };
  const rmGoal=i=>{const g=goals.filter((_,j)=>j!==i);setGoals(g);onUpdateUser({...user,goals:g});};
  const saveEdits=()=>{onUpdateUser({...draft,goals});setSavedMsg(true);setEditing(false);setShowAv(false);setTimeout(()=>setSavedMsg(false),2500);};
  const updateDraft=useCallback((field,val)=>setDraft(d=>({...d,[field]:val})),[]);
  const streak=tracker?tracker.done.filter(Boolean).length:0;
  const actStats=aggregateActivityStats(activities);
  const getBMICategory=bmi=>{
    if(bmi<18.5)return{label:"Underweight",color:"var(--blue)"};
    if(bmi<25)return{label:"Healthy Weight",color:"#38D978"};
    if(bmi<30)return{label:"Overweight",color:"#EAB308"};
    return{label:"Obese",color:"var(--accent)"};
  };
  const bmi=(draft.height&&draft.weight)?parseFloat((draft.weight/(draft.height/100)**2).toFixed(1)):null;
  const bmiCat=bmi?getBMICategory(bmi):null;
  const bmiPct=bmi?Math.min(100,Math.max(0,((bmi-15)/25)*100)):0;
  return(
    <div className="page-wrap">
      {/* HEADER */}
      <div className="profile-header fade-up mb-24">
        <div className="profile-header-glow"/>
        <div style={{display:"flex",alignItems:"flex-start",gap:22,flexWrap:"wrap",position:"relative"}}>
          <div style={{position:"relative",flexShrink:0}}>
            <div className="profile-avatar">{draft.avatar}</div>
            {editing&&<button onClick={()=>setShowAv(!showAv)} style={{position:"absolute",bottom:0,right:0,width:28,height:28,borderRadius:"50%",background:"var(--accent)",border:"2px solid var(--card)",color:"#fff",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✏</button>}
          </div>
          <div style={{flex:1,minWidth:180}}>
            {editing
              ? <input value={draft.name||""} onChange={e=>setDraft({...draft,name:e.target.value})} style={{...profileInputStyle,fontSize:22,fontWeight:800,marginBottom:6,fontFamily:"'Manrope',sans-serif"}}/>
              : <h1 style={{fontSize:26,fontWeight:800,color:"var(--text)",marginBottom:4}}>{draft.name||"Unnamed"}</h1>
            }
            <p style={{color:"var(--text-mid)",fontSize:13,marginBottom:16}}>{user.email}</p>
            <div style={{display:"flex",gap:24,flexWrap:"wrap",paddingTop:12,borderTop:"1px solid var(--border)"}}>
              {[{val:tracker?.wkCt||0,label:"Workouts"},{val:streak,label:"Day Streak"},{val:streak,label:"Active Days"}].map(s=>(
                <div key={s.label} className="profile-stat"><div className="profile-stat-val">{s.val}</div><div className="profile-stat-label">{s.label}</div></div>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            {savedMsg&&<div style={{padding:"8px 16px",background:"rgba(56,217,120,0.12)",borderRadius:20,fontSize:13,fontWeight:600,color:"#38D978",border:"1px solid rgba(56,217,120,0.2)"}}>✓ Saved!</div>}
            {editing
              ? <><button onClick={()=>{setEditing(false);setDraft({...user});setShowAv(false);}} className="btn-secondary" style={{padding:"9px 20px",fontSize:14}}>Cancel</button>
                  <button className="btn-primary" onClick={saveEdits} style={{padding:"9px 20px",fontSize:14}}>Save Changes</button></>
              : <><button onClick={()=>setEditing(true)} className="btn-secondary" style={{padding:"9px 20px",fontSize:14}}>✏️ Edit Profile</button>
                  <button onClick={onLogout} className="btn-ghost" style={{padding:"9px 18px",fontSize:14,border:"1px solid var(--border-strong)",borderRadius:50}}>Log Out</button></>
            }
          </div>
        </div>
        {showAv&&editing&&(
          <div style={{marginTop:20,background:"var(--bg3)",borderRadius:16,padding:16,border:"1px solid var(--border)"}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text-mid)",marginBottom:12,letterSpacing:"0.07em"}}>PICK AVATAR</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {AVATARS.map(a=><button key={a} onClick={()=>setDraft({...draft,avatar:a})} style={{fontSize:22,background:draft.avatar===a?"var(--accent-tint-2)":"var(--card)",border:`2px solid ${draft.avatar===a?"var(--accent)":"var(--border-strong)"}`,borderRadius:10,width:42,height:42,cursor:"pointer",transition:"all 0.15s"}}>{a}</button>)}
            </div>
          </div>
        )}
        {/* Interest tags */}
        <div style={{marginTop:16,display:"flex",gap:8,flexWrap:"wrap"}}>
          {["🏃 Runner","💪 Strength","🥗 Clean Eating"].map(b=>(
            <span key={b} style={{padding:"5px 14px",borderRadius:20,background:"var(--accent-tint-1)",border:"1px solid var(--accent-tint-2)",fontSize:12,fontWeight:600,color:"var(--accent)"}}>{b}</span>
          ))}
        </div>
      </div>

      <div className="grid-3 mb-24">
        {/* PERSONAL INFO */}
        <div className="card" style={{padding:28}}>
          <h3 className="ff-heading mb-24" style={{fontSize:17,color:"var(--text)"}}>Personal Info</h3>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <ProfileField label="AGE"    field="age"    placeholder="e.g. 17"  type="number" unit="yrs" editing={editing} value={draft.age}    onChange={updateDraft}/>
            <ProfileField label="HEIGHT" field="height" placeholder="e.g. 170" type="number" unit="cm"  editing={editing} value={draft.height} onChange={updateDraft}/>
            <ProfileField label="WEIGHT" field="weight" placeholder="e.g. 65"  type="number" unit="kg"  editing={editing} value={draft.weight} onChange={updateDraft}/>
          </div>
        </div>

        {/* BMI CARD */}
        <div className="card" style={{padding:28}}>
          <h3 className="ff-heading mb-16" style={{fontSize:17,color:"var(--text)"}}>Health &amp; BMI</h3>
          {bmi?(
            <div>
              <div style={{textAlign:"center",marginBottom:20}}>
                <div style={{fontSize:52,fontWeight:800,color:bmiCat.color,lineHeight:1,fontFamily:"'Bebas Neue',sans-serif"}}>{bmi}</div>
                <div style={{fontSize:13,fontWeight:700,color:bmiCat.color,marginTop:4}}>{bmiCat.label}</div>
                <div style={{fontSize:11,color:"var(--text-light)",marginTop:2}}>Body Mass Index</div>
              </div>
              <div style={{marginBottom:8}}>
                <div className="bmi-track">
                  <div className="bmi-fill" style={{width:`${bmiPct}%`,background:`linear-gradient(to right, var(--blue), #38D978, #EAB308, var(--accent))`}}/>
                  <div className="bmi-marker" style={{left:`${bmiPct}%`}}/>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:10,fontSize:10,color:"var(--text-light)",fontWeight:600}}>
                  <span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span>
                </div>
              </div>
            </div>
          ):(
            <div style={{textAlign:"center",padding:"20px 0"}}>
              <div style={{fontSize:36,marginBottom:12}}>📊</div>
              <p style={{fontSize:14,color:"var(--text-mid)",lineHeight:1.6}}>Enter your height and weight in Personal Info to see your BMI and health metrics.</p>
              <button onClick={()=>setEditing(true)} className="btn-primary" style={{marginTop:16,fontSize:13,padding:"10px 22px"}}>Complete Profile</button>
            </div>
          )}
        </div>

        {/* GOALS */}
        <div className="card" style={{padding:28}}>
          <h3 className="ff-heading mb-20" style={{fontSize:17,color:"var(--text)"}}>My Goals 🎯</h3>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
            {goals.map((g,i)=>{
              const isObj=typeof g!=="string";
              const text=isObj?g.text:g;
              const doneCount=isObj?g.milestones.filter(m=>m.done).length:0;
              return(
                <div key={i} className="goal-item" style={{flexDirection:"column",alignItems:"stretch"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div className="goal-check">{isObj?"🎯":"✓"}</div>
                    <span style={{flex:1,fontSize:14,color:"var(--text)",fontWeight:isObj?700:400}}>
                      {text}{isObj&&<span style={{fontSize:11,color:"var(--text-mid)",fontWeight:500,marginLeft:8}}>{doneCount}/{g.milestones.length} done</span>}
                    </span>
                    <button onClick={()=>rmGoal(i)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text-light)",fontSize:20,lineHeight:1,padding:"0 4px"}}>×</button>
                  </div>
                  {isObj&&(
                    <div style={{marginTop:8,marginLeft:34,display:"flex",flexDirection:"column",gap:6}}>

              {label:"Total Kilometres",val:`${actStats.totalDistance.toFixed(1)} km`,icon:"📏"},

              {label:"Walking Distance",val:`${actStats.walkingDistance.toFixed(1)} km`,icon:"🚶"},

    </div>
  );
}

/* ─── APP ROOT ───────────────────────────────────── */
function App(){
  const [page,setPage]=useState("Home");
  const [user,setUser]=useState(null);
  const [settings,setSettings]=useState(()=>{
    const saved=loadSettings(); return saved||{...DEFAULT_SETTINGS};
  });
  const [savedMeals,setSavedMeals]=useState([]);
  const toggleMeal=useCallback(id=>{
    setSavedMeals(prev=>{
      const next=prev.includes(id)?prev.filter(x=>x!==id):[...prev,id];
      if(user?.uid) patchUserDoc(user.uid,{savedMealIds:next});
      return next;
    });
  },[user?.uid]);
  const [favoriteWorkouts,setFavoriteWorkouts]=useState([]);
  const toggleFavoriteWorkout=useCallback(id=>{
    setFavoriteWorkouts(prev=>{
      const next=prev.includes(id)?prev.filter(x=>x!==id):[...prev,id];
      if(user?.uid) patchUserDoc(user.uid,{favoriteWorkoutIds:next});
      return next;
    });
  },[user?.uid]);
  const [tracker,setTracker]=useState({...DEFAULT_TRACKER});
  const updateTracker=useCallback(patch=>{
    setTracker(prev=>{
      const next={...prev,...patch};
      if(user?.uid) patchUserDoc(user.uid,{tracker:next});
      return next;
    });
  },[user?.uid]);
  const [activities,setActivities]=useState([]);
  const saveActivity=useCallback(activity=>{
    setActivities(prev=>[activity,...prev]);
    if(user?.uid) saveDocToUserCollection(user.uid,"activities",activity).catch(err=>console.error("Cloud save failed:",err));
  },[user?.uid]);
  const deleteActivity=useCallback(id=>{
    setActivities(prev=>prev.filter(a=>a.id!==id));
    if(user?.uid) deleteDocFromUserCollection(user.uid,"activities",id).catch(err=>console.error("Cloud delete failed:",err));
  },[user?.uid]);
  const [aiWorkouts,setAiWorkouts]=useState([]);
  const saveAIWorkout=useCallback(w=>{
    setAiWorkouts(prev=>{
      // Feature 8 technical requirement — don't add a near-duplicate if one already exists
      const isDup=[...workoutsData,...prev].some(existing=>existing.name.trim().toLowerCase()===w.name.trim().toLowerCase());
      if(isDup) return prev;
      const withId={id:w.id||("aiw_"+Date.now()),...w};
      if(user?.uid) saveDocToUserCollection(user.uid,"aiWorkouts",withId).catch(err=>console.error("Cloud save failed:",err));
      return [withId,...prev];
    });
  },[user?.uid]);
  const [aiMeals,setAiMeals]=useState([]);
  const saveAIMeal=useCallback(m=>{
    setAiMeals(prev=>{
      const isDup=[...mealsData,...prev].some(existing=>existing.name.trim().toLowerCase()===m.name.trim().toLowerCase());
      if(isDup) return prev;
      const withId={id:m.id||("aim_"+Date.now()),...m};
      if(user?.uid) saveDocToUserCollection(user.uid,"aiMeals",withId).catch(err=>console.error("Cloud save failed:",err));
      return [withId,...prev];
    });
  },[user?.uid]);
  const [trainingPlans,setTrainingPlans]=useState([]);
  const saveTrainingPlan=useCallback(plan=>{
    const isDup=trainingPlans.some(existing=>existing.name.trim().toLowerCase()===(plan.name||"").trim().toLowerCase());
    if(isDup) return false;
    const withId={id:plan.id||("plan_"+Date.now()),...plan};
    setTrainingPlans(prev=>[withId,...prev]);
    if(user?.uid) saveDocToUserCollection(user.uid,"trainingPlans",withId).catch(err=>console.error("Cloud save failed:",err));
    return true;
  },[user?.uid,trainingPlans]);
  const [conversations,setConversations]=useState([]);
  // Conversations update very frequently while a response streams in — this only
  // needs a Firestore write once things settle, not on every token. AICoachPage
  // calls this after a send() completes (see its `streaming` effect) and at a few
  // explicit points like creating/renaming/pinning a chat.
  const syncConversation=useCallback(conv=>{
    if(user?.uid&&conv) saveDocToUserCollection(user.uid,"conversations",conv).catch(err=>console.error("Cloud save failed:",err));
  },[user?.uid]);
  const deleteConversationCloud=useCallback(id=>{
    if(user?.uid) deleteDocFromUserCollection(user.uid,"conversations",id).catch(err=>console.error("Cloud delete failed:",err));
  },[user?.uid]);
  const [pendingWorkoutStart,setPendingWorkoutStart]=useState(null);
  const [pendingMealDetail,setPendingMealDetail]=useState(null);
  useEffect(()=>{ applySettings(settings); },[settings]);
  const handleUpdate=useCallback(next=>{ setSettings(next); saveSettings(next); },[]);
  const [authLoading,setAuthLoading]=useState(true);
  // Single source of truth for auth state: fires on load (checking for an existing
  // session) and on every login/logout. Loads the Firestore profile for a signed-in
  // user, creating it on first login if it doesn't exist yet.
  useEffect(()=>{
    const unsub=firebase.auth().onAuthStateChanged(async fbUser=>{
      if(!fbUser){
        setUser(null); setAuthLoading(false);
        // Clear cloud-backed state on logout so a previous user's data doesn't linger
        setSavedMeals([]); setFavoriteWorkouts([]); setTracker({...DEFAULT_TRACKER});
        setActivities([]); setAiWorkouts([]); setAiMeals([]);
        setTrainingPlans([]); setConversations([]);
        return;
      }
      try{
        const ref=firebase.firestore().collection("users").doc(fbUser.uid);
        const snap=await ref.get();
        let data;
        if(snap.exists){
          data=snap.data();
        } else {
          data={
            name:fbUser.displayName||"There", email:fbUser.email, avatar:"🧑",
            age:"", height:"", weight:"",
            goals:["Train 3x per week","Drink 8 glasses of water daily"],
            onboarded:false,
            savedMealIds:[], favoriteWorkoutIds:[], tracker:{...DEFAULT_TRACKER},
            aiMemory:[], aiMemoryEnabled:true,
          };
          await ref.set(data);
        }
        setUser({uid:fbUser.uid,...data});
        setSavedMeals(data.savedMealIds||[]);
        setFavoriteWorkouts(data.favoriteWorkoutIds||[]);
        setTracker(data.tracker||{...DEFAULT_TRACKER});
        // Mirror cloud memory into localStorage so the existing loadAIMemory()/
        // loadAIMemoryForContext() reads pick up synced data on a new device.
        saveLS("ff_ai_memory",data.aiMemory||[]);
        saveLS("ff_ai_memory_enabled",data.aiMemoryEnabled!==false);
      }catch(err){
        console.error("Failed to load profile:",err);
        setUser(null);
      }
      setAuthLoading(false);
    });
    return unsub;
  },[]);
  // Loads the larger per-user collections once we know who's signed in.
  useEffect(()=>{
    if(!user?.uid) return;
    let cancelled=false;
    Promise.all([
      loadUserCollection(user.uid,"activities"),
      loadUserCollection(user.uid,"aiWorkouts"),
      loadUserCollection(user.uid,"aiMeals"),
      loadUserCollection(user.uid,"trainingPlans"),
      loadUserCollection(user.uid,"conversations"),
    ]).then(([acts,aiW,aiM,plans,convs])=>{
      if(cancelled) return;
      setActivities(acts.sort((a,b)=>new Date(b.finishedAt||0)-new Date(a.finishedAt||0)));
      setAiWorkouts(aiW);
      setAiMeals(aiM);
      setTrainingPlans(plans);
      setConversations(convs.sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0)));
    }).catch(err=>console.error("Failed to load cloud data:",err));
    return ()=>{ cancelled=true; };
  },[user?.uid]);
  const logout=()=>{ firebase.auth().signOut(); setPage("Home"); };
  const updateUser=useCallback(updated=>{
    setUser({...updated});
    if(updated.uid){
      const {uid,...fields}=updated;
      firebase.firestore().collection("users").doc(uid).set(fields,{merge:true})
        .catch(err=>console.error("Failed to save profile:",err));
    }
  },[]);
  const completeOnboarding=answers=>{
    updateUser({
      ...user,
      onboarding:answers,
      onboarded:true,
      goals:buildGoalsFromOnboarding(answers),
      // Personal Info (and the BMI card that reads from it) look at these top-level
      // fields, not user.onboarding — copy them up so onboarding actually feeds BMI.
      age:answers.age||user.age,
      height:answers.height||user.height,
      weight:answers.weight||user.weight,
    });
  };
  const skipOnboarding=()=>{ updateUser({...user,onboarded:true}); };
  if(authLoading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"var(--bg)",color:"var(--text-mid)",fontSize:14}}>Loading…</div>;
  if(!user) return <AuthPage/>;
  if(!user.onboarded) return <OnboardingSurvey user={user} onComplete={completeOnboarding} onSkip={skipOnboarding}/>;
  const pages={
    Home:<HomePage setPage={setPage} tracker={tracker} savedMeals={savedMeals} onToggleMeal={toggleMeal} user={user} activities={activities} settings={settings}/>,
    Workouts:<WorkoutsPage aiWorkouts={aiWorkouts} settings={settings} favoriteWorkouts={favoriteWorkouts} onToggleFavoriteWorkout={toggleFavoriteWorkout} pendingWorkoutStart={pendingWorkoutStart} onConsumePendingWorkoutStart={()=>setPendingWorkoutStart(null)}/>,
    Activity:<ActivityTrackerPage user={user} activities={activities} onSaveActivity={saveActivity} onDeleteActivity={deleteActivity} settings={settings}/>,
    Coach:<AICoachPage user={user} tracker={tracker} activities={activities} savedMeals={savedMeals} aiWorkouts={aiWorkouts} aiMeals={aiMeals} favoriteWorkouts={favoriteWorkouts} settings={settings} setPage={setPage} onSaveAIWorkout={saveAIWorkout} onSaveAIMeal={saveAIMeal} onToggleMeal={toggleMeal} onToggleFavoriteWorkout={toggleFavoriteWorkout} onStartWorkout={id=>{setPendingWorkoutStart(id);setPage("Workouts");}} onOpenMealDetail={id=>{setPendingMealDetail(id);setPage("Meals");}} conversations={conversations} setConversations={setConversations} onSyncConversation={syncConversation} onDeleteConversationCloud={deleteConversationCloud} trainingPlans={trainingPlans} onSaveTrainingPlan={saveTrainingPlan}/>,
    Meals:<MealsPage savedMeals={savedMeals} onToggleMeal={toggleMeal} user={user} aiMeals={aiMeals} settings={settings} pendingMealDetail={pendingMealDetail} onConsumePendingMealDetail={()=>setPendingMealDetail(null)}/>,
    Progress:<ProgressPage tracker={tracker} onUpdateTracker={updateTracker}/>,
    Profile:<ProfilePage user={user} onUpdateUser={updateUser} onLogout={logout} tracker={tracker} activities={activities} settings={settings}/>,
    Settings:<SettingsPage settings={settings} onUpdate={handleUpdate} user={user}/>,
  };
  return(
    <>
      <Nav page={page} setPage={setPage} user={user} onLogout={logout}/>
      <main>{pages[page]||<HomePage setPage={setPage} tracker={tracker} savedMeals={savedMeals} user={user} activities={activities} settings={settings}/>}</main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
