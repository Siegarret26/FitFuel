  { id:21, cat:"Lunch", name:"Tuna Pasta Salad", emoji:"🍝", cal:480, protein:30, carbs:56, fat:14,
    image:"https://images.unsplash.com/photo-1760390952135-12da7267ff8f?w=600&q=80",
    imageAlt:"Bowl of pasta salad with seafood",
    ingredients:["1 cup cooked wholewheat pasta","1 tin tuna in water","¼ cup cherry tomatoes","2 tbsp light mayo or olive oil","Fresh basil"],
    prepTime:"10 mins", cookTime:"10 mins", difficulty:"Easy",
    instructions:["Cook the pasta according to packet instructions, then drain and cool slightly.","Drain the tuna thoroughly and flake it into a large bowl.","Add the cooked pasta, halved cherry tomatoes, and torn basil.","Stir through light mayo or olive oil until evenly coated.","Season with salt and pepper, then serve chilled or at room temperature."] },
  { id:22, cat:"Lunch", name:"Teriyaki Chicken Bowl", emoji:"🍱", cal:530, protein:40, carbs:54, fat:11,
    image:"https://images.unsplash.com/photo-1775039983749-aa6003c8ecf9?w=600&q=80",
    imageAlt:"Bowl of rice topped with glazed teriyaki chicken and vegetables",
    ingredients:["150g chicken thigh","¾ cup steamed rice","½ cup steamed broccoli","3 tbsp teriyaki sauce","Sesame seeds to garnish"],
    prepTime:"10 mins", cookTime:"18 mins", difficulty:"Medium",
    instructions:["Steam the rice and broccoli separately until tender.","Pan-sear the chicken thigh over medium-high heat for 6 minutes per side.","Pour teriyaki sauce over the chicken in the last 2 minutes of cooking, letting it caramelize.","Slice the chicken and place over the rice with the broccoli.","Drizzle any remaining pan sauce on top and sprinkle with sesame seeds."] },
  { id:23, cat:"Lunch", name:"Grilled Chicken Salad", emoji:"🥗", cal:410, protein:38, carbs:20, fat:18,
    image:"https://images.unsplash.com/photo-1761315600943-d8a5bb0c499f?w=600&q=80",
    imageAlt:"Grilled chicken salad with avocado and tomatoes",
    ingredients:["150g grilled chicken breast","Mixed salad greens","¼ cup cherry tomatoes","¼ cucumber, sliced","2 tbsp balsamic vinaigrette"],
    prepTime:"10 mins", cookTime:"12 mins", difficulty:"Easy",
    instructions:["Season the chicken breast with salt, pepper, and a little olive oil.","Grill or pan-sear the chicken for 6 minutes per side until cooked through.","Let the chicken rest for 5 minutes, then slice.","Toss the salad greens, tomatoes, and cucumber in a large bowl.","Top with sliced chicken and drizzle with balsamic vinaigrette."] },
  { id:24, cat:"Lunch", name:"Steak & Roasted Vegetables", emoji:"🥩", cal:540, protein:40, carbs:26, fat:26,
    image:"https://images.unsplash.com/photo-1633436375795-12b3b339712f?w=600&q=80",
    imageAlt:"Steak with roasted vegetables on a plate",
    ingredients:["150g lean steak","1 cup mixed vegetables (zucchini, peppers, onion)","Olive oil","Garlic and rosemary","Salt and pepper"],
    prepTime:"10 mins", cookTime:"20 mins", difficulty:"Medium",
    instructions:["Preheat the oven to 200°C. Toss the vegetables in olive oil, garlic, and rosemary.","Roast the vegetables for 18–20 minutes, turning halfway through.","Season the steak generously with salt and pepper.","Sear the steak in a hot pan for 3–4 minutes per side for medium doneness.","Rest the steak for 5 minutes, slice, and serve alongside the roasted vegetables."] },
  { id:25, cat:"Lunch", name:"Mediterranean Quinoa Bowl", emoji:"🫘", cal:450, protein:18, carbs:58, fat:16,
    image:"https://images.unsplash.com/photo-1623052935410-3fca63f73e10?w=600&q=80",
    imageAlt:"Fruit salad served in a white ceramic bowl",
    ingredients:["¾ cup cooked quinoa","¼ cup chickpeas","¼ cup diced cucumber & tomato","2 tbsp feta cheese","2 tbsp olive oil & lemon dressing"],
    prepTime:"10 mins", cookTime:"15 mins", difficulty:"Easy",
    instructions:["Cook the quinoa according to packet instructions and let cool slightly.","Drain and rinse the chickpeas.","Combine the quinoa, chickpeas, cucumber, and tomato in a bowl.","Crumble feta cheese over the top.","Drizzle with olive oil and lemon dressing, then toss gently to combine."] },
  { id:26, cat:"Lunch", name:"Turkey Chili", emoji:"🌶️", cal:400, protein:34, carbs:36, fat:12,
    image:"https://images.unsplash.com/photo-1638329389022-daef2efb71b3?w=600&q=80",
    imageAlt:"Bowl of turkey chili with sour cream",
    ingredients:["200g ground turkey","1 tin diced tomatoes","¼ cup kidney beans","1 diced onion","Chili powder & cumin"],
    prepTime:"10 mins", cookTime:"30 mins", difficulty:"Medium",
    instructions:["Brown the ground turkey with the diced onion in a large pot over medium heat.","Stir in chili powder and cumin, cooking for 1 minute until fragrant.","Add the diced tomatoes and kidney beans, stirring to combine.","Simmer uncovered for 20–25 minutes, stirring occasionally.","Season to taste and serve hot, topped with your favorite garnishes."] },
  { id:27, cat:"Lunch", name:"Shrimp Avocado Salad", emoji:"🍤", cal:380, protein:30, carbs:18, fat:20,
    image:"https://images.unsplash.com/photo-1723476669561-e0419f096039?w=600&q=80",
    imageAlt:"Plate of shrimp salad",
    ingredients:["150g cooked shrimp","1 avocado, diced","Mixed salad greens","¼ red onion, thinly sliced","2 tbsp lime vinaigrette"],
    prepTime:"12 mins", cookTime:"5 mins", difficulty:"Easy",
    instructions:["If using raw shrimp, cook in a hot pan for 2 minutes per side until pink, then cool slightly.","Toss the salad greens and red onion in a large bowl.","Add the diced avocado and cooked shrimp on top.","Drizzle with lime vinaigrette.","Toss gently just before serving to keep the avocado intact."] },
  { id:28, cat:"Lunch", name:"Chicken Caesar Wrap", emoji:"🌯", cal:470, protein:36, carbs:34, fat:20,
    image:"https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=600&q=80",
    imageAlt:"Wrap sandwich on a plate",
    ingredients:["1 wholemeal wrap","120g grilled chicken, sliced","Romaine lettuce, chopped","2 tbsp light Caesar dressing","2 tbsp shaved parmesan"],
    prepTime:"8 mins", cookTime:"10 mins", difficulty:"Easy",
    instructions:["Grill or pan-sear the chicken breast until cooked through, then slice.","Toss the chopped romaine with the light Caesar dressing.","Lay the wrap flat and add the dressed lettuce.","Top with sliced chicken and shaved parmesan.","Roll tightly, tucking in the sides, and slice in half to serve."] },

  { id:29, cat:"Dinner", name:"Chicken Alfredo", emoji:"🍝", cal:560, protein:38, carbs:50, fat:22,
    image:"https://images.unsplash.com/photo-1768668053140-f589ed4bef31?w=600&q=80",
    imageAlt:"Fettuccine alfredo pasta with parsley garnish",
    ingredients:["150g chicken breast","1 cup fettuccine pasta","¾ cup light cream","¼ cup parmesan cheese","2 cloves garlic, minced"],
    prepTime:"10 mins", cookTime:"20 mins", difficulty:"Medium",
    instructions:["Cook the fettuccine according to packet instructions until al dente.","Season and pan-sear the chicken breast for 6–7 minutes per side, then slice.","In the same pan, sauté garlic for 30 seconds, then add light cream and simmer gently.","Stir in parmesan cheese until the sauce thickens slightly.","Toss the cooked pasta through the sauce and top with sliced chicken."] },
  { id:30, cat:"Dinner", name:"Beef Stir-Fry with Rice", emoji:"🥘", cal:520, protein:34, carbs:52, fat:18,
    image:"https://images.unsplash.com/photo-1707056503922-91c9ebaf0774?w=600&q=80",
    imageAlt:"Beef and vegetable stir-fry in a pan",
    ingredients:["150g lean beef strips","¾ cup cooked rice","Bell peppers & broccoli","Soy sauce & ginger","1 tbsp sesame oil"],
    prepTime:"10 mins", cookTime:"15 mins", difficulty:"Medium",
    instructions:["Cook the rice according to packet instructions.","Sear the beef strips in a hot wok for 2–3 minutes until browned, then set aside.","Stir-fry the bell peppers and broccoli in the same wok for 3–4 minutes.","Return the beef to the wok, add soy sauce and ginger, and toss to combine.","Finish with a drizzle of sesame oil and serve over the rice."] },
  { id:31, cat:"Dinner", name:"Garlic Chicken Pasta", emoji:"🧄", cal:540, protein:36, carbs:56, fat:16,
    image:"https://images.unsplash.com/photo-1693609929783-f6a1cfd35b41?w=600&q=80",
    imageAlt:"White plate topped with pasta and chicken",
    ingredients:["150g chicken breast","1 cup penne pasta","4 cloves garlic, minced","2 tbsp olive oil","Fresh parsley & chilli flakes"],
    prepTime:"10 mins", cookTime:"20 mins", difficulty:"Medium",
    instructions:["Cook the penne according to packet instructions, reserving ½ cup of pasta water.","Season and pan-sear the chicken breast until cooked through, then slice.","In the same pan, gently sauté garlic in olive oil until fragrant, not browned.","Toss the cooked pasta through the garlic oil, adding a splash of pasta water to loosen.","Top with sliced chicken, fresh parsley, and a pinch of chilli flakes."] },
  { id:32, cat:"Dinner", name:"Lean Beef Tacos", emoji:"🌮", cal:490, protein:32, carbs:40, fat:20,
    image:"https://images.unsplash.com/photo-1687881063470-a78e6ea2590e?w=600&q=80",
    imageAlt:"Three beef tacos with lettuce and sauce",
    ingredients:["150g lean ground beef","4 small corn tortillas","Shredded lettuce & diced tomato","2 tbsp salsa","Lime wedge"],
    prepTime:"10 mins", cookTime:"12 mins", difficulty:"Easy",
    instructions:["Brown the ground beef in a pan over medium-high heat with taco seasoning.","Warm the corn tortillas in a dry pan or microwave.","Fill each tortilla with a spoonful of beef.","Top with shredded lettuce, diced tomato, and salsa.","Finish with a squeeze of fresh lime before serving."] },
  { id:33, cat:"Dinner", name:"Baked Chicken & Sweet Potato", emoji:"🍠", cal:500, protein:40, carbs:44, fat:14,
    image:"https://images.unsplash.com/photo-1654426939189-9dcf7fed870b?w=600&q=80",
    imageAlt:"Baked chicken with sweet potato",
    ingredients:["150g chicken breast","1 medium sweet potato","Olive oil","Paprika, garlic powder","Steamed green beans"],
    prepTime:"10 mins", cookTime:"30 mins", difficulty:"Easy",
    instructions:["Preheat the oven to 200°C. Chop the sweet potato into wedges.","Toss the sweet potato and chicken breast in olive oil, paprika, and garlic powder.","Place both on a baking tray and roast for 25–30 minutes until the chicken is cooked through.","Steam the green beans for the last 5 minutes of cooking.","Plate the chicken and sweet potato wedges alongside the steamed green beans."] },
  { id:34, cat:"Dinner", name:"Shrimp Rice Bowl", emoji:"🍤", cal:460, protein:32, carbs:50, fat:12,
    image:"https://images.unsplash.com/photo-1710106687822-999dbeb73dee?w=600&q=80",
    imageAlt:"Bowl of rice with seafood",
    ingredients:["150g shrimp, peeled","¾ cup steamed rice","½ cup edamame","Sriracha mayo","Sesame seeds"],
    prepTime:"10 mins", cookTime:"10 mins", difficulty:"Easy",
    instructions:["Steam the rice according to packet instructions.","Season the shrimp with salt, pepper, and a little paprika.","Pan-sear the shrimp for 2 minutes per side until pink and opaque.","Assemble the bowl with rice, edamame, and cooked shrimp.","Drizzle with sriracha mayo and sprinkle with sesame seeds."] },
  { id:35, cat:"Dinner", name:"Turkey Meatballs & Zoodles", emoji:"🍝", cal:420, protein:36, carbs:24, fat:20,
    image:"https://images.unsplash.com/photo-1620167790054-de54f34308bb?w=600&q=80",
    imageAlt:"Turkey meatballs on a plate",
    ingredients:["200g ground turkey","2 medium zucchini, spiralized","1 cup marinara sauce","1 egg","2 tbsp breadcrumbs"],
    prepTime:"15 mins", cookTime:"20 mins", difficulty:"Medium",
    instructions:["Mix the ground turkey with the egg, breadcrumbs, and seasoning. Roll into small meatballs.","Bake or pan-fry the meatballs for 12–15 minutes until cooked through.","Warm the marinara sauce in a saucepan over medium heat.","Sauté the spiralized zucchini in a lightly oiled pan for 2–3 minutes until just tender.","Serve the zoodles topped with meatballs and warm marinara sauce."] },
  { id:36, cat:"Dinner", name:"Honey Glazed Salmon", emoji:"🐟", cal:480, protein:38, carbs:26, fat:22,
    image:"https://images.unsplash.com/photo-1676300184021-96fa00e1a987?w=600&q=80",
    imageAlt:"Honey glazed salmon with vegetables",
    ingredients:["150g salmon fillet","1 tbsp honey","1 tbsp soy sauce","1 clove garlic, minced","Steamed rice & greens to serve"],
    prepTime:"5 mins", cookTime:"15 mins", difficulty:"Easy",
    instructions:["Whisk together honey, soy sauce, and minced garlic in a small bowl.","Pat the salmon dry and season lightly with salt and pepper.","Pan-sear the salmon skin-side down for 4 minutes, then flip.","Pour the honey glaze over the salmon and cook for 2–3 minutes until sticky and cooked through.","Serve with steamed rice and greens, spooning extra glaze on top."] },
  { id:37, cat:"Dinner", name:"BBQ Chicken & Quinoa", emoji:"🍗", cal:510, protein:40, carbs:48, fat:14,
    image:"https://images.unsplash.com/photo-1775039983802-b3eb3f68cd2c?w=600&q=80",
    imageAlt:"Roasted BBQ chicken with rice and vegetables",
    ingredients:["150g chicken breast","¾ cup cooked quinoa","3 tbsp BBQ sauce","½ cup steamed corn","Chopped spring onion"],
    prepTime:"10 mins", cookTime:"18 mins", difficulty:"Easy",
    instructions:["Cook the quinoa according to packet instructions.","Season the chicken and grill or pan-sear for 6–7 minutes per side.","Brush the chicken with BBQ sauce during the last 2 minutes of cooking.","Slice the chicken and place over the quinoa with steamed corn.","Garnish with chopped spring onion before serving."] },
  { id:38, cat:"Dinner", name:"One-Pan Beef & Broccoli", emoji:"🥦", cal:470, protein:34, carbs:36, fat:18,
    image:"https://images.unsplash.com/photo-1601226809816-b8c32440158a?w=600&q=80",
    imageAlt:"Beef and broccoli stir-fry in a pan",
    ingredients:["150g lean beef strips","2 cups broccoli florets","¾ cup cooked rice","Soy sauce & garlic","1 tsp cornstarch"],
    prepTime:"10 mins", cookTime:"15 mins", difficulty:"Medium",
    instructions:["Cook the rice according to packet instructions.","Sear the beef strips in a hot pan for 2–3 minutes until browned, then set aside.","Steam or stir-fry the broccoli until just tender, about 4 minutes.","Whisk soy sauce, garlic, and cornstarch with a splash of water, then add to the pan with the beef.","Simmer until the sauce thickens slightly, then combine with broccoli and serve over rice."] },

  { id:39, cat:"Snacks", name:"Protein Energy Balls", emoji:"🍡", cal:180, protein:8, carbs:20, fat:8,
    image:"https://images.unsplash.com/photo-1504708706948-13d6cbba4062?w=600&q=80",
    imageAlt:"Bowl of berries and nuts",
    ingredients:["1 cup rolled oats","¼ cup peanut butter","2 tbsp honey","1 scoop protein powder","2 tbsp mini chocolate chips"],
    prepTime:"10 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Combine the oats, peanut butter, honey, and protein powder in a large bowl.","Mix thoroughly until a sticky dough forms.","Fold in the mini chocolate chips.","Roll the mixture into small bite-sized balls using your hands.","Refrigerate for at least 30 minutes to firm up before eating."] },
  { id:40, cat:"Snacks", name:"Cottage Cheese Bowl", emoji:"🥣", cal:210, protein:22, carbs:16, fat:6,
    image:"https://images.unsplash.com/photo-1559561853-08451507cbe7?w=600&q=80",
    imageAlt:"Bowl of cottage cheese",
    ingredients:["1 cup cottage cheese","½ cup pineapple chunks","1 tbsp chopped walnuts","Pinch of cinnamon"],
    prepTime:"3 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Spoon the cottage cheese into a bowl.","Top with pineapple chunks.","Sprinkle chopped walnuts over the top.","Finish with a light dusting of cinnamon.","Serve chilled straight away."] },
  { id:41, cat:"Snacks", name:"Mixed Nuts & Dried Fruit", emoji:"🥜", cal:220, protein:7, carbs:18, fat:15,
    image:"https://images.unsplash.com/photo-1494390248081-4e521a5940db?w=600&q=80",
    imageAlt:"Black and red cherries in a white bowl",
    ingredients:["¼ cup almonds","¼ cup walnuts","2 tbsp dried cranberries","2 tbsp raisins"],
    prepTime:"2 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Measure out the almonds and walnuts into a small bowl.","Add the dried cranberries and raisins.","Toss everything together to combine.","Portion into a small container for a grab-and-go snack.","Store any extra in an airtight container for up to two weeks."] },
  { id:42, cat:"Snacks", name:"Chocolate Protein Shake", emoji:"🍫", cal:230, protein:26, carbs:20, fat:6,
    image:"https://images.unsplash.com/photo-1579954115545-a95591f28bfc?w=600&q=80",
    imageAlt:"Chocolate protein shake in a glass",
    ingredients:["1 scoop chocolate protein powder","1 cup milk or almond milk","½ banana","4 ice cubes"],
    prepTime:"3 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Add the milk to a blender first.","Add the protein powder, banana, and ice cubes.","Blend on high for 30–45 seconds until smooth and frothy.","Pour into a glass immediately.","Drink right away for the best texture."] },
  { id:43, cat:"Snacks", name:"Fresh Fruit Bowl", emoji:"🍉", cal:150, protein:2, carbs:38, fat:1,
    image:"https://images.unsplash.com/photo-1487376318617-f43c7b41e2e2?w=600&q=80",
    imageAlt:"Bowl of fresh mixed fruit",
    ingredients:["1 cup watermelon chunks","½ cup grapes","1 kiwi, sliced","½ cup strawberries","Squeeze of lime"],
    prepTime:"8 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Wash all the fruit thoroughly under cold water.","Chop the watermelon into bite-sized chunks and slice the kiwi.","Halve the strawberries and combine all the fruit in a large bowl.","Squeeze fresh lime juice over the top.","Toss gently and serve immediately or chill for 20 minutes."] },
  { id:44, cat:"Snacks", name:"Rice Cakes with Almond Butter", emoji:"🍘", cal:190, protein:6, carbs:22, fat:9,
    image:"https://images.unsplash.com/photo-1654747781271-a2b6992c7b52?w=600&q=80",
    imageAlt:"Jar of almond butter with almonds",
    ingredients:["2 plain rice cakes","2 tbsp almond butter","½ banana, sliced","Pinch of cinnamon"],
    prepTime:"3 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Lay the rice cakes flat on a plate.","Spread almond butter evenly over each rice cake.","Arrange banana slices on top.","Sprinkle with a pinch of cinnamon.","Serve immediately for the best crunch."] },
  { id:45, cat:"Snacks", name:"Classic Boiled Eggs", emoji:"🥚", cal:140, protein:12, carbs:1, fat:10,
    image:"https://images.unsplash.com/photo-1680987398307-e1ae27a6ed67?w=600&q=80",
    imageAlt:"Hard boiled eggs on a tray",
    ingredients:["2 large eggs","Pinch of salt and pepper","Optional: chilli flakes"],
    prepTime:"2 mins", cookTime:"10 mins", difficulty:"Easy",
    instructions:["Place the eggs in a small pot and cover with cold water.","Bring to a boil, then reduce to a simmer for 9–10 minutes for firm yolks.","Transfer the eggs to a bowl of ice water for 5 minutes to stop cooking.","Peel the eggs under running water for easier shelling.","Season with salt, pepper, and chilli flakes before eating."] },
  { id:46, cat:"Snacks", name:"Hummus & Veggie Sticks", emoji:"🥕", cal:170, protein:6, carbs:18, fat:9,
    image:"https://images.unsplash.com/photo-1637949385162-e416fb15b2ce?w=600&q=80",
    imageAlt:"Bowl of hummus with garnish",
    ingredients:["3 tbsp hummus","1 carrot, cut into sticks","1 celery stalk, cut into sticks","½ cucumber, cut into sticks"],
    prepTime:"6 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Wash and peel the carrot, then cut all vegetables into even sticks.","Spoon the hummus into a small serving bowl.","Arrange the vegetable sticks around the hummus.","Dip and enjoy as a light, crunchy snack.","Store any extra veggie sticks in the fridge for later."] },
  { id:47, cat:"Snacks", name:"Trail Mix Bites", emoji:"🌰", cal:200, protein:6, carbs:22, fat:11,
    image:"https://images.unsplash.com/photo-1767877609689-beff32b9c0ac?w=600&q=80",
    imageAlt:"Mixed nuts and raisin trail mix",
    ingredients:["¼ cup mixed nuts","2 tbsp pumpkin seeds","2 tbsp dark chocolate chips","2 tbsp dried apricots, chopped"],
    prepTime:"3 mins", cookTime:"0 mins", difficulty:"Easy",
    instructions:["Combine the mixed nuts and pumpkin seeds in a bowl.","Add the dark chocolate chips and chopped dried apricots.","Toss everything together until evenly distributed.","Portion into small snack bags or containers.","Store at room temperature for up to two weeks."] },
  { id:48, cat:"Snacks", name:"Roasted Chickpeas", emoji:"🧆", cal:160, protein:8, carbs:22, fat:5,
    image:"https://images.unsplash.com/photo-1591940597372-bd266c6eb29e?w=600&q=80",
    imageAlt:"Roasted chickpeas and beans on a plate",
    ingredients:["1 can chickpeas, drained and rinsed","1 tbsp olive oil","½ tsp paprika","½ tsp garlic powder","Salt to taste"],
    prepTime:"5 mins", cookTime:"25 mins", difficulty:"Easy",
    instructions:["Preheat the oven to 200°C. Pat the chickpeas completely dry with a towel.","Toss the chickpeas with olive oil, paprika, garlic powder, and salt.","Spread in a single layer on a baking tray.","Roast for 20–25 minutes, shaking the tray halfway through, until crispy.","Cool for a few minutes before serving; they crisp up further as they cool."] },

  { id:49, cat:"Vegetarian", name:"Chickpea Curry", emoji:"🍛", cal:420, protein:16, carbs:58, fat:14,
    image:"https://images.unsplash.com/photo-1654199903998-e49181b41a95?w=600&q=80",
    imageAlt:"Bowl of chickpea curry with vegetables",
    ingredients:["1 can chickpeas, drained","1 can coconut milk","1 diced onion","2 tbsp curry powder","1 cup spinach"],
    prepTime:"10 mins", cookTime:"25 mins", difficulty:"Medium",
    instructions:["Sauté the diced onion in a large pot with a little oil until soft.","Stir in the curry powder and cook for 1 minute until fragrant.","Add the chickpeas and coconut milk, stirring to combine.","Simmer for 15–20 minutes until slightly thickened.","Stir in the spinach until wilted, then serve over rice."] },
  { id:50, cat:"Vegetarian", name:"Lentil Soup", emoji:"🍲", cal:340, protein:18, carbs:52, fat:6,
    image:"https://images.unsplash.com/photo-1605491126711-a22345cf8105?w=600&q=80",
    imageAlt:"Bowl of lentil soup",
    ingredients:["1 cup red lentils","1 diced carrot","1 diced celery stalk","1 diced onion","4 cups vegetable stock"],
    prepTime:"10 mins", cookTime:"30 mins", difficulty:"Easy",
    instructions:["Rinse the lentils thoroughly under cold water.","Sauté the onion, carrot, and celery in a large pot until softened, about 5 minutes.","Add the lentils and vegetable stock, stirring to combine.","Simmer for 20–25 minutes until the lentils are tender and the soup has thickened.","Blend partially for a creamier texture if desired, then season and serve warm."] },
  { id:51, cat:"Vegetarian", name:"Tofu Stir-Fry", emoji:"🥡", cal:390, protein:22, carbs:36, fat:16,
    image:"https://images.unsplash.com/photo-1634141613544-001d33883517?w=600&q=80",
    imageAlt:"Tofu and vegetable stir-fry in a pan",
    ingredients:["200g firm tofu, cubed","Bell peppers & snap peas","2 tbsp soy sauce","1 tbsp sesame oil","Cooked rice to serve"],
    prepTime:"10 mins", cookTime:"15 mins", difficulty:"Medium",
    instructions:["Press the tofu to remove excess water, then cube it.","Pan-fry the tofu in a hot wok until golden on all sides, about 6–8 minutes.","Add the bell peppers and snap peas, stir-frying for 3–4 minutes.","Pour in soy sauce and toss everything together.","Finish with a drizzle of sesame oil and serve over rice."] },
  { id:52, cat:"Vegetarian", name:"Veggie Burrito Bowl", emoji:"🌯", cal:440, protein:16, carbs:64, fat:14,
    image:"https://images.unsplash.com/photo-1731090389462-351421240be9?w=600&q=80",
    imageAlt:"Vegetarian burrito bowl",
    ingredients:["¾ cup cooked rice","¼ cup black beans","¼ cup corn","¼ cup diced avocado","2 tbsp salsa"],
    prepTime:"10 mins", cookTime:"15 mins", difficulty:"Easy",
    instructions:["Cook the rice according to packet instructions.","Warm the black beans and corn in a small saucepan.","Layer the rice, beans, and corn in a bowl.","Top with diced avocado and salsa.","Toss gently and serve warm or at room temperature."] },
  { id:53, cat:"Vegetarian", name:"Falafel Wrap", emoji:"🧆", cal:460, protein:16, carbs:56, fat:18,
    image:"https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600&q=80",
    imageAlt:"Falafel wrap",
    ingredients:["1 wholemeal wrap","4–5 falafel balls","2 tbsp hummus","Shredded lettuce & tomato","Tahini drizzle"],
    prepTime:"8 mins", cookTime:"10 mins", difficulty:"Easy",
    instructions:["Bake or pan-fry the falafel according to packet instructions until golden and warm through.","Lay the wrap flat and spread with hummus.","Add shredded lettuce and diced tomato.","Place the falafel balls in a line down the center.","Drizzle with tahini, then roll the wrap tightly and slice in half."] },
  { id:54, cat:"Vegetarian", name:"Caprese Quinoa Salad", emoji:"🍅", cal:410, protein:15, carbs:44, fat:19,
    image:"https://images.unsplash.com/photo-1769458313860-3c8db667d990?w=600&q=80",
    imageAlt:"Caprese salad with tomatoes, mozzarella, and basil",
    ingredients:["¾ cup cooked quinoa","½ cup cherry tomatoes, halved","100g mozzarella balls","Fresh basil leaves","2 tbsp balsamic glaze"],
    prepTime:"10 mins", cookTime:"15 mins", difficulty:"Easy",

/* Turns Firebase's error codes into plain-English messages */
function describeAuthError(err){
  const map={
    "auth/email-already-in-use":"An account with this email already exists.",
    "auth/invalid-email":"Enter a valid email address.",
    "auth/user-not-found":"No account found with that email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/weak-password":"Password must be at least 6 characters.",
    "auth/too-many-requests":"Too many attempts — please wait a moment and try again.",
    "auth/network-request-failed":"Network error — check your connection and try again.",
  };
  return map[err.code]||err.message||"Something went wrong. Please try again.";
}

/* ─── AUTH ─────────────────────────────────────── */
function AuthPage(){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [name,setName]=useState("");
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");
  const [busy,setBusy]=useState(false);
  const login=async()=>{
    setError("");
    if(!email.trim()||!password.trim()){setError("Please fill in all fields.");return;}
    if(!email.includes("@")){setError("Enter a valid email.");return;}
    setBusy(true);
    try{
      await firebase.auth().signInWithEmailAndPassword(email.trim().toLowerCase(),password);
      // App's onAuthStateChanged listener takes it from here
    }catch(err){
      setError(describeAuthError(err));
      setBusy(false);
    }
  };
  const signup=async()=>{
    setError("");
    if(!name.trim()||!email.trim()||!password.trim()){setError("Please fill in all fields.");return;}
    if(!email.includes("@")){setError("Enter a valid email.");return;}
    if(password.length<6){setError("Password must be at least 6 characters.");return;}
    setBusy(true);
    try{
      const cred=await firebase.auth().createUserWithEmailAndPassword(email.trim().toLowerCase(),password);
      await cred.user.updateProfile({displayName:name.trim()});
      setSuccess("Account created! Logging you in…");
      // App's onAuthStateChanged listener creates the Firestore profile and takes it from here
    }catch(err){
      setError(describeAuthError(err));
      setBusy(false);
    }
  };
  return(
    <div className="auth-page">
      <div className="auth-visual">
        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=900&q=80" alt="Athlete training in gym"/>
        <div className="auth-visual-overlay"/>
        <div className="auth-visual-text fade-up">
          <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:"var(--accent)",textTransform:"uppercase",marginBottom:16}}>🔥 YOUR FITNESS JOURNEY STARTS HERE</div>
          <div className="ff-display" style={{fontSize:52,color:"#fff",lineHeight:0.9,marginBottom:16}}>TRAIN<br/><span style={{color:"var(--accent)"}}>SMARTER.</span><br/>FEEL<br/>AMAZING.</div>
          <p style={{fontSize:14,color:"rgba(255,255,255,0.6)",lineHeight:1.65}}>Workouts, nutrition, and habit tracking — built for real student life.</p>
        </div>
      </div>
      <div className="auth-panel">
        <div className="auth-card fade-up">
          <div style={{textAlign:"center",marginBottom:28}}>
            <div className="auth-badge"><FitFuelLogoMark size={36}/></div>
            <h1 style={{fontSize:26,fontWeight:800,marginBottom:6,color:"var(--text)"}}>FitFuel</h1>
            <p style={{fontSize:14,color:"var(--text-mid)"}}>{mode==="login"?"Welcome back. Ready to crush it?":"Create your free account."}</p>
          </div>
          <div className="auth-tab-bar">
            {["login","signup"].map(m=><button key={m} className={"auth-tab"+(mode===m?" active":"")} onClick={()=>{setMode(m);setError("");setSuccess("");}}>
              {m==="login"?"Log In":"Sign Up"}
            </button>)}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {mode==="signup"&&<div className="auth-field"><label>YOUR NAME</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Alex Johnson"/></div>}
            <div className="auth-field"><label>EMAIL</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" type="email"/></div>
            <div className="auth-field"><label>PASSWORD</label><input value={password} onChange={e=>setPassword(e.target.value)} placeholder={mode==="signup"?"At least 6 characters":"••••••••"} type="password" onKeyDown={e=>e.key==="Enter"&&!busy&&(mode==="login"?login():signup())}/></div>
          </div>
          {error&&<div className="auth-error">{error}</div>}
          {success&&<div className="auth-success">{success}</div>}
          <button className="btn-primary" onClick={mode==="login"?login:signup} disabled={busy} style={{width:"100%",marginTop:20,fontSize:15,padding:"14px",opacity:busy?0.7:1}}>
            {busy?"Please wait…":(mode==="login"?"Log In →":"Create Account →")}
          </button>
          <p style={{textAlign:"center",fontSize:12,color:"var(--text-light)",marginTop:16}}>
            {mode==="login"?"Don't have an account? ":"Already have an account? "}
            <span onClick={()=>{setMode(mode==="login"?"signup":"login");setError("");setSuccess("");}} style={{color:"var(--accent)",cursor:"pointer",fontWeight:600}}>
              {mode==="login"?"Sign up":"Log in"}
            </span>
          </p>
        </div>
      </div>
    </div>
  );
}

/* ─── ONBOARDING: FIELD RENDERER ─────────────────── */
function OnboardingField({field, value, onChange}){
  if(field.type==="single"){
    return(
      <div className="onboarding-field">
        <div className="onboarding-field-label">{field.label}</div>
        <div className="onboarding-options">
          {field.options.map(opt=>(
            <button key={opt} type="button" className={"onboarding-chip"+(value===opt?" selected":"")} onClick={()=>onChange(opt)}>{opt}</button>
          ))}
        </div>
      </div>
    );
  }
  if(field.type==="multi"){
    const arr=value||[];
    const toggle=opt=>onChange(arr.includes(opt)?arr.filter(o=>o!==opt):[...arr,opt]);
    return(
      <div className="onboarding-field">
        <div className="onboarding-field-label">{field.label}</div>
        <div className="onboarding-options">
          {field.options.map(opt=>(
            <button key={opt} type="button" className={"onboarding-chip"+(arr.includes(opt)?" selected":"")} onClick={()=>toggle(opt)}>{opt}</button>
          ))}
        </div>
      </div>
    );
  }
  return(
    <div className="onboarding-field">
      <label className="onboarding-field-label">{field.label}</label>
      <input className="onboarding-input" type={field.type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={field.placeholder||""}/>
    </div>
  );
}

/* ─── ONBOARDING: WELCOME + SURVEY ───────────────────
   Shown once, right after registration (Feature 5). Rendered by App
   whenever a logged-in user has `onboarded:false`. Answers are handed
   back via onComplete and merged into the user profile + starter goals. */
function OnboardingSurvey({user, onComplete, onSkip}){
  const [phase,setPhase]=useState("welcome");
  const [stepIdx,setStepIdx]=useState(0);
  const [answers,setAnswers]=useState({});
  const total=ONBOARDING_STEPS.length;
  const step=ONBOARDING_STEPS[stepIdx];
  const firstName=(user.name||"").split(" ")[0]||"there";
  const setField=(key,val)=>setAnswers(a=>({...a,[key]:val}));
  const next=()=>{ if(stepIdx<total-1) setStepIdx(i=>i+1); else onComplete(answers); };
  const back=()=>{ if(stepIdx>0) setStepIdx(i=>i-1); };

  if(phase==="welcome"){
    return(
      <div className="onboarding-page">
        <div className="onboarding-card scale-in" style={{textAlign:"center"}}>
          <div className="auth-badge"><FitFuelLogoMark size={36}/></div>
          <h1 style={{fontSize:25,fontWeight:800,color:"var(--text)",marginBottom:10}}>Welcome to FitFuel, {firstName}! 👋</h1>
          <p style={{fontSize:14,color:"var(--text-mid)",lineHeight:1.7,marginBottom:26,maxWidth:400,marginLeft:"auto",marginRight:"auto"}}>
            Let's spend about a minute learning more about you so we can personalise your workouts, meals, and overall fitness experience.
          </p>
          <button className="btn-primary" style={{padding:"14px 40px",fontSize:15}} onClick={()=>setPhase("survey")}>Let's Go →</button>
          <p style={{marginTop:16}}>
            <span onClick={onSkip} style={{fontSize:13,color:"var(--text-light)",cursor:"pointer",textDecoration:"underline"}}>Skip for now</span>
          </p>
        </div>
      </div>
    );
  }

  return(
    <div className="onboarding-page">
      <div className="onboarding-card scale-in">
        <div className="onboarding-progress-head">
          <span className="onboarding-step-label">Step {stepIdx+1} of {total}</span>
          <span onClick={onSkip} style={{fontSize:12,color:"var(--text-light)",cursor:"pointer"}}>Skip survey</span>
        </div>
        <div className="onboarding-progress-track">
          <div className="onboarding-progress-fill" style={{width:`${((stepIdx+1)/total)*100}%`}}/>
        </div>

        <h2 style={{fontSize:20,fontWeight:800,color:"var(--text)",marginTop:22,marginBottom:6}}>{step.title}</h2>
        <p style={{fontSize:13,color:"var(--text-mid)",marginBottom:22}}>{step.subtitle}</p>

        <div style={{display:"flex",flexDirection:"column",gap:22}}>
          {step.fields.map(f=>(
            <OnboardingField key={f.key} field={f} value={answers[f.key]} onChange={v=>setField(f.key,v)}/>
          ))}
        </div>

        <div style={{display:"flex",gap:10,marginTop:30}}>
          {stepIdx>0&&<button className="btn-secondary" style={{padding:"12px 22px"}} onClick={back}>← Back</button>}
          <button className="btn-primary" style={{flex:1,padding:"13px"}} onClick={next}>
            {stepIdx<total-1?"Continue →":"Finish ✓"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* Leaflet map wrapper — draws the live/recorded route on a dark basemap.
   Leaflet itself loads from a CDN (see <head>); if it fails to load
   (e.g. no network) we fall back to a simple message instead of crashing. */
function ActivityMap({route, live, height}){
  const containerRef=useRef(null);
  const mapRef=useRef(null);
  const polylineRef=useRef(null);
  const markerRef=useRef(null);
  const leafletAvailable=typeof window!=="undefined"&&!!window.L;

  useEffect(()=>{
    if(!leafletAvailable||!containerRef.current||mapRef.current) return;
    const start=route.length?[route[0].lat,route[0].lng]:[51.505,-0.09];
    const map=window.L.map(containerRef.current,{zoomControl:true,attributionControl:true}).setView(start,16);
    window.L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
      attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap',
      subdomains:"abcd", maxZoom:20,
    }).addTo(map);
    mapRef.current=map;
    return ()=>{ map.remove(); mapRef.current=null; polylineRef.current=null; markerRef.current=null; };
    // eslint-disable-next-line
  },[leafletAvailable]);

  useEffect(()=>{
    if(!mapRef.current||!route.length) return;
    const latlngs=route.map(p=>[p.lat,p.lng]);
    if(polylineRef.current) polylineRef.current.setLatLngs(latlngs);
    else polylineRef.current=window.L.polyline(latlngs,{color:"#FF3B3B",weight:5,opacity:0.9,lineJoin:"round"}).addTo(mapRef.current);
    const last=latlngs[latlngs.length-1];
    if(markerRef.current) markerRef.current.setLatLng(last);
    else markerRef.current=window.L.marker(last,{icon:window.L.divIcon({className:"activity-map-dot",iconSize:[16,16]})}).addTo(mapRef.current);
    if(live) mapRef.current.panTo(last,{animate:true,duration:0.5});
    else if(latlngs.length>1) mapRef.current.fitBounds(window.L.latLngBounds(latlngs),{padding:[26,26]});
  },[route,live]);

  return(
    <div className="activity-map-wrap" style={{height:height||280}}>
      <div ref={containerRef} className="activity-map-canvas"/>
      {!leafletAvailable&&(
        <div className="activity-map-fallback">🗺️ Map preview unavailable right now — your route is still being recorded.</div>
      )}
    </div>
  );
}

/* Generic Chart.js line-chart wrapper. Watches <html> for attribute changes so
   charts redraw with fresh colors whenever the person switches light/dark theme. */
function LineChartCanvas({labels,datasets,height,yLabel,xLabel}){
  const canvasRef=useRef(null);
  const chartRef=useRef(null);
  const [themeTick,setThemeTick]=useState(0);
  const available=typeof window!=="undefined"&&!!window.Chart;

  useEffect(()=>{
    if(!available) return;
    const observer=new MutationObserver(()=>setThemeTick(t=>t+1));
    observer.observe(document.documentElement,{attributes:true,attributeFilter:["style","class"]});
    return ()=>observer.disconnect();
  },[available]);

  useEffect(()=>{
    if(!available||!canvasRef.current) return;
    const styles=getComputedStyle(document.documentElement);
    const textColor=(styles.getPropertyValue("--text-mid")||"").trim()||"#999";
    const gridColor=(styles.getPropertyValue("--border")||"").trim()||"rgba(255,255,255,0.08)";
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current=new window.Chart(canvasRef.current.getContext("2d"),{
      type:"line",
      data:{ labels, datasets: datasets.map(ds=>({
        label:ds.label, data:ds.data, borderColor:ds.color, backgroundColor:ds.color+"33",
        borderWidth:2.5, pointRadius:0, pointHoverRadius:5, tension:0.35, fill:!!ds.fill, yAxisID:ds.yAxisID||"y",
      })) },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:"index",intersect:false},
        plugins:{
          legend:{display:datasets.length>1,labels:{color:textColor,font:{family:"Manrope",size:11}}},
          tooltip:{mode:"index",intersect:false},
        },
        scales:{
          x:{ ticks:{color:textColor,font:{family:"Manrope",size:10}}, grid:{color:gridColor}, title:xLabel?{display:true,text:xLabel,color:textColor}:undefined },
          y:{ ticks:{color:textColor,font:{family:"Manrope",size:10}}, grid:{color:gridColor}, title:yLabel?{display:true,text:yLabel,color:textColor}:undefined },
        },
      },
    });
    return ()=>{ if(chartRef.current){chartRef.current.destroy();chartRef.current=null;} };
    // eslint-disable-next-line
  },[available,themeTick,JSON.stringify(labels),JSON.stringify(datasets)]);

  return(
    <div className="chart-canvas-wrap" style={{height:height||220}}>
      <canvas ref={canvasRef}/>
      {!available&&<div className="activity-map-fallback">📈 Charts unavailable right now.</div>}
    </div>
  );
}

/* Animated playback of a completed route: marker moves along the recorded GPS
   path at 1×/2×/4× speed, with live stats and pause/resume. */
function ActivityPlaybackMap({activity}){
  const containerRef=useRef(null);
  const mapRef=useRef(null);
  const traveledLineRef=useRef(null);
  const markerRef=useRef(null);
  const leafletAvailable=typeof window!=="undefined"&&!!window.L;
  const route=activity.route||[];
  const totalMs=route.length>1?route[route.length-1].timestamp-route[0].timestamp:0;

  const [playing,setPlaying]=useState(false);
  const [speedMult,setSpeedMult]=useState(1);
  const [virtualMs,setVirtualMs]=useState(0);
  const tickRef=useRef(null);

  useEffect(()=>{
    if(!leafletAvailable||!containerRef.current||mapRef.current||route.length<2) return;
    const map=window.L.map(containerRef.current,{zoomControl:true}).setView([route[0].lat,route[0].lng],15);
    window.L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap',subdomains:"abcd",maxZoom:20}).addTo(map);
    const latlngs=route.map(p=>[p.lat,p.lng]);
    window.L.polyline(latlngs,{color:"#666",weight:3,opacity:0.45}).addTo(map);
    traveledLineRef.current=window.L.polyline([latlngs[0]],{color:"#FF3B3B",weight:5}).addTo(map);
    markerRef.current=window.L.marker(latlngs[0],{icon:window.L.divIcon({className:"activity-map-dot",iconSize:[16,16]})}).addTo(map);
    map.fitBounds(window.L.latLngBounds(latlngs),{padding:[24,24]});
    mapRef.current=map;
    return ()=>{ map.remove(); mapRef.current=null; traveledLineRef.current=null; markerRef.current=null; };
  },[leafletAvailable]);

  useEffect(()=>{
    if(!playing){ clearInterval(tickRef.current); return; }
    tickRef.current=setInterval(()=>{
      setVirtualMs(ms=>{
        const next=ms+200*speedMult;
        if(next>=totalMs){ setPlaying(false); return totalMs; }
        return next;
      });
    },200);
    return ()=>clearInterval(tickRef.current);
  },[playing,speedMult,totalMs]);

  useEffect(()=>{
    if(!mapRef.current||route.length<2) return;
    const idx=findRouteIndexAtMs(route,virtualMs);
    const point=route[idx];
    if(traveledLineRef.current) traveledLineRef.current.setLatLngs(route.slice(0,idx+1).map(p=>[p.lat,p.lng]));
    if(markerRef.current) markerRef.current.setLatLng([point.lat,point.lng]);
  },[virtualMs]);

  if(route.length<2) return <p className="analytics-empty-note">Not enough GPS data to play back this route.</p>;

  const idx=findRouteIndexAtMs(route,virtualMs);
  let distanceSoFar=0;
  for(let i=1;i<=idx&&i<route.length;i++) distanceSoFar+=haversineKm(route[i-1].lat,route[i-1].lng,route[i].lat,route[i].lng);
  const reset=()=>{ setPlaying(false); setVirtualMs(0); };

  return(
    <div>
      <div className="activity-map-wrap" style={{height:240}}>
        <div ref={containerRef} className="activity-map-canvas"/>
        {!leafletAvailable&&<div className="activity-map-fallback">🗺️ Map preview unavailable right now.</div>}
      </div>
      <div className="playback-stats-row">
        <div><span className="playback-stat-val">{formatDuration(virtualMs/1000)}</span><span className="playback-stat-label">elapsed</span></div>
        <div><span className="playback-stat-val">{distanceSoFar.toFixed(2)} km</span><span className="playback-stat-label">distance</span></div>

/* ─── ACTIVITY TRACKER PAGE (orchestrator) ──────────
   Phases: idle → requesting → (denied | live) → summary → back to idle.
   All high-frequency GPS data lives in a ref (trackRef) and is mutated directly
   by the geolocation callback; a 1s ticker snapshots it into React state so the
   UI updates smoothly without re-rendering on every raw GPS event. */
function ActivityTrackerPage({user,activities,onSaveActivity,onDeleteActivity,settings={}}){
  const [phase,setPhase]=useState("idle"); // idle | requesting | denied | live | summary
  const [selectedType,setSelectedType]=useState("Running");
  const [permissionError,setPermissionError]=useState("");
  const [live,setLive]=useState(null);
  const [unsaved,setUnsaved]=useState(null);
  const [detailActivity,setDetailActivity]=useState(null);
  const [confirmDiscardLive,setConfirmDiscardLive]=useState(false);
  const [historyTab,setHistoryTab]=useState("history");
  const trackRef=useRef(null);
  const watchIdRef=useRef(null);
  const tickRef=useRef(null);

  useEffect(()=>()=>{ clearInterval(tickRef.current); if(watchIdRef.current!=null&&navigator.geolocation) navigator.geolocation.clearWatch(watchIdRef.current); },[]);

  const addPoint=pos=>{
    const t=trackRef.current; if(!t) return;
    const {latitude:lat,longitude:lng,altitude,speed}=pos.coords;
    const last=t.points[t.points.length-1];
    const now=Date.now();
    if(last){
      const distKm=haversineKm(last.lat,last.lng,lat,lng);
      const distM=distKm*1000;
      const dtSec=(now-last.timestamp)/1000;
      if(distM<4&&dtSec<5) return; // throttle: only record on meaningful movement or elapsed time
      if(distM>=1) t.distanceKm+=distKm;
      const instSpeedKmh=speed!=null&&speed>=0?speed*3.6:(dtSec>0?(distKm/dtSec)*3600:0);
      t.currentSpeed=instSpeedKmh;
      if(instSpeedKmh>t.maxSpeed) t.maxSpeed=instSpeedKmh;
      if(instSpeedKmh>1) t.movingSeconds+=dtSec;
      if(altitude!=null){
        t.hasElevation=true;
        if(last.elevation!=null){
          const dEle=altitude-last.elevation;
          if(dEle>0.5) t.elevGain+=dEle; else if(dEle<-0.5) t.elevLoss+=Math.abs(dEle);
        }
        if(altitude>t.maxElevation) t.maxElevation=altitude;
      }
    }
    t.points.push({lat,lng,timestamp:now,elevation:altitude!=null?altitude:(last?last.elevation:null),speed:speed!=null?speed*3.6:null});
  };

  const tick=()=>{
    const t=trackRef.current; if(!t) return;
    if(!t.paused&&Date.now()-t.lastFixTime>8000) t.gpsStatus="lost";
    const elapsed=t.paused?t.frozenElapsed:(Date.now()-t.startTime-t.pausedAccum)/1000;
    setLive({
      elapsed, distanceKm:t.distanceKm, route:[...t.points],
      currentSpeed:t.currentSpeed, maxSpeed:t.maxSpeed,
      elevGain:t.elevGain, elevLoss:t.elevLoss,
      maxElevation:t.maxElevation===-Infinity?null:t.maxElevation, hasElevation:t.hasElevation,
      movingSeconds:t.movingSeconds, gpsStatus:t.gpsStatus, accuracy:t.accuracy, paused:t.paused,
    });
  };

  const handlePosition=pos=>{
    const t=trackRef.current; if(!t) return;
    t.gpsStatus="connected"; t.accuracy=pos.coords.accuracy; t.lastFixTime=Date.now();
    if(t.paused) return;
    addPoint(pos);
  };
  const handlePositionError=()=>{
    const t=trackRef.current; if(!t) return;
    t.gpsStatus="lost"; // keep timer running — offline behaviour requirement
  };

  const beginTracking=initialPos=>{
    const t={
      points:[], distanceKm:0, elevGain:0, elevLoss:0, maxElevation:-Infinity, hasElevation:false,
      currentSpeed:0, maxSpeed:0, movingSeconds:0, paused:false, pausedAccum:0, pauseStartedAt:0, frozenElapsed:0,
      gpsStatus:"connected", accuracy:initialPos.coords.accuracy, lastFixTime:Date.now(), startTime:Date.now(),
    };
    trackRef.current=t;
    addPoint(initialPos);
    setPhase("live");
    setLive({elapsed:0,distanceKm:0,route:[...t.points],currentSpeed:0,maxSpeed:0,elevGain:0,elevLoss:0,maxElevation:null,hasElevation:false,movingSeconds:0,gpsStatus:"connected",accuracy:t.accuracy,paused:false});
    watchIdRef.current=navigator.geolocation.watchPosition(handlePosition,handlePositionError,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
    tickRef.current=setInterval(tick,1000);
  };

  const startActivity=()=>{
    setPermissionError(""); setPhase("requesting");
    if(!navigator.geolocation){ setPermissionError("Geolocation isn't supported by this browser."); setPhase("denied"); return; }
    navigator.geolocation.getCurrentPosition(
      beginTracking,
      err=>{
        setPermissionError(err.code===1
          ?"Location access was denied. Enable location permissions for this site in your browser/device settings, then try again."
          :"We couldn't get your location. Check that GPS/location services are turned on and try again.");
        setPhase("denied");
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  };

  const pauseActivity=()=>{
    const t=trackRef.current; if(!t||t.paused) return;
    t.paused=true; t.pauseStartedAt=Date.now(); t.frozenElapsed=(Date.now()-t.startTime-t.pausedAccum)/1000;
    setLive(l=>l?{...l,paused:true}:l);
  };
  const resumeActivity=()=>{
    const t=trackRef.current; if(!t||!t.paused) return;
    t.pausedAccum+=Date.now()-t.pauseStartedAt; t.paused=false;
    setLive(l=>l?{...l,paused:false}:l);
  };
  const stopTrackingInternals=()=>{
    clearInterval(tickRef.current);
    if(watchIdRef.current!=null&&navigator.geolocation) navigator.geolocation.clearWatch(watchIdRef.current);
  };
  const finishActivity=()=>{
    const t=trackRef.current; if(!t) return;
    stopTrackingInternals();
    const elapsed=t.paused?t.frozenElapsed:(Date.now()-t.startTime-t.pausedAccum)/1000;
    const hours=elapsed/3600;
    const avgSpeed=t.distanceKm>0&&hours>0?t.distanceKm/hours:0;
    const avgPace=t.distanceKm>0?(elapsed/60)/t.distanceKm:0;
    const finishedAt=new Date().toISOString();
    const hasElevation=t.hasElevation;
    const maxElevation=t.maxElevation===-Infinity?0:t.maxElevation;
    const base={
      id:"act_"+Date.now(), type:selectedType, title:activityTitle(selectedType,finishedAt),
      startedAt:new Date(t.startTime).toISOString(), finishedAt,
      distance:t.distanceKm, duration:elapsed, movingTime:t.movingSeconds,
      avgSpeed, maxSpeed:t.maxSpeed, avgPace,
      calories:estimateCalories(selectedType,avgSpeed,user?.weight,hours),
      elevGain:t.elevGain, elevLoss:t.elevLoss,
      maxElevation, hasElevation,
      route:t.points,
      heartRate:null, // future-ready: populated once wearable integration exists
    };
    // Feature 7 — precompute all analytics once, at save time, so the dashboard loads instantly later
    base.splits=computeSplits(base.route,base.distance);
    base.intervals5=computeTimeIntervals(base.route,5,base.type,user?.weight);
    base.intervals10=computeTimeIntervals(base.route,10,base.type,user?.weight);
    base.series=computeTimeSeries(base.route);
    base.elevationSeries=hasElevation?computeElevationSeries(base.route):[];
    base.personalRecords=detectPersonalRecords(base,activities);
    base.insights=generateInsights(base);
    setUnsaved(base);
    trackRef.current=null; setLive(null); setPhase("summary");
  };
  const discardLive=()=>{
    stopTrackingInternals();
    trackRef.current=null; setLive(null); setConfirmDiscardLive(false); setPhase("idle");
  };
  const saveUnsaved=()=>{ onSaveActivity(unsaved); setUnsaved(null); setPhase("idle"); };
  const discardUnsaved=()=>{ setUnsaved(null); setPhase("idle"); };

  const sorted=[...activities].sort((a,b)=>new Date(b.finishedAt)-new Date(a.finishedAt));

  return(
    <div className="page-wrap">
      {detailActivity&&<ActivityDetailModal activity={detailActivity} onClose={()=>setDetailActivity(null)} onDelete={id=>{onDeleteActivity(id);setDetailActivity(null);}} settings={settings} user={user}/>}
      <div className="page-header fade-up">
        <h1 className="page-title">Activity Tracker 🏃</h1>
        <p className="page-sub">Record your runs, jogs, walks, and hikes with live GPS tracking.</p>
      </div>

      {phase==="idle"&&(
        <>
          <div className="card activity-start-card fade-up" style={{padding:28,marginBottom:32}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--text-mid)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:14}}>Choose Activity Type</div>
            <div className="onboarding-options" style={{marginBottom:22}}>
              {ACTIVITY_TYPES.map(t=>(
                <button key={t.id} type="button" className={"onboarding-chip"+(selectedType===t.id?" selected":"")} onClick={()=>setSelectedType(t.id)}>{t.icon} {t.label}</button>
              ))}
            </div>
            <button className="btn-primary activity-start-btn" onClick={startActivity}>▶ Start Activity</button>
            <p style={{fontSize:12,color:"var(--text-light)",marginTop:12,textAlign:"center"}}>We'll ask for location access to track your route live on the map.</p>
          </div>

          <div className="analytics-section-head">
            <h3 className="ff-heading" style={{fontSize:20,color:"var(--text)",marginBottom:0}}>{historyTab==="history"?"My Activities":"Analytics"}</h3>
            <Seg options={[{v:"history",l:"History"},{v:"analytics",l:"Analytics"}]} value={historyTab} onChange={setHistoryTab}/>
          </div>
          {historyTab==="analytics"
            ? <ActivityTrendsPanel activities={activities}/>
            : (sorted.length===0
                ? <div className="card" style={{padding:"40px 24px",textAlign:"center"}}>
                    <div style={{fontSize:36,marginBottom:10}}>🗺️</div>
                    <p style={{color:"var(--text-mid)",fontSize:14}}>No activities yet — start your first run, jog, walk, or hike above!</p>
                  </div>
                : <div className="grid-auto-fit-sm">
                    {sorted.map(a=><ActivityCard key={a.id} activity={a} onOpen={setDetailActivity}/>)}
                  </div>
              )
          }
        </>
      )}

      {phase==="requesting"&&(
        <div className="card scale-in" style={{padding:"50px 24px",textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:14}}>📡</div>
          <h2 style={{fontSize:18,fontWeight:800,color:"var(--text)",marginBottom:8}}>Requesting location access…</h2>
          <p style={{color:"var(--text-mid)",fontSize:14}}>Please allow location permission in the browser prompt to start tracking.</p>
        </div>
      )}

      {phase==="denied"&&(
        <div className="card scale-in" style={{padding:"46px 24px",textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:14}}>📍</div>
          <h2 style={{fontSize:18,fontWeight:800,color:"var(--text)",marginBottom:10}}>Location Access Needed</h2>
          <p style={{color:"var(--text-mid)",fontSize:14,lineHeight:1.6,maxWidth:420,margin:"0 auto 22px"}}>{permissionError}</p>
          <button className="btn-primary" onClick={startActivity}>Try Again</button>
        </div>
      )}

      {phase==="live"&&live&&(
        <div className="scale-in">
          <div className="activity-gps-pill-row">
            <span className={"activity-gps-pill "+(live.gpsStatus==="connected"?"connected":live.gpsStatus==="lost"?"lost":"connecting")}>
              {live.gpsStatus==="connected"?`🟢 GPS Connected${live.accuracy?` · Accuracy ±${Math.round(live.accuracy)}m`:""}`:live.gpsStatus==="lost"?"🟠 Waiting for GPS Signal…":"⚪ Connecting…"}
            </span>
            {live.paused&&<span className="activity-gps-pill paused">⏸ Paused</span>}
          </div>

          <div className="activity-timer-display">{formatDuration(live.elapsed)}</div>

          <ActivityMap route={live.route} live={true} height={300}/>

          <div className="activity-stat-grid" style={{marginTop:20}}>
            <ActivityStat icon="📏" label="Distance" value={live.distanceKm.toFixed(2)} unit="km"/>
            <ActivityStat icon="💨" label="Current Speed" value={live.currentSpeed.toFixed(1)} unit="km/h"/>
            <ActivityStat icon="⚡" label="Avg Speed" value={(live.distanceKm>0&&live.elapsed>0?live.distanceKm/(live.elapsed/3600):0).toFixed(1)} unit="km/h"/>
            <ActivityStat icon="⏱" label="Pace" value={formatPace(live.distanceKm>0?(live.elapsed/60)/live.distanceKm:0)} unit="/km"/>
            <ActivityStat icon="⛰️" label="Elevation" value={live.hasElevation?Math.round(live.maxElevation):"—"} unit={live.hasElevation?"m":""}/>
            <ActivityStat icon="🔥" label="Calories" value={estimateCalories(selectedType, live.distanceKm>0&&live.elapsed>0?live.distanceKm/(live.elapsed/3600):0, user?.weight, live.elapsed/3600)} unit="kcal"/>
          </div>

          {confirmDiscardLive?(
            <div style={{marginTop:20,padding:"14px 16px",background:"var(--bg3)",borderRadius:14,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <span style={{fontSize:13,color:"var(--text-mid)",flex:1}}>Discard this activity? All progress will be lost.</span>
              <button className="btn-secondary" onClick={()=>setConfirmDiscardLive(false)}>Cancel</button>
              <button className="btn-primary" onClick={discardLive}>Discard</button>
            </div>
          ):(
            <div className="activity-controls-row">
              {live.paused
                ? <button className="btn-primary activity-control-btn" onClick={resumeActivity}>▶ Resume</button>
                : <button className="btn-secondary activity-control-btn" onClick={pauseActivity}>⏸ Pause</button>
              }
              <button className="btn-primary activity-control-btn" onClick={finishActivity}>⏹ Finish</button>
              <button className="btn-ghost activity-control-btn" style={{border:"1px solid var(--border-strong)",borderRadius:50}} onClick={()=>setConfirmDiscardLive(true)}>🗑 Discard</button>
            </div>
          )}
        </div>
      )}

      {phase==="summary"&&unsaved&&(
        <ActivitySummaryCard activity={unsaved} onSave={saveUnsaved} onDiscard={discardUnsaved} settings={settings} user={user}/>
      )}
    </div>
  );
}

/* ─── HOME PAGE ──────────────────────────────────── */
function HomePage({setPage,tracker,savedMeals,onToggleMeal,user,activities=[],settings={}}){
  const streak=tracker?tracker.done.filter(Boolean).length:0;
  const [detailMeal,setDetailMeal]=useState(null);
  const firstName=user?.name?user.name.split(" ")[0]:null;
  const level=user?.onboarding?.experienceLevel;
  const diet=user?.onboarding?.dietaryPreference;
  const levelMatches=level?workoutsData.filter(w=>w.diff===level):[];
  const featuredWorkouts=(levelMatches.length?levelMatches:workoutsData).slice(0,3);
  const dietMatches=diet==="Vegetarian"?mealsData.filter(m=>m.cat==="Vegetarian"):[];
  const featuredMeals=(dietMatches.length>=4?dietMatches:mealsData).slice(0,4);
  const actStats=aggregateActivityStats(activities);
  const [aiGreetingLine,setAiGreetingLine]=useState(null);
  const [nudge,setNudge]=useState(null);
  const [nudgeDismissed,setNudgeDismissed]=useState(false);

  /* Feature 6 — AI dashboard: one cached-per-day AI line, gracefully falls back to the rule-based line if no key/offline */
  useEffect(()=>{
    if(!settings.aiApiKey||!user) return;
    const todayKey="ff_ai_greeting_"+new Date().toISOString().slice(0,10);
    const cached=loadLS(todayKey,null);
    if(cached){ setAiGreetingLine(cached); return; }
    const ctx=buildUserContextSummary(user,tracker,activities,savedMeals,loadAIMemoryForContext());
    const sys=buildSystemPrompt(ctx,"Write ONE short, upbeat sentence (max 18 words) suggesting what the person should focus on today, based on their data. No greeting or name, just the focus sentence, no quotes.");
    completeGeminiText({apiKey:settings.aiApiKey,model:settings.aiModel,messages:[{role:"system",content:sys},{role:"user",content:"What should I focus on today?"}]})
      .then(text=>{ if(text){ setAiGreetingLine(text); saveLS(todayKey,text); } })
      .catch(()=>{});
    // eslint-disable-next-line
  },[settings.aiApiKey,user?.email]);

  /* Feature 8 — AI Habit Coach: deterministic nudge, always available even without a key */
  useEffect(()=>{
    let candidate=null;
    if(actStats.runningStreak>=6) candidate="You're one day from a 7-day activity streak — keep it going!";
    else if((tracker?.wkCt||0)===0) candidate="You haven't logged a workout yet this week.";
    else if((tracker?.water||0)<4) candidate=`Don't forget today's hydration goal — you're at ${tracker?.water||0}/8 glasses.`;
    setNudge(candidate);
    // eslint-disable-next-line
  },[activities,tracker?.wkCt,tracker?.water]);

  return(
    <div>
      {detailMeal&&<MealDetailModal m={detailMeal} onClose={()=>setDetailMeal(null)} onSave={onToggleMeal} saved={savedMeals?.includes(detailMeal.id)}/>}
      {/* HERO */}
      <section className="hero">
        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1400&q=80" alt="Athlete training" className="hero-img"/>
        <div className="hero-overlay"/>
        <div className="hero-glow"/>
        <div className="hero-content">
          <div className="hero-eyebrow fade-up">🎯 Built for teens &amp; students</div>
          <h1 className="hero-headline fade-up-2">
            FUEL YOUR<br/><span>BODY.</span><br/>TRAIN SMARTER.
          </h1>
          <p className="hero-sub fade-up-3">Simple workouts, healthy meals, and habit tracking — designed for real student life.</p>
          <div className="hero-btns fade-up-3">
            <button className="btn-primary" style={{fontSize:15,padding:"14px 36px"}} onClick={()=>setPage("Workouts")}>🚀 Start Training</button>
            <button className="btn-secondary" onClick={()=>setPage("Meals")}>Explore Meals</button>
          </div>
          <div className="hero-stats fade-up-3">
            {[{val:`${(tracker?.wkCt||0)}`, label:"Workouts Done"},{val:`${streak}🔥`, label:"Current Streak"},{val:`${savedMeals?.length||0}`, label:"Saved Meals"},{val:`${tracker?.done?Math.round((streak/7)*100):0}%`, label:"Habit Rate"}].map(s=>(
              <div key={s.label}>
                <div className="hero-stat-val">{s.val}</div>
                <div className="hero-stat-label">{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* PERSONALISED GREETING (Feature 5 survey + Feature 6 AI dashboard) */}
      {firstName&&(
        <div style={{background:"var(--bg)",padding:"32px 24px 0"}}>
          <div style={{maxWidth:1180,margin:"0 auto"}}>
            <div className="home-greeting-card fade-up">
              <div>
                <div className="home-greeting-hello">{timeGreeting()}, {firstName} 👋</div>
                <div className="home-greeting-sub">{aiGreetingLine||`Ready for today's ${featuredWorkouts[0]?.name||"workout"}?`}</div>
              </div>
              <button className="btn-primary" style={{padding:"11px 24px",fontSize:14,flexShrink:0}} onClick={()=>setPage("Workouts")}>Let's go →</button>
            </div>
            {nudge&&!nudgeDismissed&&(
              <div className="habit-nudge-banner fade-up">
                <span>🔔 {nudge}</span>
                <button onClick={()=>setNudgeDismissed(true)} aria-label="Dismiss">✕</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* RECENT ACTIVITY (Feature 6 — GPS run/walk tracking) */}
      <div style={{background:"var(--bg)",padding:"18px 24px 0"}}>
        <div style={{maxWidth:1180,margin:"0 auto"}}>
          {activities.length>0?(
            <div className="card fade-up" style={{padding:24}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
                <h3 className="ff-heading" style={{fontSize:16,color:"var(--text)"}}>Recent Activity 🏃</h3>
                <button className="section-link" onClick={()=>setPage("Activity")}>See all →</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:14}}>
                {[
                  {label:"Last Activity",val:actStats.lastActivity?`${actStats.lastActivity.distance.toFixed(1)} km`:"—"},
                  {label:"This Week",val:`${actStats.weeklyDistance.toFixed(1)} km`},
                  {label:"This Month",val:`${actStats.monthlyDistance.toFixed(1)} km`},
                  {label:"Longest Run",val:`${actStats.longestRun.toFixed(1)} km`},
                  {label:"Total Activities",val:actStats.totalActivities},
                  {label:"Activity Streak",val:`${actStats.runningStreak}🔥`},
                ].map(s=>(
                  <div key={s.label} style={{textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:800,color:"var(--accent)"}}>{s.val}</div>
                    <div style={{fontSize:11,color:"var(--text-mid)",marginTop:2}}>{s.label}</div>
                  </div>
                ))}
              </div>
            </div>
          ):(
            <div className="card fade-up" style={{padding:22,display:"flex",alignItems:"center",justifyContent:"space-between",gap:14,flexWrap:"wrap"}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:"var(--text)",marginBottom:2}}>Track your first run or walk 🏃</div>
                <div style={{fontSize:13,color:"var(--text-mid)"}}>Live GPS pace, distance, and route mapping.</div>
              </div>
              <button className="btn-secondary" onClick={()=>setPage("Activity")}>Start Tracking →</button>
            </div>
          )}
        </div>
      </div>

      {/* FEATURED WORKOUTS */}
      <div style={{background:"var(--bg)",padding:"60px 0"}}>
        <div style={{maxWidth:1180,margin:"0 auto",padding:"0 24px"}}>
          <div className="section-label">
            <h2 className="section-title">{level?`${level} Workouts For You`:"Featured Workouts"}</h2>
            <button className="section-link" onClick={()=>setPage("Workouts")}>See all →</button>
          </div>
          <div className="grid-3">
            {featuredWorkouts.map(w=>(
              <WorkoutCard key={w.id} w={w} onStart={()=>setPage("Workouts")}/>
            ))}
          </div>
        </div>
      </div>

      {/* FEATURED MEALS */}
      <div style={{background:"var(--bg2)",padding:"60px 0",borderTop:"1px solid var(--border)"}}>
        <div style={{maxWidth:1180,margin:"0 auto",padding:"0 24px"}}>
          <div className="section-label">
            <h2 className="section-title">{diet==="Vegetarian"?"Vegetarian Meal Ideas":"Healthy Meal Ideas"}</h2>
            <button className="section-link" onClick={()=>setPage("Meals")}>See all →</button>
          </div>
          <div className="grid-4">
            {featuredMeals.map(m=>(
              <MealCard key={m.id} m={m} onSave={onToggleMeal} saved={savedMeals?.includes(m.id)} onOpenDetail={setDetailMeal}/>
            ))}
          </div>
        </div>
      </div>

      {/* CTA BAND */}
      <div className="cta-band">
        <div className="cta-band-bg"/>
        <div style={{position:"relative",maxWidth:560,margin:"0 auto"}}>
          <h2 style={{fontSize:"clamp(28px,5vw,44px)",fontWeight:800,color:"var(--text)",marginBottom:14,lineHeight:1.15}}>Ready to build better habits?</h2>
          <p style={{color:"var(--text-mid)",marginBottom:28,lineHeight:1.7}}>Thousands of students are already smashing their goals with FitFuel.</p>
          <button className="btn-primary" style={{fontSize:15,padding:"14px 40px"}} onClick={()=>setPage("Progress")}>Track My Progress</button>
        </div>
      </div>

      <footer style={{background:"var(--bg)",borderTop:"1px solid var(--border)",color:"var(--text-light)",padding:"28px 24px",textAlign:"center"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:6}}>
          <div style={{width:26,height:26,background:"var(--accent)",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}><FitFuelLogoMark size={18}/></div>
          <span style={{fontWeight:700,color:"var(--text-mid)",fontSize:15}}>FitFuel</span>

        <p style={{fontSize:13}}>Made for students who want to feel their best.</p>
