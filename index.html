<div id="root">
  <div id="ff-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;background:#070709;color:#F0F0F5;font-family:sans-serif;">
    <div style="width:36px;height:36px;border:3px solid rgba(255,59,59,0.25);border-top-color:#FF3B3B;border-radius:50%;animation:ff-spin 0.8s linear infinite;"></div>
    <div style="font-size:14px;color:#8B8D97;">Loading FitFuel…</div>
  </div>
</div>
<style>@keyframes ff-spin{to{transform:rotate(360deg)}}</style>
<script>
  // If React/Babel fail to load (blocked by network, ad-blocker, etc.)
  // show a clear message instead of leaving a blank/stuck page.
  window.addEventListener("load", function(){
    setTimeout(function(){
      if (typeof React === "undefined" || typeof Babel === "undefined") {
        var el = document.getElementById("ff-fallback");
        if (el) {
          el.innerHTML = '<div style="max-width:340px;text-align:center;padding:20px;">'
            + '<div style="font-size:28px;margin-bottom:10px;">⚠️</div>'
            + '<div style="font-weight:700;margin-bottom:8px;">Couldn\'t load FitFuel</div>'
            + '<div style="font-size:13px;color:#8B8D97;line-height:1.5;">This page needs an internet connection to load React and Babel from unpkg.com. '
            + 'Check your connection, or disable any ad-blocker / privacy extension for this page, then refresh.</div>'
            + '</div>';
        }
      }
    }, 4000);
  });
</script>
