<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --accent: #FF3B3B;
  --accent-dark: #C9181B;
  --accent-coral: #FF5757;
  --accent-orange: #FF8A1F;
  --accent-glow: rgba(255,59,59,0.25);
  /* Derived tint tokens set by applySettings on every theme switch.
     Use these everywhere instead of hardcoded rgba(255,59,59,X). */
  --accent-tint-1: rgba(255,59,59,0.07);
  --accent-tint-2: rgba(255,59,59,0.12);
  --accent-tint-3: rgba(255,59,59,0.20);
  --accent-tint-4: rgba(255,59,59,0.35);
  --accent-tint-5: rgba(255,59,59,0.45);
  /* Deep tinted background for streak / active-workout gradients */
  --accent-bg-deep: #1A0303;
  --bg: #070709;
  --bg2: #111214;
  --bg3: #18191C;
  --card: #1C1D21;
  --card2: #222328;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.13);
  --text: #F0F0F5;
  --text-mid: #8B8D97;
  --text-light: #444653;
  /* Feature 6 — dedicated, theme-aware colors for the exercise instruction dropdowns.
     Dark-family themes get bright, high-contrast values here; the light theme (below,
     in THEMES.light.vars) sets these to its existing text-mid/text-light so light mode
     is visually unchanged, per PRD. */
  --info-body-text: #F0F0F5;
  --info-label-text: #A8AAB5;
  --success: #38D978;
  --blue: #4DA3FF;
  --purple: #9B5CFF;
  /* Theme-aware nav/hero backgrounds — overridden per theme in applySettings */
  --nav-bg: rgba(7,7,9,0.88);
  --nav-bg-mobile: rgba(12,12,16,0.96);
  --hero-overlay-start: rgba(7,7,9,0.97);
  --hero-overlay-mid: rgba(7,7,9,0.80);
  --hero-overlay-fade: rgba(7,7,9,0.40);
  --auth-overlay-start: rgba(7,7,9,0.98);
  --auth-overlay-mid: rgba(7,7,9,0.60);
  /* Streak card & active workout banner text — overridden per theme */
  --streak-label: rgba(255,255,255,0.5);
  --streak-text: rgba(255,255,255,0.85);
  --streak-sub: rgba(255,255,255,0.65);
  --banner-label: rgba(255,255,255,0.55);
  --banner-heading: #fff;
  --banner-pill-bg: rgba(255,255,255,0.12);
  --banner-pill-text: rgba(255,255,255,0.88);
  --banner-track: rgba(255,255,255,0.15);
  --banner-track-fill: #fff;
  --banner-btn-bg: rgba(255,255,255,0.1);
  --banner-btn-border: rgba(255,255,255,0.18);
  --nav-h: 64px;
  --r: 20px;
  --r-sm: 12px;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.45);
  --shadow-glow: 0 0 32px var(--accent-tint-4);
  --font-size-base: 15px;
  --btn-pad: 13px 30px;
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: var(--font-size-base); scroll-behavior: smooth; }
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body.reduce-motion * { animation: none !important; transition: none !important; }
body.high-contrast { --border: rgba(255,255,255,0.25); --text-mid: #c0c2cc; --text-light: #888; }
body.large-buttons .btn-primary, body.large-buttons .btn-secondary { padding: 16px 38px !important; font-size: 17px !important; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
input, select, button, textarea { font-family: 'Manrope', sans-serif; }
input { background: var(--bg3); color: var(--text); border: 1px solid var(--border-strong); }
input::placeholder { color: var(--text-light); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-2); }

/* ═══════════════════════════════════════════
   TYPOGRAPHY
═══════════════════════════════════════════ */
.ff-display {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.02em;
  line-height: 1;
}
.ff-heading {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  line-height: 1.15;
}

/* ═══════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-18px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
@keyframes barFill {
  from { width: 0%; }
  to { width: var(--bar-w); }
}
.fade-up { animation: fadeUp 0.5s ease forwards; }
.fade-up-2 { animation: fadeUp 0.5s 0.1s ease both; }
.fade-up-3 { animation: fadeUp 0.5s 0.2s ease both; }
.scale-in { animation: scaleIn 0.35s ease forwards; }
.slide-in { animation: slideInLeft 0.35s ease forwards; }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: #fff; border: none; border-radius: 50px;
  padding: var(--btn-pad); font-weight: 700; font-size: 15px;
  cursor: pointer; letter-spacing: 0.02em;
  box-shadow: 0 4px 20px var(--accent-tint-4);
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  white-space: nowrap;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-tint-5); filter: brightness(1.08); }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(255,255,255,0.05); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 50px;
  padding: 12px 26px; font-weight: 600; font-size: 15px;
  cursor: pointer; letter-spacing: 0.01em;
  backdrop-filter: blur(8px);
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
.btn-ghost {
  background: none; border: none; cursor: pointer;
  color: var(--text-mid); font-size: 14px; font-weight: 500;
  padding: 6px 12px; border-radius: 8px;
  transition: color 0.2s, background 0.2s;
}
.btn-ghost:hover { color: var(--text); background: var(--bg3); }

/* ═══════════════════════════════════════════
   CARDS
═══════════════════════════════════════════ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-card);
}
.card-hover {
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  cursor: pointer;
}
.card-hover:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--accent-tint-3);
  border-color: var(--accent-tint-3);
}

/* ═══════════════════════════════════════════
   TAG / CHIP
═══════════════════════════════════════════ */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 600;
  letter-spacing: 0.02em;
}
.tag-diff-beginner { background: rgba(56,217,120,0.15); color: #38D978; }
.tag-diff-intermediate { background: rgba(255,138,31,0.15); color: #FF8A1F; }
.tag-diff-advanced { background: var(--accent-tint-2); color: var(--accent); }

/* ═══════════════════════════════════════════
   TOGGLE SWITCH
═══════════════════════════════════════════ */
.toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg3); border-radius: 26px; cursor: pointer;
  border: 1px solid var(--border-strong);
  transition: background 0.25s, border-color 0.25s;
}
.toggle-slider::before {
  content: ""; position: absolute;
  width: 18px; height: 18px; left: 3px; bottom: 3px;
  background: var(--text-mid); border-radius: 50%;
  transition: transform 0.25s, background 0.25s;
}
.toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent-dark); }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: #fff; }

/* ═══════════════════════════════════════════
   SEGMENTED CONTROL
═══════════════════════════════════════════ */
.seg {
  display: flex; flex-wrap: wrap; background: var(--bg3);
  border-radius: 12px; padding: 4px; gap: 2px;
  border: 1px solid var(--border);
}
.seg button {
  flex: 1 1 auto; min-width: 60px; padding: 8px 14px;
  border: none; border-radius: 9px; cursor: pointer;
  font-size: 13px; font-weight: 600;
  transition: all 0.2s; background: transparent;
  color: var(--text-mid); white-space: nowrap;
}
.seg button.act { background: var(--accent); color: #fff; box-shadow: 0 2px 10px var(--accent-tint-3); }

/* ═══════════════════════════════════════════
   FILTER CHIPS
═══════════════════════════════════════════ */
.filter-bar {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
}
.filter-chip {
  padding: 8px 18px; border-radius: 50px;
  border: 1.5px solid var(--border-strong);
  background: var(--card2); color: var(--text-mid);
  cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all 0.2s; white-space: nowrap;
}
.filter-chip:hover { border-color: var(--accent); color: var(--text); }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 12px var(--accent-tint-3); }

/* ═══════════════════════════════════════════
   SEARCH INPUT
═══════════════════════════════════════════ */
.search-input {
  width: 100%; padding: 13px 18px 13px 46px;
  border-radius: 50px; border: 1.5px solid var(--border-strong);
  background: var(--card2); color: var(--text);
  font-size: 14px; font-weight: 500;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-2); }
.search-wrap { position: relative; margin-bottom: 20px; }
.search-icon {
  position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
  color: var(--text-light); font-size: 16px; pointer-events: none;
}

/* ═══════════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════════ */
.progress-track {
  background: var(--bg3); border-radius: 20px; height: 8px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 20px;
  transition: width 0.7s cubic-bezier(.4,0,.2,1);
}

/* ═══════════════════════════════════════════
   IMAGE CARD SHARED
═══════════════════════════════════════════ */
.img-card-thumb {
  width: 100%; aspect-ratio: 16/9;
  object-fit: cover; display: block;
  transition: transform 0.5s ease;
}
.card-hover:hover .img-card-thumb { transform: scale(1.05); }
.img-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(7,7,9,0.92) 0%, rgba(7,7,9,0.3) 55%, transparent 100%);
  border-radius: inherit;
}

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
.nav {
  position: sticky; top: 0; z-index: 300;
  background: var(--nav-bg);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  height: var(--nav-h);
  padding: 0 24px;
}
.nav-inner {
  max-width: 1220px; margin: 0 auto;
  height: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; flex-shrink: 0; text-decoration: none;
}
.nav-logomark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px var(--accent-tint-4);
  flex-shrink: 0;
}
.nav-wordmark {
  font-family: 'Manrope', sans-serif;
  font-size: 20px; font-weight: 800;
  color: var(--text); letter-spacing: -0.02em;
}
.nav-links {
  display: flex; align-items: center; gap: 2px;
}
.nav-link {
  background: none; border: none; cursor: pointer;
  padding: 7px 12px; border-radius: 10px;
  font-size: 14px; font-weight: 500;
  color: var(--text-mid);
  transition: color 0.2s, background 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.nav-link:hover { color: var(--text); background: var(--bg3); }
.nav-link.active { color: var(--accent); background: var(--accent-tint-2); font-weight: 600; }
.nav-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--card2);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer;
  border: 2px solid var(--accent);
  box-shadow: 0 0 10px var(--accent-tint-3);
  transition: box-shadow 0.2s;
  flex-shrink: 0;
}
.nav-avatar:hover { box-shadow: 0 0 18px var(--accent-tint-5); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.nav-logout {
  background: none; border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 5px 13px;
  cursor: pointer; font-size: 12px; color: var(--text-mid);
  transition: all 0.2s;
}
.nav-logout:hover { border-color: var(--accent); color: var(--accent); }

/* Mobile nav */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 300;
  background: var(--nav-bg-mobile);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 10px 4px max(12px, env(safe-area-inset-bottom));
}
.mobile-nav-inner {
  display: flex; align-items: center; justify-content: space-around;
}
.mobile-nav-btn {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 10px; border-radius: 10px;
  color: var(--text-light); font-size: 10px; font-weight: 600;
  transition: color 0.2s; min-width: 48px;
}
.mobile-nav-btn.active { color: var(--accent); }
.mobile-nav-btn .mnav-icon { font-size: 20px; }

@media (max-width: 680px) {
  .nav-links, .nav-logout { display: none !important; }
  .mobile-nav { display: block; }
  main { padding-bottom: 80px; }
}
@media (max-width: 480px) {
  .nav-wordmark { font-size: 17px; }
}

/* ═══════════════════════════════════════════
   AUTH PAGE
═══════════════════════════════════════════ */
.auth-page {
  min-height: 100vh;
  display: flex; align-items: stretch;
  background: var(--bg);
}
.auth-panel {
  flex: 1; padding: 48px 40px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  max-width: 480px;
  margin: 0 auto;
}
.auth-visual {
  flex: 1.1;
  position: relative; overflow: hidden;
  min-height: 320px;
  display: none;
}
@media (min-width: 860px) { .auth-visual { display: block; } }
.auth-visual img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.auth-visual-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to right, var(--auth-overlay-start) 0%, var(--auth-overlay-mid) 40%, transparent 80%);
}
.auth-visual-text {
  position: absolute; bottom: 56px; left: 52px; max-width: 360px;
}
.auth-card {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: 28px;
  padding: 40px 36px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.5);
}
.auth-badge {
  width: 60px; height: 60px; border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 8px 28px var(--accent-tint-4);
}
.auth-tab-bar {
  display: flex; background: var(--bg3);
  border-radius: 12px; padding: 4px; gap: 3px; margin-bottom: 28px;
}
.auth-tab {
  flex: 1; padding: 9px;
  border: none; border-radius: 9px; cursor: pointer;
  font-weight: 600; font-size: 14px;
  transition: all 0.2s; background: transparent; color: var(--text-mid);
}
.auth-tab.active { background: var(--accent); color: #fff; }
.auth-field { margin-bottom: 16px; }
.auth-field label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-mid); letter-spacing: 0.07em; margin-bottom: 7px;
}
.auth-field input {
  width: 100%; padding: 12px 14px;
  border-radius: 12px; border: 1.5px solid var(--border-strong);
  font-size: 14px; font-weight: 500;
}
.auth-error {
  padding: 11px 16px; background: rgba(255,59,59,0.12);
  border: 1px solid rgba(255,59,59,0.28); border-radius: 12px;
  font-size: 13px; color: #FF8A8A; margin-bottom: 16px;
}
.auth-success {
  padding: 11px 16px; background: rgba(56,217,120,0.12);
  border: 1px solid rgba(56,217,120,0.25); border-radius: 12px;
  font-size: 13px; color: #38D978; margin-bottom: 16px;
}

/* ═══════════════════════════════════════════
   ONBOARDING SURVEY (Feature 5)
═══════════════════════════════════════════ */
.onboarding-page {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  padding: 40px 20px;
}
.onboarding-card {
  width: 100%; max-width: 520px;
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: 28px;
  padding: 40px 36px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.5);
}
.onboarding-progress-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.onboarding-step-label {
  font-size: 11px; font-weight: 700; color: var(--text-mid);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.onboarding-progress-track {
  width: 100%; height: 6px; border-radius: 3px;
  background: var(--bg3); overflow: hidden;
}
.onboarding-progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(to right, var(--accent-dark), var(--accent));
  transition: width 350ms ease;
}
.onboarding-field-label {
  display: block; font-size: 13.5px; font-weight: 700;
  color: var(--text); margin-bottom: 10px;
}
.onboarding-options { display: flex; flex-wrap: wrap; gap: 8px; }
.onboarding-chip {
  padding: 9px 16px; border-radius: 50px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg3); color: var(--text-mid);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.18s ease;
}
.onboarding-chip:hover { border-color: var(--accent-tint-4); color: var(--text); }
.onboarding-chip.selected {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.onboarding-input {
  width: 100%; padding: 12px 14px;
  border-radius: 12px; border: 1.5px solid var(--border-strong);
  font-size: 14px; font-weight: 500;
  background: var(--bg3); color: var(--text);
}

/* Home page personalised greeting (fed by onboarding data) */
.home-greeting-card {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 20px 26px;
}
.home-greeting-hello { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.home-greeting-sub { font-size: 13.5px; color: var(--text-mid); }

/* ═══════════════════════════════════════════
   GPS ACTIVITY TRACKING (Feature 6)
═══════════════════════════════════════════ */
.activity-map-wrap {
  position: relative; width: 100%;
  border-radius: 20px; overflow: hidden;
  border: 1px solid var(--border-strong);
  background: var(--bg3);
}
.activity-map-canvas { width: 100%; height: 100%; }
.activity-map-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
  font-size: 13px; color: var(--text-mid);
  background: var(--bg3);
}
.activity-map-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); border: 3px solid #fff;
  box-shadow: 0 0 0 4px rgba(255,59,59,0.3);
}
.leaflet-container { background: var(--bg3) !important; font-family: 'Manrope', sans-serif; }
.leaflet-control-zoom a { background: var(--card) !important; color: var(--text) !important; border-color: var(--border-strong) !important; }
.leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: rgba(255,255,255,0.6) !important; }
.leaflet-control-attribution a { color: rgba(255,255,255,0.8) !important; }

.activity-start-card { text-align: center; }
.activity-start-btn { width: 100%; padding: 16px; font-size: 16px; }

.activity-gps-pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.activity-gps-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 50px;
  font-size: 12.5px; font-weight: 600;
  background: var(--bg3); border: 1px solid var(--border-strong); color: var(--text-mid);
}
.activity-gps-pill.connected { color: #38D978; border-color: rgba(56,217,120,0.3); background: rgba(56,217,120,0.1); }
.activity-gps-pill.lost { color: #EAB308; border-color: rgba(234,179,8,0.3); background: rgba(234,179,8,0.1); animation: pulseGps 1.4s ease-in-out infinite; }
.activity-gps-pill.paused { color: var(--accent); border-color: var(--accent-tint-3); background: var(--accent-tint-1); }
@keyframes pulseGps { 0%,100%{opacity:1;} 50%{opacity:0.55;} }

.activity-timer-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(56px, 12vw, 92px);
  letter-spacing: 0.02em; line-height: 1;
  color: var(--text); text-align: center;
  margin-bottom: 22px;
}

.activity-stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.activity-stat-tile {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 14px; text-align: center;
}
.activity-stat-icon { font-size: 20px; margin-bottom: 6px; }
.activity-stat-value { font-size: 21px; font-weight: 800; color: var(--text); }
.activity-stat-unit { font-size: 12px; font-weight: 600; color: var(--text-mid); }
.activity-stat-label { font-size: 11px; color: var(--text-mid); margin-top: 3px; font-weight: 600; }

.activity-controls-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.activity-control-btn { flex: 1; min-width: 110px; padding: 15px; font-size: 15px; }

.activity-summary-card { max-width: 720px; margin: 0 auto; }
.activity-summary-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }

.activity-detail-modal .meal-modal-body,
.activity-summary-modal .meal-modal-body { padding-top: 28px; }

.activity-card {
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 20px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.activity-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.activity-card-icon { font-size: 26px; flex-shrink: 0; }
.activity-card-title { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activity-card-date { font-size: 12px; color: var(--text-mid); margin-top: 2px; }
.activity-card-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-top: 14px; border-top: 1px solid var(--border); }
.activity-card-stat-val { display: block; font-size: 14px; font-weight: 800; color: var(--accent); }
.activity-card-stat-label { display: block; font-size: 10px; color: var(--text-light); font-weight: 600; margin-top: 2px; }

@media (max-width: 560px) {
  .activity-card-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .activity-controls-row { flex-direction: column; }
  .activity-control-btn { width: 100%; }
}

/* ═══════════════════════════════════════════
   ACTIVITY ANALYTICS DASHBOARD (Feature 7)
═══════════════════════════════════════════ */
.analytics-dashboard { margin-top: 24px; display: flex; flex-direction: column; gap: 28px; }
.analytics-section { }
.analytics-section-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 12px; }
.analytics-section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.analytics-empty-note { font-size: 13px; color: var(--text-light); }

.chart-canvas-wrap { position: relative; width: 100%; }
.chart-canvas-wrap canvas { width: 100% !important; height: 100% !important; }

.mini-stat-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; font-weight: 600; color: var(--text-mid); }

.pr-badges-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pr-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 50px; font-size: 12.5px; font-weight: 700;
  background: linear-gradient(135deg, rgba(255,138,31,0.16), rgba(255,59,59,0.16));
  border: 1px solid rgba(255,138,31,0.35); color: var(--accent-orange, #FF8A1F);
}

.insights-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; }
.insights-title { font-size: 12px; font-weight: 700; color: var(--text-mid); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }
.insights-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.insights-list li { font-size: 13.5px; color: var(--text); line-height: 1.5; }

.splits-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
.splits-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
.splits-table th {
  text-align: left; padding: 10px 14px; background: var(--bg3);
  font-size: 11px; font-weight: 700; color: var(--text-mid); letter-spacing: 0.04em; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.splits-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); font-weight: 500; }
.splits-table tr:last-child td { border-bottom: none; }
.splits-table tr.fastest-split td { color: var(--accent); font-weight: 700; background: var(--accent-tint-1); }

.hr-placeholder { text-align: center; padding: 26px 20px; background: var(--bg3); border: 1px dashed var(--border-strong); border-radius: 16px; }

.playback-stats-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.playback-stats-row > div { flex: 1; min-width: 100px; background: var(--bg3); border-radius: 12px; padding: 10px 12px; text-align: center; }
.playback-stat-val { display: block; font-size: 16px; font-weight: 800; color: var(--text); }
.playback-stat-label { display: block; font-size: 10.5px; color: var(--text-mid); font-weight: 600; margin-top: 2px; }
.playback-controls-row { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.playback-controls-row .seg { flex-shrink: 0; }

@media (max-width: 560px) {
  .splits-table { min-width: 380px; }
  .playback-controls-row { flex-direction: column; align-items: stretch; }
}

/* ═══════════════════════════════════════════
   PAGE WRAPPER
═══════════════════════════════════════════ */
.page-wrap { max-width: 1180px; margin: 0 auto; padding: 44px 24px 64px; }
.page-header { margin-bottom: 36px; }
.page-title { font-size: clamp(26px, 4vw, 36px); font-weight: 800; color: var(--text); margin-bottom: 6px; }
.page-sub { font-size: 15px; color: var(--text-mid); }
@media (max-width: 640px) { .page-wrap { padding: 28px 16px 60px; } }

/* ═══════════════════════════════════════════
   HOME PAGE
═══════════════════════════════════════════ */
.hero {
  position: relative; overflow: hidden;
  min-height: 560px;
  display: flex; align-items: center;
}
.hero-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  object-position: center 30%;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(100deg, var(--hero-overlay-start) 0%, var(--hero-overlay-mid) 45%, var(--hero-overlay-fade) 75%, transparent 100%);
}
.hero-glow {
  position: absolute; top: 20%; left: 35%;
  width: 500px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent-tint-2) 0%, transparent 70%);
  pointer-events: none;
}
.hero-content {
  position: relative; z-index: 1;
  max-width: 1180px; margin: 0 auto;
  width: 100%; padding: 80px 32px;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent-tint-2);
  border: 1px solid var(--accent-tint-3);
  border-radius: 30px; padding: 6px 16px;
  font-size: 12px; font-weight: 700; color: var(--accent-coral);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 24px;
}
.hero-headline {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(56px, 9vw, 108px);
  line-height: 0.92; color: var(--text);
  margin-bottom: 22px; letter-spacing: 0.01em;
  max-width: 680px;
}
.hero-headline span { color: var(--accent); }
.hero-sub {
  font-size: clamp(15px, 2vw, 18px);
  color: var(--text-mid);
  max-width: 460px; line-height: 1.7;
  margin-bottom: 36px; font-weight: 400;
}
.hero-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 52px; }
.hero-stats {
  display: flex; gap: 32px; flex-wrap: wrap;
}
.hero-stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px; color: var(--text); line-height: 1;
  margin-bottom: 3px;
}
.hero-stat-val span { color: var(--accent); }
.hero-stat-label { font-size: 12px; font-weight: 600; color: var(--text-mid); letter-spacing: 0.05em; text-transform: uppercase; }
@media (max-width: 640px) {
  .hero { min-height: 460px; }
  .hero-content { padding: 56px 20px; }
  .hero-stats { gap: 20px; }
}

/* Home section titles */
.section-label {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.section-title { font-size: clamp(22px, 3vw, 28px); font-weight: 800; color: var(--text); }
.section-link {
  background: none; border: none; cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--accent);
  display: flex; align-items: center; gap: 4px;
  transition: gap 0.2s;
}
.section-link:hover { gap: 8px; }
.home-section { padding: 56px 0; }
.home-section-alt { padding: 56px 0; background: var(--bg2); }

/* CTA band */
.cta-band {
  background: linear-gradient(130deg, var(--accent-bg-deep) 0%, var(--accent-tint-2) 40%, var(--accent-bg-deep) 100%);
  border-top: 1px solid var(--accent-tint-2);
  border-bottom: 1px solid var(--accent-tint-2);
  padding: 72px 24px; text-align: center;
  position: relative; overflow: hidden;
}
.cta-band-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, var(--accent-tint-2) 0%, transparent 65%);
  pointer-events: none;
}

/* ═══════════════════════════════════════════
   WORKOUT CARDS
═══════════════════════════════════════════ */
.workout-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  cursor: pointer;
}
.workout-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 16px 44px rgba(0,0,0,0.55), 0 0 0 1px var(--accent-tint-3);
  border-color: var(--accent-tint-3);
}
.workout-card:hover .workout-card-img { transform: scale(1.06); }
.workout-card-img-wrap { position: relative; overflow: hidden; aspect-ratio: 16/9; }
.workout-card-img {
  width: 100%; height: 100%; object-fit: cover;
  display: block; transition: transform 0.5s ease;
}
.workout-card-img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(7,7,9,0.85) 0%, transparent 55%);
}
.workout-card-chips {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px;
}
.workout-dur-chip {
  background: rgba(7,7,9,0.7); backdrop-filter: blur(6px);
  border-radius: 20px; padding: 4px 11px;
  font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 4px;
  border: 1px solid rgba(255,255,255,0.1);
}
.workout-card-body { padding: 18px 20px 20px; }
.workout-card-name { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.workout-card-desc { font-size: 13px; color: var(--text-mid); line-height: 1.55; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.workout-card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; margin-top: -6px; }
.workout-meta-chip { font-size: 11.5px; font-weight: 600; color: var(--text-mid); background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ═══════════════════════════════════════════
   EXERCISE INSTRUCTION DROPDOWN
   (Feature 2 — expandable technique panel per exercise)
═══════════════════════════════════════════ */
.exercise-list { display: flex; flex-direction: column; gap: 8px; }
.exercise-row {
  background: var(--banner-pill-bg, var(--bg3));
  border: 1px solid transparent;
  border-radius: 12px;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.exercise-row.done { background: var(--accent-tint-1); border-color: var(--accent-tint-3); }
.exercise-row.rest-row { background: transparent; padding: 4px 12px; }
.exercise-row-main {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; min-height: 20px;
  user-select: none;
}
.exercise-row-cb {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  border: 2px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; font-weight: 800;
  transition: all 0.2s;
}
.exercise-row-cb.checked { background: var(--accent); border-color: var(--accent); }
.exercise-row-text {
  flex: 1; font-size: 13.5px; font-weight: 600;
  color: var(--banner-pill-text, var(--text));
  transition: all 0.2s;
}
.exercise-row.done .exercise-row-text { color: var(--accent); text-decoration: line-through; opacity: 0.75; }
.exercise-detail { font-weight: 500; opacity: 0.6; margin-left: 6px; font-size: 12.5px; }
.exercise-info-btn {
  flex-shrink: 0;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--accent-tint-4);
  background: var(--accent-tint-1);
  color: var(--accent);
  font-size: 13px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.exercise-info-btn:hover { background: var(--accent-tint-2); transform: scale(1.08); }
.exercise-info-btn.open { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Grid-rows trick: animates height smoothly without knowing content size, ~300ms, no page jump */
.exercise-info-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 300ms cubic-bezier(.4,0,.2,1);
}
.exercise-info-panel.open { grid-template-rows: 1fr; }
.exercise-info-inner { overflow: hidden; min-height: 0; }
.exercise-info-divider { height: 1px; background: var(--border); margin: 0 12px; }
.exercise-info-title {
  font-size: 11px; font-weight: 700; color: var(--accent);
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 12px 14px 4px;
}
.exercise-info-list { list-style: none; padding: 0 14px 6px; display: flex; flex-direction: column; gap: 5px; }
.exercise-info-list li {
  font-size: 12.5px; line-height: 1.5; color: var(--info-body-text, var(--text-mid));
  padding-left: 14px; position: relative;
}
.exercise-info-list li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }
.exercise-info-list.mistakes li::before { content: "✕"; color: var(--accent); font-size: 10px; top: 1px; }
.exercise-info-muscles {
  display: flex; flex-wrap: wrap; gap: 16px;
  padding: 8px 14px 14px; font-size: 12.5px; color: var(--text);
}
.exercise-info-muscle-label {
  display: block; font-size: 10px; font-weight: 700; color: var(--info-label-text, var(--text-light));
  letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 2px;
}
.active-session-list .exercise-row { background: var(--banner-pill-bg); }
.active-session-list .exercise-row.done { background: var(--accent-tint-1); }

/* Workout detail modal reuses .meal-modal shell (see MEAL MODAL below) */
.workout-modal .meal-modal-body { padding-top: 20px; }

/* Active workout banner */
.active-workout-banner {
  background: linear-gradient(130deg, var(--accent-bg-deep) 0%, var(--accent-tint-3) 50%, var(--accent-bg-deep) 100%);
  border: 1px solid var(--accent-tint-3);
  border-radius: var(--r); padding: 28px;
  margin-bottom: 32px;
  box-shadow: 0 0 40px var(--accent-tint-2);
}
.timer-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 68px; color: var(--text); line-height: 1;
  letter-spacing: 0.04em;
}

/* ═══════════════════════════════════════════
   MEAL CARDS
═══════════════════════════════════════════ */
.meal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.meal-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--accent-tint-2);
  border-color: var(--accent-tint-3);
}
.meal-card:hover .meal-card-img { transform: scale(1.06); }
.meal-card-img-wrap { position: relative; overflow: hidden; aspect-ratio: 4/3; }
.meal-card-img {
  width: 100%; height: 100%; object-fit: cover;
  display: block; transition: transform 0.5s ease;
}
.meal-card-img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(7,7,9,0.75) 0%, transparent 50%);
}
.meal-save-btn {
  position: absolute; top: 12px; right: 12px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(7,7,9,0.65); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 17px;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
}
.meal-save-btn:hover { background: rgba(7,7,9,0.85); transform: scale(1.1); }
.meal-save-btn.saved { background: var(--accent-tint-4); border-color: var(--accent-tint-5); box-shadow: 0 0 12px var(--accent-tint-3); }
.meal-cat-pill {
  position: absolute; bottom: 12px; left: 12px;

  try{

   a compact catalog of what already exists in FitFuel and is instructed to
   recommend a real match first, only generating new content when nothing

═══════════════════════════════════════════ */
function buildCompactWorkoutCatalog(list){ return list.map(w=>({id:w.id,name:w.name,cat:w.cat,diff:w.diff,duration:w.duration,calories:w.calories,equipment:w.equipment,muscles:w.muscles})); }

/* Classifies a chat message into one of FitFuel's structured content types, or plain "chat". */
/* Classifies intent AND (for workout/meal/plan) searches the given catalogs and either
   recommends a match or generates new content — all in ONE call instead of a separate
   classify-then-fulfill round trip, since every extra request eats into the free tier's
   per-minute limit. */
async function classifyAndFulfill({apiKey,model,userText,contextSummary,workoutCatalog,mealCatalog,planCatalog}){
  const sys=buildSystemPrompt(contextSummary,`Determine what the person wants, then fulfil it in one step.

First classify their message into exactly one intent: "workout" (wants an exercise routine), "meal" (wants a meal/recipe/food suggestion), "plan" (wants a multi-week training program), "report" (wants their progress/weekly summary/stats), or "chat" (anything else — questions, advice, motivation, explanations, greetings, follow-ups).

If intent is "workout": search the given workout catalog for a strong match to their request, equipment, and experience level. If a strong match exists, set found:true and matchedId to that catalog item's id exactly as given. If nothing matches well, set found:false and fill "generated" with a new workout: {"name":string,"description":string,"difficulty":"Beginner"|"Intermediate"|"Advanced","duration":number,"calories":number,"equipment":string[],"muscles":string[],"warmup":string[],"exercises":[{"name":string,"sets":number,"reps":string,"rest":string,"tempo":string}],"cooldown":string[]}.

If intent is "meal": search the given meal catalog the same way. Generated shape if needed: {"name":string,"category":"Breakfast"|"Lunch"|"Dinner"|"Snacks"|"Vegetarian","calories":number,"protein":number,"carbs":number,"fat":number,"ingredients":string[],"instructions":string[],"prepTime":number,"cookTime":number}.

If intent is "plan": search the given plan catalog the same way. Generated shape if needed: {"name":string,"goal":string,"weeks":[{"weekNumber":number,"focus":string,"sessions":[{"day":string,"type":string,"description":string}]}]}.

If intent is "report" or "chat", omit found/matchedId/generated entirely — those are handled elsewhere.

Respond with strict JSON only: {"intent":"workout"|"meal"|"plan"|"report"|"chat","reply":"<1-2 sentence natural reply, only for workout/meal/plan>","found":boolean,"matchedId":<catalog id or null>,"generated":{...}|null}

Workout catalog: ${JSON.stringify(workoutCatalog)}
Meal catalog: ${JSON.stringify(mealCatalog)}
Plan catalog: ${JSON.stringify(planCatalog)}`);
  return completeGeminiJSON({apiKey,model,messages:[{role:"system",content:sys},{role:"user",content:userText}]});
}
/* Feature 5 — real FitFuel data, not an estimate. The numbers are computed locally; only the
   short narrative summary is written by the AI, grounded in those exact figures. */
function computeWeeklyReportData(tracker,activities,user){
  const s=aggregateActivityStats(activities);
  const now=Date.now(), week=7*86400000;
  const weekActs=(activities||[]).filter(a=>now-new Date(a.finishedAt).getTime()<=week);
  const goalObjs=(user?.goals||[]).filter(g=>typeof g!=="string");
  const totalMilestones=goalObjs.reduce((t,g)=>t+(g.milestones?g.milestones.length:0),0);
  const doneMilestones=goalObjs.reduce((t,g)=>t+(g.milestones?g.milestones.filter(m=>m.done).length:0),0);
  return {
    workoutsCompleted: tracker?.wkCt||0,
    runningDistance: s.weeklyDistance,
    caloriesBurned: weekActs.reduce((t,a)=>t+(a.calories||0),0),
    activitiesThisWeek: weekActs.length,
    goalCompletion: totalMilestones>0?Math.round((doneMilestones/totalMilestones)*100):null,
    streak: s.runningStreak,
    prs: [...new Set((activities||[]).flatMap(a=>a.personalRecords||[]))],
  };
}
async function generateWeeklyReportCard({apiKey,model,contextSummary,tracker,activities,user}){
  const data=computeWeeklyReportData(tracker,activities,user);
  const sys=buildSystemPrompt(contextSummary,`Write a short (2-3 sentence) encouraging weekly summary using ONLY these real numbers — do not invent or estimate anything beyond them: ${JSON.stringify(data)}`);
  let summary="";
  try{ summary=await completeGeminiText({apiKey,model,messages:[{role:"system",content:sys},{role:"user",content:"Summarise my week."}]}); }catch{}
  return {...data,summary};
}

/* Simple in-memory cache + in-flight guard: avoids re-billing/re-calling for an
   identical request repeated in the same session (Technical Requirements: caching + rate limiting). */
const _aiCache=new Map();
const _aiInFlight=new Set();
function _aiCacheKey(model,messages){ try{ return model+"::"+JSON.stringify(messages); }catch{ return null; } }

function describeAIError(status){
  if(status===404) return "Model not found (404). Google retires Gemini model versions on short notice — set the Model field in Settings to gemini-flash-latest (auto-updates) instead of a pinned version, or check aistudio.google.com for current names.";
  if(status===400) return "Bad request (400) — often an invalid or misspelled model name. Check Settings → AI Coach.";
  if(status===401||status===403) return "Invalid API key ("+status+"). Double-check the key in Settings → AI Coach.";
  if(status===429) return "Rate limit reached (429). You're sending requests faster than the free tier allows — wait a moment and try again.";
  return null;
}

/* Gemini's API doesn't speak the OpenAI message format, so every call site in the app still
   builds plain [{role:"system"|"user"|"assistant", content:string|array}] messages exactly like
   before — this adapter converts that into Gemini's {systemInstruction, contents} shape right
   before sending, so nothing else in the app had to change for the provider switch. */
function _geminiPartsFromContent(content){
  if(typeof content==="string") return [{text:content}];
  return content.map(part=>{
    if(part.type==="text") return {text:part.text};
    if(part.type==="image_url"){
      const url=part.image_url?.url||"";
      const match=url.match(/^data:([^;]+);base64,(.*)$/);
      if(match) return {inlineData:{mimeType:match[1], data:match[2]}};
      return {text:"[image attached]"};
    }
    return {text:""};
  });
}
function convertMessagesToGemini(messages){
  const systemParts=[];
  const contents=[];
  for(const m of messages){
    if(m.role==="system"){ systemParts.push(...(_geminiPartsFromContent(m.content))); continue; }
    contents.push({ role: m.role==="assistant"?"model":"user", parts:_geminiPartsFromContent(m.content) });
  }
  return { systemInstruction: systemParts.length?{parts:systemParts}:undefined, contents };
}
function _geminiText(candidateResponse){
  const parts=candidateResponse?.candidates?.[0]?.content?.parts||[];
  return parts.map(p=>p.text||"").join("");
}
function _geminiUrl(model,method){
  return `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model||"gemini-flash-latest")}:${method}`;
}
/* HTTP header values must be plain ASCII. A key copy-pasted from a doc/notes app can pick up
   "smart" typographic substitutes (en-dash instead of hyphen, curly quotes, etc.) that the
   browser then rejects with a cryptic ByteString conversion error. Strip anything outside
   printable ASCII before it ever reaches a fetch header. */
function sanitizeApiKey(key){
  return (key||"").trim().replace(/[^\x20-\x7E]/g,"");
}

/* Free-tier rate limits are tight, and one chat turn can trigger several Gemini calls
   (classify, search/generate, title, memory). This serializes every Gemini request with a
   minimum gap between them, and automatically retries once or twice with backoff on a 429
   before giving up — so an occasional rate limit recovers on its own instead of just failing. */
let _geminiQueueTail=Promise.resolve();
let _geminiLastCallAt=0;
const GEMINI_MIN_GAP_MS=1400;
function _scheduleGeminiFetch(url,options){
  const run=async()=>{
    const wait=Math.max(0,_geminiLastCallAt+GEMINI_MIN_GAP_MS-Date.now());
    if(wait>0) await new Promise(r=>setTimeout(r,wait));
    _geminiLastCallAt=Date.now();
    for(let attempt=0;attempt<=2;attempt++){
      const res=await fetch(url,options);
      if(res.status!==429||attempt===2) return res;
      await new Promise(r=>setTimeout(r,3000*(attempt+1)));
      _geminiLastCallAt=Date.now();
    }
  };
  const result=_geminiQueueTail.then(run,run);
  _geminiQueueTail=result.catch(()=>{});
  return result;
}

/* Streaming chat completion — powers the live Coach conversation. */
async function streamGeminiChat({apiKey,model,messages,onToken,onDone,onError}){
  if(!apiKey){ onError&&onError("No Gemini API key configured. Add one in Settings → AI Coach."); return; }
  try{
    const {systemInstruction,contents}=convertMessagesToGemini(messages);
    const res=await _scheduleGeminiFetch(_geminiUrl(model,"streamGenerateContent")+"?alt=sse",{
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-goog-api-key":sanitizeApiKey(apiKey) },
      body:JSON.stringify({ contents, systemInstruction, generationConfig:{ temperature:0.7 } }),
    });
    if(!res.ok||!res.body){
      let msg=describeAIError(res.status);
      if(!msg){
        msg=`Gemini request failed (${res.status}).`;
        try{ const j=await res.json(); const errObj=Array.isArray(j)?j[0]?.error:j?.error; if(errObj?.message) msg=errObj.message; }catch{}
      }
      onError&&onError(msg); return;
    }
    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buffer="", full="";
    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split("\n");
      buffer=lines.pop();
      for(const line of lines){
        const trimmed=line.trim();
        if(!trimmed.startsWith("data:")) continue;
        const data=trimmed.slice(5).trim();
        if(!data) continue;
        try{
          const json=JSON.parse(data);
          const delta=_geminiText(json);
          if(delta){ full+=delta; onToken&&onToken(delta,full); }
        }catch{}
      }
    }
    onDone&&onDone(full);
  }catch(err){
    onError&&onError(err?.message||"Network error contacting Gemini.");
  }
}
/* Non-streaming, JSON-mode completion — powers workout/meal generation, smart search,
   goal breakdowns, and anywhere else we need a structured, parseable result. */
async function completeGeminiJSON({apiKey,model,messages}){
  if(!apiKey) throw new Error("No Gemini API key configured. Add one in Settings → AI Coach.");
  const key=_aiCacheKey(model,messages);
  if(key&&_aiCache.has(key)) return _aiCache.get(key);
  if(key&&_aiInFlight.has(key)) throw new Error("A similar request is already in progress — please wait a moment.");
  if(key) _aiInFlight.add(key);
  try{
    const {systemInstruction,contents}=convertMessagesToGemini(messages);
    const res=await _scheduleGeminiFetch(_geminiUrl(model,"generateContent"),{
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-goog-api-key":sanitizeApiKey(apiKey) },
      body:JSON.stringify({ contents, systemInstruction, generationConfig:{ temperature:0.6, responseMimeType:"application/json" } }),
    });
    if(!res.ok){
      let msg=describeAIError(res.status);
      if(!msg){
        msg=`Gemini request failed (${res.status}).`;
        try{ const j=await res.json(); if(j?.error?.message) msg=j.error.message; }catch{}
      }
      throw new Error(msg);
    }
    const data=await res.json();
    const content=_geminiText(data);
    if(!content) throw new Error("Gemini returned an empty response.");
    let parsed;
    try{ parsed=JSON.parse(content); }
    catch{ throw new Error("Couldn't parse the AI's response as JSON. Try again."); }
    if(key) _aiCache.set(key,parsed);
    return parsed;
  } finally {
    if(key) _aiInFlight.delete(key);
  }
}
/* Plain (non-JSON-mode) single-shot completion — used for short text like dashboard
   greetings and habit-nudge phrasing where we just want a sentence back, not JSON. */
async function completeGeminiText({apiKey,model,messages}){
  if(!apiKey) throw new Error("No API key configured.");
  const {systemInstruction,contents}=convertMessagesToGemini(messages);
  const res=await _scheduleGeminiFetch(_geminiUrl(model,"generateContent"),{
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-goog-api-key":sanitizeApiKey(apiKey) },
    body:JSON.stringify({ contents, systemInstruction, generationConfig:{ temperature:0.7, maxOutputTokens:150 } }),
  });
  if(!res.ok) throw new Error(describeAIError(res.status)||`Gemini request failed (${res.status}).`);
  const data=await res.json();
  return _geminiText(data).trim();
}
/* Downscales an uploaded image client-side before storing it (localStorage has a small quota,
   and progress photos are only ever kept on this device — see Feature 5 / AI Vision). */
function downscaleImageFile(file,maxDim=480){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height){ if(width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; } }
        else{ if(height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; } }
        const canvas=document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",0.8));
      };
      img.onerror=()=>reject(new Error("Couldn't read that image."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

/* Great-circle distance between two GPS points, in km */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDuration(totalSeconds){
  const s=Math.max(0,Math.round(totalSeconds));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`;
}
/* minutes-per-km (float) -> "5:28" string */
function formatPace(minPerKm){
  if(!minPerKm||!isFinite(minPerKm)||minPerKm<=0) return "—:—";
  const m=Math.floor(minPerKm), s=Math.round((minPerKm-m)*60);
  return `${m}:${String(s).padStart(2,"0")}`;
}
/* MET-based calorie estimate from activity type + average speed + bodyweight */
function estimateMET(type,speedKmh){
  if(type==="Walking") return speedKmh<4?2.8:speedKmh<5.5?3.5:speedKmh<6.5?4.3:5;
  if(type==="Hiking") return 6;
  if(type==="Jogging") return speedKmh<8?7:8.3;
  // Running
  if(speedKmh<8) return 8.3;
  if(speedKmh<9.7) return 9.8;
  if(speedKmh<11.3) return 11;
  if(speedKmh<12.9) return 11.8;
  return 12.8;
}
function estimateCalories(type,avgSpeedKmh,weightKg,hours){
  const w=weightKg&&weightKg>0?Number(weightKg):65;
  const met=estimateMET(type,avgSpeedKmh||0);
  return Math.round(met*w*Math.max(0,hours));
}
function loadActivities(){ return loadLS("ff_activities",[]); }
function saveActivitiesLS(list){ saveLS("ff_activities",list); }
function activityTitle(type,dateIso){
  const h=new Date(dateIso).getHours();
  const tod=h<12?"Morning":h<18?"Afternoon":"Evening";
  const verb={Running:"Run",Jogging:"Jog",Walking:"Walk",Hiking:"Hike"}[type]||type;
  return `${tod} ${verb}`;
}
/* Aggregate stats used by the Home dashboard + Profile lifetime card */
function aggregateActivityStats(activities){
  const now=Date.now();
  const day=86400000;
  const inLast=days=>activities.filter(a=>now-new Date(a.finishedAt).getTime()<=days*day);
  const sumDist=list=>list.reduce((t,a)=>t+a.distance,0);
  const runsAndJogs=activities.filter(a=>a.type==="Running"||a.type==="Jogging");
  const walks=activities.filter(a=>a.type==="Walking"||a.type==="Hiking");
  const sorted=[...activities].sort((a,b)=>new Date(b.finishedAt)-new Date(a.finishedAt));
  // running streak: consecutive calendar days (from today backward) containing >=1 activity
  const daySet=new Set(activities.map(a=>new Date(a.finishedAt).toDateString()));
  let streak=0, cursor=new Date();
  while(daySet.has(cursor.toDateString())){ streak++; cursor.setDate(cursor.getDate()-1); }
  const totalWeeks=Math.max(1, activities.length ? Math.ceil((now-new Date(sorted[sorted.length-1].finishedAt).getTime())/(7*day)) : 1);
  return {
    lastActivity: sorted[0]||null,
    weeklyDistance: sumDist(inLast(7)),
    monthlyDistance: sumDist(inLast(30)),
    totalActivities: activities.length,
    longestRun: runsAndJogs.length ? Math.max(...runsAndJogs.map(a=>a.distance)) : 0,
    longestActivity: activities.length ? Math.max(...activities.map(a=>a.distance)) : 0,
    runningStreak: streak,
    totalDistance: sumDist(activities),
    runningDistance: sumDist(runsAndJogs),
    walkingDistance: sumDist(walks),
    totalTimeSeconds: activities.reduce((t,a)=>t+(a.duration||0),0),
    avgWeeklyDistance: sumDist(activities)/totalWeeks,
    fastestPace: activities.length ? Math.min(...activities.filter(a=>a.avgPace>0).map(a=>a.avgPace)) : 0,
    highestElevation: activities.length ? Math.max(0,...activities.map(a=>a.maxElevation||0)) : 0,
  };
}

/* ═══════════════════════════════════════════
   ACTIVITY ANALYTICS — data processing (Feature 7)
   All of this runs once at save time and is stored on the
   activity object, so the analytics dashboard never has to
   recompute from raw GPS points on load.
═══════════════════════════════════════════ */

/* Distance-based splits — 1km by default, 500m if the whole activity is under 1km */
function computeSplits(route,totalDistanceKm){
  if(!route||route.length<2||totalDistanceKm<=0) return [];
  const unitKm=totalDistanceKm<1?0.5:1;
  const splits=[]; let cum=0, splitStartDist=0, splitStartTime=route[0].timestamp, idx=1;
  for(let i=1;i<route.length;i++){
    cum+=haversineKm(route[i-1].lat,route[i-1].lng,route[i].lat,route[i].lng);
    while(cum>=idx*unitKm-1e-9 && idx*unitKm<=totalDistanceKm+1e-9){
      const distanceKm=idx*unitKm-splitStartDist;
      const timeSec=(route[i].timestamp-splitStartTime)/1000;
      splits.push({
        label: unitKm===1?`${idx} km`:`${Math.round(idx*unitKm*1000)} m`,
        distanceKm, timeSec,
        pace: distanceKm>0?(timeSec/60)/distanceKm:0,
        avgSpeed: timeSec>0?distanceKm/(timeSec/3600):0,
        partial:false,
      });
      splitStartDist=idx*unitKm; splitStartTime=route[i].timestamp; idx++;
    }
  }
  const remain=totalDistanceKm-splitStartDist;
  if(remain>0.03){
    const lastPoint=route[route.length-1];
    const timeSec=(lastPoint.timestamp-splitStartTime)/1000;
    splits.push({
      label:`${Math.round(totalDistanceKm*1000)} m`,
      distanceKm:remain, timeSec,
      pace:remain>0?(timeSec/60)/remain:0,
      avgSpeed:timeSec>0?remain/(timeSec/3600):0,
      partial:true,
    });
  }
  return splits;
}
/* Fixed time-window intervals (e.g. every 5 or 10 minutes) */
function computeTimeIntervals(route,intervalMin,type,weightKg){
  if(!route||route.length<2) return [];
  const intervalMs=intervalMin*60000;
  let bIdx=0, bStart=route[0].timestamp, bStartDist=0, cum=0;
  const buckets=[];
  for(let i=1;i<route.length;i++){
    cum+=haversineKm(route[i-1].lat,route[i-1].lng,route[i].lat,route[i].lng);
    while(route[i].timestamp-bStart>=intervalMs){
      const distanceKm=Math.max(0,cum-bStartDist);
      const timeSec=intervalMin*60;
      const avgSpeed=distanceKm>0?distanceKm/(timeSec/3600):0;
      buckets.push({
        label:`${bIdx*intervalMin}–${(bIdx+1)*intervalMin} min`,
        distanceKm, avgPace:distanceKm>0?(timeSec/60)/distanceKm:0, avgSpeed,
        calories:estimateCalories(type,avgSpeed,weightKg,timeSec/3600),
      });
      bStart+=intervalMs; bStartDist=cum; bIdx++;
    }
  }
  const lastPoint=route[route.length-1];
  const trailingSec=(lastPoint.timestamp-bStart)/1000;
  if(trailingSec>30){
    const distanceKm=Math.max(0,cum-bStartDist);
    const avgSpeed=distanceKm>0?distanceKm/(trailingSec/3600):0;
    buckets.push({
      label:`${bIdx*intervalMin}+ min`,
      distanceKm, avgPace:distanceKm>0?(trailingSec/60)/distanceKm:0, avgSpeed,
      calories:estimateCalories(type,avgSpeed,weightKg,trailingSec/3600),
    });
  }
  return buckets;
}
/* Smoothed, downsampled pace+speed-over-time series (capped sample count keeps storage
   and chart rendering fast even for activities with thousands of raw GPS points) */
function computeTimeSeries(route,maxSamples=60){
  if(!route||route.length<2) return [];
  const t0=route[0].timestamp;
  const totalMs=route[route.length-1].timestamp-t0;
  if(totalMs<=0) return [];
  const bucketCount=Math.min(maxSamples,Math.max(6,Math.round(totalMs/30000)));
  const bucketMs=totalMs/bucketCount;
  const buckets=Array.from({length:bucketCount},()=>({distSum:0,timeSum:0,speedSum:0,speedCount:0}));
  for(let i=1;i<route.length;i++){
    const d=haversineKm(route[i-1].lat,route[i-1].lng,route[i].lat,route[i].lng);
    const dt=(route[i].timestamp-route[i-1].timestamp)/1000;
    const tMid=((route[i].timestamp-t0)+(route[i-1].timestamp-t0))/2;
    let bIdx=Math.min(bucketCount-1,Math.max(0,Math.floor(tMid/bucketMs)));
    buckets[bIdx].distSum+=d; buckets[bIdx].timeSum+=dt;
    if(route[i].speed!=null){ buckets[bIdx].speedSum+=route[i].speed; buckets[bIdx].speedCount++; }
  }
  return buckets.map((b,i)=>({
    t: Math.round(((i+0.5)*bucketMs/60000)*10)/10,
    pace: b.distSum>0?(b.timeSum/60)/b.distSum:0,
    speed: b.speedCount>0?b.speedSum/b.speedCount:(b.timeSum>0?b.distSum/(b.timeSum/3600):0),
  })).filter(p=>p.speed>0||p.pace>0);
}
/* Smoothed elevation-vs-distance profile */
function computeElevationSeries(route,maxSamples=60){
  if(!route||route.length<2||!route.some(p=>p.elevation!=null)) return [];
  let cum=0;
  const points=[{d:0,e:route[0].elevation||0}];
  for(let i=1;i<route.length;i++){
    cum+=haversineKm(route[i-1].lat,route[i-1].lng,route[i].lat,route[i].lng);
    points.push({d:cum,e:route[i].elevation!=null?route[i].elevation:points[points.length-1].e});
  }
  if(cum<=0) return [];
  const bucketCount=Math.min(maxSamples,Math.max(6,points.length));
  const bucketKm=cum/bucketCount;
  const buckets=Array.from({length:bucketCount},()=>({sum:0,count:0}));
  points.forEach(p=>{
    let bIdx=Math.min(bucketCount-1,Math.max(0,Math.floor(p.d/bucketKm)));
    buckets[bIdx].sum+=p.e; buckets[bIdx].count++;
  });
  return buckets.map((b,i)=>({distanceKm:Math.round(((i+0.5)*bucketKm)*100)/100,elevation:b.count>0?b.sum/b.count:null})).filter(p=>p.elevation!=null);
}
/* Best "full" split pace — used both for display and fastest-1km PR detection */
function bestSplitPace(activity){
  const full=(activity.splits||[]).filter(s=>!s.partial);
  if(!full.length) return Infinity;
  return Math.min(...full.map(s=>s.pace));
}
/* Compare a freshly-finished activity against prior saved activities to detect PRs.
   Fastest-5km/10km use total-distance activities close to that target distance, since
   true rolling best-segment analysis would need far more GPS precision than a demo app has. */
function detectPersonalRecords(newAct,priorActivities){
  const records=[];
  const isRun=newAct.type==="Running"||newAct.type==="Jogging";
  const priorRuns=priorActivities.filter(a=>a.type==="Running"||a.type==="Jogging");
  const priorWalks=priorActivities.filter(a=>a.type==="Walking"||a.type==="Hiking");
  if(isRun){
    const longest=priorRuns.length?Math.max(...priorRuns.map(a=>a.distance)):0;
    if(newAct.distance>longest&&newAct.distance>0.1) records.push("Longest Run");
  } else {
    const longest=priorWalks.length?Math.max(...priorWalks.map(a=>a.distance)):0;
    if(newAct.distance>longest&&newAct.distance>0.1) records.push("Longest Walking Distance");
  }
  const newBest=bestSplitPace(newAct);
  if(newBest<Infinity){
    const priorBest=priorActivities.length?Math.min(...priorActivities.map(bestSplitPace)):Infinity;
    if(newBest<priorBest) records.push("Fastest 1 km");
  }
  const near=(v,target,tol)=>Math.abs(v-target)<=tol;
  if(near(newAct.distance,5,0.3)){
    const cands=priorActivities.filter(a=>near(a.distance,5,0.3)&&a.avgPace>0);
    const priorBest=cands.length?Math.min(...cands.map(a=>a.avgPace)):Infinity;
    if(newAct.avgPace>0&&newAct.avgPace<priorBest) records.push("Fastest 5 km");
  }
  if(near(newAct.distance,10,0.5)){
    const cands=priorActivities.filter(a=>near(a.distance,10,0.5)&&a.avgPace>0);
    const priorBest=cands.length?Math.min(...cands.map(a=>a.avgPace)):Infinity;
    if(newAct.avgPace>0&&newAct.avgPace<priorBest) records.push("Fastest 10 km");
  }
  const priorMaxSpeed=priorActivities.length?Math.max(...priorActivities.map(a=>a.avgSpeed||0)):0;
  if(newAct.avgSpeed>priorMaxSpeed&&newAct.avgSpeed>0) records.push("Highest Average Speed");
  const priorMaxElev=priorActivities.length?Math.max(...priorActivities.map(a=>a.elevGain||0)):0;
  if(newAct.hasElevation&&newAct.elevGain>priorMaxElev&&newAct.elevGain>0) records.push("Highest Elevation Gain");
  const priorMaxDur=priorActivities.length?Math.max(...priorActivities.map(a=>a.duration||0)):0;
  if(newAct.duration>priorMaxDur&&newAct.duration>60) records.push("Longest Activity Duration");
  return records;
}
/* Short, positive, data-driven summary sentences */
function generateInsights(activity){
  const insights=[];
  const full=(activity.splits||[]).filter(s=>!s.partial);
  if(full.length>=2){
    let bestIdx=0; full.forEach((s,i)=>{ if(s.pace<full[bestIdx].pace) bestIdx=i; });
    insights.push(`Your fastest split was ${full[bestIdx].label}, at a ${formatPace(full[bestIdx].pace)}/km pace.`);
    const avgP=full.reduce((a,s)=>a+s.pace,0)/full.length;
    const variance=full.reduce((a,s)=>a+Math.abs(s.pace-avgP),0)/full.length;
    if(avgP>0&&variance/avgP<0.08) insights.push("Your pace remained consistent throughout the activity.");
    const lastFifth=full.slice(Math.ceil(full.length*0.8));
    if(lastFifth.length){
      const lastAvg=lastFifth.reduce((a,s)=>a+s.pace,0)/lastFifth.length;
      if(avgP>0&&lastAvg>avgP*1.1) insights.push("You slowed slightly during the final stretch of the activity.");
      else if(avgP>0&&lastAvg<avgP*0.95) insights.push("You finished strong, picking up the pace in the final stretch.");
    }
  }
  if(activity.hasElevation&&activity.elevGain>20) insights.push(`You kept a solid pace despite climbing ${Math.round(activity.elevGain)}m of elevation.`);
  if(activity.personalRecords&&activity.personalRecords.length) insights.push(`New personal best: ${activity.personalRecords.join(", ")}! 🎉`);
  if(!insights.length) insights.push("Nice work getting outside and moving — every activity adds up!");
  return insights;
}
/* Locate the route point index reached after `ms` of virtual playback time — used by Route Playback */
function findRouteIndexAtMs(route,ms){
  if(!route||!route.length) return 0;
  const targetTime=route[0].timestamp+ms;
  let idx=0;
  while(idx<route.length-1&&route[idx+1].timestamp<=targetTime) idx++;
  return idx;
}
function buildTrendBuckets(activities,range){
  if(!activities.length) return [];
  const now=new Date();
  let count, bucketFn, labels;
  if(range==="week"){
    count=7;
    bucketFn=d=>{ const diff=Math.floor((now-d)/86400000); return diff>=0&&diff<7?6-diff:-1; };
    labels=Array.from({length:7},(_,i)=>{ const dt=new Date(now); dt.setDate(dt.getDate()-(6-i)); return dt.toLocaleDateString(undefined,{weekday:"short"}); });
  } else if(range==="month"){
    count=5;
    bucketFn=d=>{ const diffDays=Math.floor((now-d)/86400000); const wk=Math.floor(diffDays/7); return wk>=0&&wk<5?4-wk:-1; };
    labels=Array.from({length:5},(_,i)=>`Wk ${i+1}`);
  } else if(range==="year"){
    count=12;
    bucketFn=d=>{ const m=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth()); return m>=0&&m<12?11-m:-1; };
    labels=Array.from({length:12},(_,i)=>{ const dt=new Date(now.getFullYear(),now.getMonth()-(11-i),1); return dt.toLocaleDateString(undefined,{month:"short"}); });
  } else {
    const sorted=[...activities].sort((a,b)=>new Date(a.finishedAt)-new Date(b.finishedAt));
    const first=new Date(sorted[0].finishedAt);
    count=Math.max(1,(now.getFullYear()-first.getFullYear())*12+(now.getMonth()-first.getMonth())+1);
    bucketFn=d=>{ const m=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth()); return m>=0&&m<count?count-1-m:-1; };
    labels=Array.from({length:count},(_,i)=>{ const dt=new Date(now.getFullYear(),now.getMonth()-(count-1-i),1); return dt.toLocaleDateString(undefined,{month:"short",year:"2-digit"}); });
  }
  const buckets=Array.from({length:count},()=>({distance:0,time:0,calories:0,elevGain:0,count:0,paceSum:0,paceCount:0}));
  activities.forEach(a=>{
    const idx=bucketFn(new Date(a.finishedAt));
    if(idx<0||idx>=count) return;
    const b=buckets[idx];
    b.distance+=a.distance; b.time+=a.duration||0; b.calories+=a.calories||0; b.elevGain+=a.elevGain||0; b.count+=1;
    if(a.avgPace>0){ b.paceSum+=a.avgPace; b.paceCount++; }
  });
  return buckets.map((b,i)=>({
    label:labels[i],
    distance:Math.round(b.distance*100)/100,
    timeMin:Math.round(b.time/60),
    calories:Math.round(b.calories),
    elevGain:Math.round(b.elevGain),
    count:b.count,
    avgPace:b.paceCount>0?b.paceSum/b.paceCount:0,
  }));
}
/* ─── LUMINANCE HELPERS ─────────────────────────────── */
function hexToRgb(hex){
  hex=hex.replace(/^#/,"");
  if(hex.length===3) hex=hex.split("").map(c=>c+c).join("");
  const n=parseInt(hex,16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function relativeLuminance({r,g,b}){
  const ch=c=>{const s=c/255;return s<=0.03928?s/12.92:Math.pow((s+0.055)/1.055,2.4);};
  return 0.2126*ch(r)+0.7152*ch(g)+0.0722*ch(b);
}
function adjustHex(hex,factor){
  let {r,g,b}=hexToRgb(hex);
  r=Math.min(255,Math.max(0,Math.round(r+(factor>0?(255-r):r)*Math.abs(factor))));
  g=Math.min(255,Math.max(0,Math.round(g+(factor>0?(255-g):g)*Math.abs(factor))));
  b=Math.min(255,Math.max(0,Math.round(b+(factor>0?(255-b):b)*Math.abs(factor))));
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}
// Build tint tokens from an accent hex string.
// Returns an object with --accent-tint-1..5 and --accent-bg-deep.
function buildTints(accentHex, bgHex){
  const {r,g,b}=hexToRgb(accentHex);
  const a=`${r},${g},${b}`;
  // --accent-bg-deep: a very dark mix of the bg colour tinted toward accent
  const bgRgb=hexToRgb(bgHex);
  const isLightBg=relativeLuminance(bgRgb)>0.179;
  // For light themes the "deep" bg is a faint tinted white; for dark it's a dark tinted shade
  const deepBg = isLightBg
    ? adjustHex(accentHex, 0.80)   // very pale tint of accent
    : adjustHex(accentHex, -0.82); // very dark shade of accent
  return {
    "--accent-tint-1":`rgba(${a},0.07)`,
    "--accent-tint-2":`rgba(${a},0.12)`,
    "--accent-tint-3":`rgba(${a},0.20)`,
    "--accent-tint-4":`rgba(${a},0.35)`,
    "--accent-tint-5":`rgba(${a},0.45)`,
    "--accent-bg-deep": deepBg,
  };
}
function buildCustomVars(accentHex,bgHex){
  const bgRgb=hexToRgb(bgHex);
  const lum=relativeLuminance(bgRgb);
  const isLight=lum>0.179;
  const text       = isLight?"#0D0E12":"#F0F0F5";
  const textMid    = isLight?"#50525E":"#8B8D97";
  const textLight  = isLight?"#9CA0AE":"#444653";
  const bg2        = adjustHex(bgHex,isLight?-0.06:0.06);
  const bg3        = adjustHex(bgHex,isLight?-0.10:0.10);
  const card       = adjustHex(bgHex,isLight? 0.05:0.04);
  const card2      = adjustHex(bgHex,isLight?-0.03:0.07);
  const borderA    = isLight?"rgba(0,0,0,0.08)":"rgba(255,255,255,0.07)";
  const borderS    = isLight?"rgba(0,0,0,0.14)":"rgba(255,255,255,0.13)";
  const {r,g,b}=hexToRgb(accentHex);
  // Streak / banner vars
  const streakLabel  = isLight?"rgba(0,0,0,0.45)":"rgba(255,255,255,0.5)";
  const streakText   = isLight?"rgba(0,0,0,0.75)":"rgba(255,255,255,0.85)";
  const streakSub    = isLight?"rgba(0,0,0,0.55)":"rgba(255,255,255,0.65)";
  const bannerHead   = isLight?"#0D0E12":"#fff";
  const pillBg       = isLight?"rgba(0,0,0,0.07)":"rgba(255,255,255,0.12)";
  const pillText     = isLight?"#0D0E12":"rgba(255,255,255,0.88)";
  const trackBg     = isLight?"rgba(0,0,0,0.12)":"rgba(255,255,255,0.15)";
  const trackFill   = isLight?"#0D0E12":"#fff";
  const btnBg       = isLight?"rgba(0,0,0,0.07)":"rgba(255,255,255,0.1)";
  const btnBorder   = isLight?"rgba(0,0,0,0.15)":"rgba(255,255,255,0.18)";
  return {
    "--accent":accentHex,"--accent-dark":adjustHex(accentHex,-0.2),
    "--accent-coral":adjustHex(accentHex,0.15),
    "--bg":bgHex,"--bg2":bg2,"--bg3":bg3,"--card":card,"--card2":card2,
    "--border":borderA,"--border-strong":borderS,
    "--text":text,"--text-mid":textMid,"--text-light":textLight,
    "--accent-glow":`rgba(${r},${g},${b},0.22)`,
    "--streak-label":streakLabel,"--streak-text":streakText,"--streak-sub":streakSub,
    "--banner-label":streakLabel,"--banner-heading":bannerHead,
    "--banner-pill-bg":pillBg,"--banner-pill-text":pillText,
    "--banner-track":trackBg,"--banner-track-fill":trackFill,
    "--banner-btn-bg":btnBg,"--banner-btn-border":btnBorder,
  };
}

// Every CSS variable managed by the theme engine. Listing them explicitly
// ensures applySettings always writes/clears every variable so nothing
// leaks from a previous theme.
const ALL_THEME_VARS=[
  "--accent","--accent-dark","--accent-coral","--accent-glow",
  "--bg","--bg2","--bg3","--card","--card2",
  "--border","--border-strong","--text","--text-mid","--text-light",
  "--info-body-text","--info-label-text",
  "--accent-tint-1","--accent-tint-2","--accent-tint-3",
  "--accent-tint-4","--accent-tint-5","--accent-bg-deep",
  "--nav-bg","--nav-bg-mobile",
  "--hero-overlay-start","--hero-overlay-mid","--hero-overlay-fade",
  "--auth-overlay-start","--auth-overlay-mid",
  "--streak-label","--streak-text","--streak-sub",
  "--banner-label","--banner-heading","--banner-pill-bg","--banner-pill-text",
  "--banner-track","--banner-track-fill","--banner-btn-bg","--banner-btn-border",
];

function applySettings(s){
  const theme=THEMES[s.theme];
  const fallback=THEMES.dark.vars;
  let vars;
  if(s.theme==="custom"){
    vars=buildCustomVars(s.customAccent||"#FF3B3B",s.customBg||"#070709");
  } else {
    vars=theme?{...fallback,...theme.vars}:{...fallback};
  }
  // Compute and merge derived tint tokens from the resolved accent + bg
  const accentHex=vars["--accent"]||"#FF3B3B";
  const bgHex=vars["--bg"]||"#070709";
  Object.assign(vars,buildTints(accentHex,bgHex));
  // Inject streak/banner defaults for themes that don't specify them
  if(!vars["--streak-label"]){
    const bgRgb=hexToRgb(bgHex);
    const isLight=relativeLuminance(bgRgb)>0.179;

  const root=document.documentElement;
  // Write every managed variable; use removeProperty for any gaps so
  // stale values from a prior theme can never persist.
  ALL_THEME_VARS.forEach(k=>{

      ? root.style.setProperty(k,vars[k])
